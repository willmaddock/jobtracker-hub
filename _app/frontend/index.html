function ManagePage({onRefreshApps, meta, onCategoriesChanged}){
  const [data, setData] = useState(null);
  const [err, setErr] = useState(null);
  const [canonicalChoice, setCanonicalChoice] = useState({});
  const [archSelected, setArchSelected] = useState(() => new Set());
  const [archBusy, setArchBusy] = useState(false);
  const [archErr, setArchErr] = useState(null);
  const [categories, setCategories] = useState(null);
  const [catErr, setCatErr] = useState(null);
  const [catBusy, setCatBusy] = useState(false);

  const load = () => apiGet("/api/manage").then(setData).catch(e => setErr(String(e.message||e)));
  const loadCategories = () => apiGet("/api/categories").then(setCategories).catch(e => setCatErr(String(e.message||e)));
  useEffect(() => { load(); loadCategories(); }, []);

  if (err) return <EmptyState icon={"\u26A0\uFE0F"} title="Couldn't load Manage" sub={err} />;
  if (!data) return <EmptyState icon={"\u23F3"} title="Loading…" />;

  const suggestions = Object.entries(data.duplicate_suggestions || {});

  return (
    <div>
      <h1 className="page-title">Manage</h1>

      <div className="section-label">
        Merge duplicate companies{suggestions.length > 0 ? ` — ${suggestions.length} suggestion${suggestions.length===1?"":"s"} to review` : ""}
      </div>
      <p className="page-sub">
        These look like the same company split across folders (e.g. spelling or spacing differences). Merging
        only changes how they're grouped and displayed in this app — <b>your files on disk are never touched</b>,
        and you can undo any merge below at any time.
      </p>
      {suggestions.length === 0 && <EmptyState icon={"\u2728"} title="All clear" sub="No unresolved duplicate suggestions right now." />}
      {suggestions.map(([key, names]) => (
        <div className="list-card" key={key}>
          <div className="list-card-body">
            <div>{names.map(n => <b key={n} style={{marginRight:8}}>{n}</b>)}</div>
            <div style={{display:"flex", gap:8, marginTop:10, alignItems:"center"}}>
              <span style={{fontSize:12, color:"var(--text-soft)"}}>Keep as:</span>
              <select className="field" value={canonicalChoice[key] || names[0]} onChange={e => setCanonicalChoice({...canonicalChoice, [key]:e.target.value})}
                style={{background:"var(--bg)", border:"1px solid var(--border)", color:"var(--text)", borderRadius:6, padding:"6px 10px"}}>
                {names.map(n => <option key={n} value={n}>{n}</option>)}
              </select>
              <button className="btn primary" onClick={async () => {
                await apiPost("/api/manage/merge", {names, canonical: canonicalChoice[key] || names[0]});
                await load(); onRefreshApps();
              }}>Merge</button>
            </div>
          </div>
        </div>
      ))}

      <div className="section-label">Current merges</div>
      {Object.keys(data.aliases||{}).length === 0 && <EmptyState icon={"\u{1F517}"} title="No merges yet" />}
      {Object.entries(data.aliases||{}).map(([alias, canonical]) => (
        <div className="list-card" key={alias} style={{alignItems:"center"}}>
          <div className="list-card-body" style={{display:"flex", justifyContent:"space-between", alignItems:"center"}}>
            <span>{alias} &nbsp;→&nbsp; <b>{canonical}</b></span>
            <button className="btn" onClick={async () => { await apiPost("/api/manage/unmerge", {alias}); await load(); onRefreshApps(); }}>Undo</button>
          </div>
        </div>
      ))}

      <div style={{marginTop:28, paddingTop:4, borderTop:"1px solid var(--border)"}} />
      <div className="section-label" style={{display:"flex", alignItems:"center", gap:8}}>
        <span>Duplicate documents</span>
        <span className="badge" style={{background:"var(--border)", color:"var(--text-soft)", border:"none"}}>informational — no action needed</span>
      </div>
      <p className="page-sub">
        Byte-identical files found in more than one place — nothing to fix here, every copy stays exactly where it
        is. Mostly this is expected: reusing one master resume/cover-letter across many applications is normal and
        shows up as a large group below. Worth a second look only if a group spans companies that shouldn't share a
        file (e.g. a cover letter meant for one company saved under another).
      </p>
      {(data.duplicate_documents||[]).length === 0 && <EmptyState icon={"\u2728"} title="No exact duplicates found" />}
      {(data.duplicate_documents||[]).map(g => (
        <div className="list-card" key={g.content_hash} style={{opacity:0.85}}>
          <div className="list-card-body">
            <div style={{fontSize:12, color:"var(--text-mute)", marginBottom:6}}>{g.documents.length} identical copies</div>
            {g.documents.map(d => (
              <div key={d.relpath} style={{fontSize:13, padding:"2px 0"}}>
                <b>{d.company}</b>{d.role_label && d.role_label !== "(root)" ? ` — ${d.role_label}` : ""} &nbsp;
                <span style={{color:"var(--text-soft)"}}>{d.filename}</span>
              </div>
            ))}
          </div>
        </div>
      ))}

      <div className="section-label">Archived applications</div>
      {(() => {
        const archived = data.archived || [];
        const toggleOne = (id) => setArchSelected(prev => {
          const next = new Set(prev);
          if (next.has(id)) next.delete(id); else next.add(id);
          return next;
        });
        const toggleAll = () => setArchSelected(prev => prev.size === archived.length ? new Set() : new Set(archived.map(a => a.id)));

        const runDelete = async (ids) => {
          if (ids.length === 0) return;
          const label = ids.length === 1
            ? (archived.find(a => a.id === ids[0]) || {}).effective_company || "this application"
            : `${ids.length} applications`;
          const confirmMsg = ids.length === 1
            ? `Permanently delete ${label}? Its folder goes to the OS Trash (recoverable there), and it's removed from the app.`
            : `Permanently delete ${label}? Each folder goes to the OS Trash (recoverable there), and they're removed from the app.`;
          if (!window.confirm(confirmMsg)) return;
          setArchBusy(true);
          setArchErr(null);
          try {
            if (ids.length === 1) {
              await apiPost(`/api/applications/${ids[0]}/delete`, {});
            } else {
              const r = await apiPost("/api/applications/bulk-delete", {item_ids: ids});
              if ((r.failed||[]).length > 0) {
                setArchErr(
                  `${r.deleted.length} deleted, ${r.failed.length} couldn't be deleted: ` +
                  r.failed.map(f => `#${f.id} (${f.error})`).join("; ")
                );
              }
            }
            setArchSelected(new Set());
            await load(); onRefreshApps();
          } catch (e) {
            setArchErr(String(e.message||e));
          } finally {
            setArchBusy(false);
          }
        };

        if (archived.length === 0) return <EmptyState icon={"\u{1F4E6}"} title="Nothing archived" />;

        return (
          <div>
            {archErr && <div className="warning-banner" style={{marginBottom:10}}>{archErr}</div>}

            <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", gap:8, marginBottom:10, flexWrap:"wrap"}}>
              <label style={{display:"flex", alignItems:"center", gap:8, color:"var(--text-soft)", fontSize:12}}>
                <input type="checkbox" className="select-checkbox" checked={archSelected.size === archived.length} onChange={toggleAll} /> Select all
              </label>
              <button className="btn danger-outline small" disabled={archBusy} onClick={() => runDelete(archived.map(a => a.id))}>
                Delete all archived ({archived.length})
              </button>
            </div>

            {archSelected.size > 0 && (
              <div className="bulk-bar">
                <span className="count">{archSelected.size} selected</span>
                <button className="btn danger-outline small" disabled={archBusy} onClick={() => runDelete(Array.from(archSelected))}>Delete selected</button>
                <button className="btn subtle small" onClick={() => setArchSelected(new Set())}>Clear</button>
              </div>
            )}

            {archived.map(a => (
              <div className="list-card" key={a.id} style={{alignItems:"center"}}>
                <input type="checkbox" className="select-checkbox" checked={archSelected.has(a.id)} onChange={() => toggleOne(a.id)} />
                <div className="list-card-body" style={{display:"flex", justifyContent:"space-between", alignItems:"center"}}>
                  <span>{a.effective_company}{roleSuffix(a)}</span>
                  <div style={{display:"flex", gap:8}}>
                    <button className="btn" disabled={archBusy} onClick={async () => {
                      await apiPost(`/api/applications/${a.id}/override`, {archived:false});
                      await load(); onRefreshApps();
                    }}>Unarchive</button>
                    <button className="btn danger-outline" disabled={archBusy} onClick={() => runDelete([a.id])}>Delete</button>
                  </div>
                </div>
              </div>
            ))}
          </div>
        );
      })()}

      <div style={{marginTop:28, paddingTop:4, borderTop:"1px solid var(--border)"}} />
      <div className="section-label">Categories</div>
      <p className="page-sub">
        Every physical folder behind a Browse tab except Applications — Certifications and
        "Degree and Transcrips" list separately here even though both show under one "Credentials"
        tab, so you can archive or delete just one of them. Archiving hides a folder from Browse and
        Search without touching any files; deleting it moves that folder to the OS Trash (recoverable
        there) and requires it to be archived first.
      </p>
      {catErr && <div className="warning-banner" style={{marginBottom:10}}>{catErr}</div>}
      {categories === null && !catErr && <EmptyState icon={"\u23F3"} title="Loading…" />}
      {categories !== null && categories.length === 0 && <EmptyState icon={"\u{1F5C2}\uFE0F"} title="No categories yet" />}
      {(categories || []).map(c => {
        const tabLabel = (meta && meta.section_labels && meta.section_labels[c.section]) || DEFAULT_SECTION_LABELS[c.section] || prettifySection(c.section);
        const folderPath = c.folder.split("/").map(encodeURIComponent).join("/");
        const runCategoryDelete = async () => {
          const confirmMsg = `Permanently delete "${c.folder}"? It goes to the OS Trash `
            + `(recoverable there), and it's removed from the app.`;
          if (!window.confirm(confirmMsg)) return;
          setCatBusy(true);
          setCatErr(null);
          try {
            await apiPost(`/api/categories/${folderPath}/delete`, {});
            await loadCategories();
            onCategoriesChanged && onCategoriesChanged();
          } catch (e) {
            setCatErr(String(e.message||e));
          } finally {
            setCatBusy(false);
          }
        };
        return (
          <div className="list-card" key={c.folder} style={{alignItems:"center"}}>
            <div className="list-card-body" style={{display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:8}}>
              <div>
                <div>
                  <b>{c.folder}</b>
                  <span className="badge" style={{marginLeft:8, background:"var(--border)", color:"var(--text-soft)", border:"none"}}>{tabLabel}</span>
                  {c.archived && <span className="badge" style={{marginLeft:8, background:"var(--border)", color:"var(--text-soft)", border:"none"}}>archived</span>}
                </div>
                <div style={{fontSize:12, color:"var(--text-mute)", marginTop:2}}>
                  {c.item_count} item{c.item_count===1?"":"s"}, {c.doc_count} document{c.doc_count===1?"":"s"}
                </div>
              </div>
              <div style={{display:"flex", gap:8}}>
                {c.archived ? (
                  <button className="btn" disabled={catBusy} onClick={async () => {
                    setCatBusy(true);
                    try { await apiPost(`/api/categories/${folderPath}/override`, {archived:false}); await loadCategories(); onCategoriesChanged && onCategoriesChanged(); }
                    catch (e) { setCatErr(String(e.message||e)); }
                    finally { setCatBusy(false); }
                  }}>Unarchive</button>
                ) : (
                  <button className="btn" disabled={catBusy} onClick={async () => {
                    setCatBusy(true);
                    try { await apiPost(`/api/categories/${folderPath}/override`, {archived:true}); await loadCategories(); onCategoriesChanged && onCategoriesChanged(); }
                    catch (e) { setCatErr(String(e.message||e)); }
                    finally { setCatBusy(false); }
                  }}>Archive</button>
                )}
                <button className="btn danger-outline" disabled={catBusy || !c.archived} title={!c.archived ? "Archive this category first" : ""} onClick={runCategoryDelete}>Delete</button>
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

function RenameModal({doc, onClose, onSave}){
  const [name, setName] = useState(doc.filename);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const inputRef = useRef(null);

  useEffect(() => {
    // Select just the stem (not the extension) so typing immediately
    // replaces the meaningful part of the name, same as Finder/Explorer
    // rename-in-place.
    if (inputRef.current) {
      const dot = doc.filename.lastIndexOf(".");
      inputRef.current.focus();
      inputRef.current.setSelectionRange(0, dot > 0 ? dot : doc.filename.length);
    }
  }, []);

  const save = async () => {
    const trimmed = name.trim();
    if (!trimmed || trimmed === doc.filename) { onClose(); return; }
    if (trimmed.includes("/") || trimmed.includes("\\")) { setError("Filename can't contain / or \\"); return; }
    setBusy(true);
    setError(null);
    try { await onSave(trimmed); onClose(); }
    catch (e) { setError(e.message || "Rename failed."); setBusy(false); }
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()} style={{position:"relative", maxWidth:420}}>
        <button className="close-x" onClick={onClose}>{"\u2715"}</button>
        <h2>Rename file</h2>
        <p style={{color:"var(--text-mute)", fontSize:12, marginTop:6}}>
          Renames the actual file on disk in place — same folder, new name.
        </p>
        <input ref={inputRef} className="btn" style={{width:"100%"}} type="text" value={name}
          onChange={e => setName(e.target.value)}
          onKeyDown={e => { if (e.key === "Enter") save(); if (e.key === "Escape") onClose(); }} />
        {error && <div style={{color:"#F87171", fontSize:12, marginTop:8}}>{error}</div>}
        <div style={{display:"flex", justifyContent:"flex-end", gap:8, marginTop:14}}>
          <button className="btn" onClick={onClose} disabled={busy}>Cancel</button>
          <button className="btn primary" disabled={busy} onClick={save}>Save</button>
        </div>
      </div>
    </div>
  );
}

/* =========================== NEW APPLICATION MODAL =========================== */
// Creates Applications/<Company>/[<Role>/] on disk (via POST
// /api/applications/new, backed by build_index.py's
// create_application_folder — the exact same helper the Streamlit app's
// "+ New Application" form uses) and does a full rebuild, then hands back
// the new item_id so the caller can jump straight to it in Pipeline. This
// is the only place in the app that creates a folder rather than just
// reading/renaming/trashing files inside ones that already exist.
function NewApplicationModal({onClose, onCreate, meta}){
  const [company, setCompany] = useState("");
  const [role, setRole] = useState("");
  const [status, setStatus] = useState("drafted");
  const [selectedFiles, setSelectedFiles] = useState([]);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const inputRef = useRef(null);
  const fileInputRef = useRef(null);
  const statusOrder = (meta && meta.status_order) || DEFAULT_STATUS_ORDER;

  useEffect(() => { if (inputRef.current) inputRef.current.focus(); }, []);

  const addFiles = (fileList) => {
    if (!fileList || !fileList.length) return;
    setSelectedFiles(prev => [...prev, ...Array.from(fileList)]);
  };
  const removeFile = (idx) => setSelectedFiles(prev => prev.filter((_, i) => i !== idx));

  const create = async () => {
    const trimmed = company.trim();
    if (!trimmed) { setError("Company name is required."); return; }
    setBusy(true);
    setError(null);
    try { await onCreate(trimmed, role.trim(), selectedFiles, status); onClose(); }
    catch (e) { setError(e.message || "Couldn't create application."); setBusy(false); }
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()} style={{position:"relative", maxWidth:460}}>
        <button className="close-x" onClick={onClose}>{"\u2715"}</button>
        <h2>New application</h2>
        <p style={{color:"var(--text-mute)", fontSize:12, marginTop:6}}>
          Creates a real folder — <code>Applications/{company.trim() || "Company"}{role.trim() ? `/${role.trim()}` : ""}</code> —
          then rebuilds the index. Nothing else on disk is touched.
        </p>

        <div className="section-label" style={{marginTop:14}}>Company</div>
        <input ref={inputRef} className="btn" style={{width:"100%"}} type="text" value={company}
          placeholder="e.g. Acme Corp" onChange={e => setCompany(e.target.value)}
          onKeyDown={e => { if (e.key === "Escape") onClose(); }} />

        <div className="section-label" style={{marginTop:12}}>Role (optional)</div>
        <input className="btn" style={{width:"100%"}} type="text" value={role}
          placeholder="e.g. Software Engineer II" onChange={e => setRole(e.target.value)}
          onKeyDown={e => { if (e.key === "Enter" && !busy) create(); if (e.key === "Escape") onClose(); }} />

        <div className="section-label" style={{marginTop:12}}>Status</div>
        <select className="btn" style={{width:"100%"}} value={status} onChange={e => setStatus(e.target.value)}>
          {statusOrder.map(s => <option key={s} value={s}>{s[0].toUpperCase()+s.slice(1)}</option>)}
        </select>
        <p style={{color:"var(--text-mute)", fontSize:11, marginTop:4}}>
          Defaults to Drafted. Pick Applied/Interviewing if you're logging one you already sent.
        </p>

        <div className="section-label" style={{marginTop:12}}>Starting documents (optional)</div>
        <div className={"dropzone compact" + (busy ? " busy" : "")}
          onDragOver={e => e.preventDefault()}
          onDrop={e => { e.preventDefault(); addFiles(e.dataTransfer.files); }}
          onClick={() => !busy && fileInputRef.current && fileInputRef.current.click()}>
          <input ref={fileInputRef} type="file" multiple style={{display:"none"}}
            onChange={e => { addFiles(e.target.files); e.target.value = ""; }} />
          <span className="dropzone-icon">{"\u{1F4CE}"}</span>
          <span>Drag a resume/cover letter here, or click to browse</span>
        </div>
        {selectedFiles.length > 0 && (
          <div style={{marginTop:8, display:"flex", flexDirection:"column", gap:4}}>
            {selectedFiles.map((f, i) => (
              <div key={i} style={{display:"flex", alignItems:"center", justifyContent:"space-between", fontSize:12, color:"var(--text-soft)"}}>
                <span>{f.name}</span>
                <button className="btn subtle" style={{padding:"2px 8px"}} disabled={busy} onClick={() => removeFile(i)}>Remove</button>
              </div>
            ))}
          </div>
        )}
        {selectedFiles.length === 0 && (
          <p style={{color:"var(--text-mute)", fontSize:11, marginTop:6}}>
            No files? A placeholder note gets added so the application still shows up right away.
          </p>
        )}

        {error && <div style={{color:"#F87171", fontSize:12, marginTop:10}}>{error}</div>}
        <div style={{display:"flex", justifyContent:"flex-end", gap:8, marginTop:14}}>
          <button className="btn" onClick={onClose} disabled={busy}>Cancel</button>
          <button className="btn primary" disabled={busy || !company.trim()} onClick={create}>
            {busy ? "Creating\u2026" : "Create application"}
          </button>
        </div>
      </div>
    </div>
  );
}

function DiagnosticsSection(){
  const [open, setOpen] = useState(false);
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  const [revealMsg, setRevealMsg] = useState(null);
  const [copyMsg, setCopyMsg] = useState(null);

  const toggle = async () => {
    const next = !open;
    setOpen(next);
    if (next && !data && !error) {
      try { setData(await apiGet("/api/diagnostics")); }
      catch (e) { setError(String(e.message || e)); }
    }
  };

  const revealLog = async () => {
    setRevealMsg(null);
    try { await apiPost("/api/diagnostics/reveal-log"); setRevealMsg("Opened."); }
    catch (e) { setRevealMsg(String(e.message || e)); }
  };

  const copyReport = async () => {
    const report = JSON.stringify(data, null, 2);
    try { await navigator.clipboard.writeText(report); setCopyMsg("Copied."); }
    catch (e) { setCopyMsg("Couldn't copy — select and copy manually."); }
  };

  return (
    <>
      <div className="section-label" style={{marginTop:16, cursor:"pointer", display:"flex", alignItems:"center", gap:6}} onClick={toggle}>
        <span style={{fontSize:9, transform: open ? "rotate(90deg)" : "none", display:"inline-block", transition:"transform .12s"}}>{"\u25B6"}</span>
        Diagnostics
      </div>
      {open && (
        <div>
          {error && <div className="warning-banner" style={{marginTop:6}}>{error}</div>}
          {!error && !data && <p style={{color:"var(--text-mute)", fontSize:11.5}}>Loading…</p>}
          {data && (
            <>
              <p style={{color:"var(--text-mute)", fontSize:11.5, lineHeight:1.6, fontFamily:"monospace"}}>
                Mode: {data.packaged ? "packaged" : "dev"}<br/>
                Port: {data.port || "n/a"}<br/>
                Platform: {data.platform}<br/>
                Python: {data.python_version}<br/>
                {data.state_dir && <>State dir: <code>{data.state_dir}</code><br/></>}
                {data.log_path && <>Log file: <code>{data.log_path}</code> {data.log_exists ? "" : "(not written yet)"}<br/></>}
                {data.workspace ? (
                  <>Workspace: {data.workspace.name} {"\u2022"} {data.workspace.index_built ? "index built" : "index not built"}</>
                ) : (
                  <>Workspace: none linked yet</>
                )}
              </p>
              <div style={{display:"flex", gap:8, marginTop:8, flexWrap:"wrap", alignItems:"center"}}>
                <button className="btn small" onClick={revealLog} disabled={!data.state_dir}>
                  Reveal log file
                </button>
                <button className="btn small" onClick={copyReport}>Copy diagnostic report</button>
                {revealMsg && <span style={{color:"var(--text-mute)", fontSize:11}}>{revealMsg}</span>}
                {copyMsg && <span style={{color:"var(--text-mute)", fontSize:11}}>{copyMsg}</span>}
              </div>
              {!data.state_dir && (
                <p style={{color:"var(--text-mute)", fontSize:11, marginTop:6}}>
                  Running in dev mode — logs go straight to this terminal, there's no separate log file.
                </p>
              )}
            </>
          )}
        </div>
      )}
    </>
  );
}

/* =========================== COMMAND PALETTE (⌘K / Ctrl+K) =========================== */
function CommandPalette({apps, onClose, setPage, setSelectedKey, doRebuild, fireToast, onNewApp, onNewCategory}){
  const [q, setQ] = useState("");
  const [activeIdx, setActiveIdx] = useState(0);
  const inputRef = useRef(null);

  useEffect(() => { if (inputRef.current) inputRef.current.focus(); }, []);

  const navActions = [
    {id:"new-app", label:"New application", sub:"Action", run:() => { onClose(); onNewApp(); }},
    {id:"new-category", label:"New category", sub:"Action", run:() => { onClose(); onNewCategory(); }},
    {id:"nav-pipeline", label:"Go to Pipeline", sub:"View", run:() => setPage("pipeline")},
    {id:"nav-attention", label:"Go to Needs Attention", sub:"View", run:() => setPage("attention")},
    {id:"nav-browse", label:"Go to Browse by Section", sub:"View", run:() => setPage("browse")},
    {id:"nav-hub", label:"Go to Search Hub", sub:"View", run:() => setPage("hub")},
    {id:"nav-insights", label:"Go to Insights", sub:"View", run:() => setPage("insights")},
    {id:"nav-manage", label:"Go to Manage", sub:"View", run:() => setPage("manage")},
    {id:"rebuild", label:"Rebuild index", sub:"Action", run:async () => { fireToast("Rebuilding…"); await doRebuild(); }},
  ];

  const ql = q.trim().toLowerCase();
  const matchedApps = ql
    ? apps.filter(a => (a.effective_company + " " + a.role_label).toLowerCase().includes(ql)).slice(0, 8)
    : [];
  const matchedActions = ql ? navActions.filter(a => a.label.toLowerCase().includes(ql)) : navActions;

  const results = [
    ...matchedActions.map(a => ({kind:"action", ...a})),
    ...matchedApps.map(a => ({kind:"app", id:a.id, label:a.effective_company, sub:a.role_label !== "(root)" ? a.role_label : "Application", app:a})),
  ];

  useEffect(() => { setActiveIdx(0); }, [q]);

  const runResult = (r) => {
    if (!r) return;
    if (r.kind === "action") { r.run(); }
    else { setPage("pipeline"); setSelectedKey(r.app.id); }
    onClose();
  };

  const onKeyDown = (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); setActiveIdx(i => Math.min(results.length - 1, i + 1)); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setActiveIdx(i => Math.max(0, i - 1)); }
    else if (e.key === "Enter") { e.preventDefault(); runResult(results[activeIdx]); }
    else if (e.key === "Escape") { e.preventDefault(); onClose(); }
  };

  return (
    <div className="palette-backdrop" onClick={onClose}>
      <div className="palette" onClick={e => e.stopPropagation()}>
        <ClearableInput inputRef={inputRef} className="palette-input" wrapStyle={{width:"100%"}}
          placeholder={`Search ${apps.length} applications, jump to a view, or rebuild the index…`}
          value={q} onChange={e => setQ(e.target.value)} onKeyDown={onKeyDown} />
        <div className="palette-results">
          {results.length === 0 && <div className="palette-empty">No matches.</div>}
          {matchedActions.length > 0 && <div className="palette-group">Views &amp; actions</div>}
          {matchedActions.map((a, i) => (
            <div key={a.id} className={"palette-item" + (results[activeIdx] && results[activeIdx].id===a.id ? " active":"")}
              onMouseEnter={() => setActiveIdx(results.findIndex(r => r.id===a.id))}
              onClick={() => runResult({kind:"action", ...a})}>
              <span>{a.label}</span><span className="sub">{a.sub}</span>
            </div>
          ))}
          {matchedApps.length > 0 && <div className="palette-group">Applications</div>}
          {matchedApps.map(a => {
            const r = {kind:"app", id:a.id, label:a.effective_company, sub:a.role_label !== "(root)" ? a.role_label : "Application", app:a};
            return (
              <div key={a.id} className={"palette-item" + (results[activeIdx] && results[activeIdx].id===r.id ? " active":"")}
                onMouseEnter={() => setActiveIdx(results.findIndex(x => x.id===r.id))}
                onClick={() => runResult(r)}>
                <span><Highlight text={r.label} query={q} /></span><span className="sub">{r.sub}</span>
              </div>
            );
          })}
        </div>
        <div className="palette-footer">
          <span><span className="kbd">↑</span><span className="kbd">↓</span> navigate</span>
          <span><span className="kbd">Enter</span> select</span>
          <span><span className="kbd">Esc</span> close</span>
        </div>
      </div>
    </div>
  );
}

/* =========================== INLINE DOCUMENT VIEWER DRAWER (glassmorphic) =========================== */
function ViewerDrawer({doc, onClose, onOpen}){
  const ext = ((doc && doc.ext) || "").toLowerCase();
  const [docxHtml, setDocxHtml] = useState(null);
  const [docxErr, setDocxErr] = useState(null);
  const [docxLoading, setDocxLoading] = useState(false);

  // Runs whenever the viewed doc changes (not just on mount) — the drawer
  // stays mounted while you click between docs, so this can't be a
  // one-time fetch. .docx has no browser-native renderer, unlike the
  // plain-text/PDF formats below, so it needs a converted-HTML round trip
  // to the backend instead of pointing an <iframe> straight at /api/file.
  useEffect(() => {
    setDocxHtml(null); setDocxErr(null);
    if (!doc || ext !== ".docx") return;
    setDocxLoading(true);
    apiGet(`/api/preview-docx?relpath=${encodeURIComponent(doc.relpath)}`)
      .then(r => setDocxHtml(r.html))
      .catch(e => setDocxErr(String(e.message || e)))
      .finally(() => setDocxLoading(false));
  }, [doc && doc.relpath]);

  if (!doc) return null;
  const src = `${API_BASE}/api/file?relpath=${encodeURIComponent(doc.relpath)}`;
  const isFrameable = ext === ".pdf" || ext === ".md" || ext === ".markdown" || ext === ".txt" || ext === ".tex";
  return (
    <div className="viewer-backdrop" onClick={onClose}>
      <div className="viewer-drawer" onClick={e => e.stopPropagation()}>
        <div className="viewer-header">
          <div className="viewer-title" title={doc.filename}>{doc.filename}</div>
          <button className="btn small" onClick={() => onOpen(doc.relpath)}>Open in OS</button>
          {/* Real <a download> on a real (non-blob) URL -- not a stand-in
              for the WKWebView PDF plugin's own broken toolbar button.
              pywebview's Cocoa delegate specifically watches for
              shouldPerformDownload() on a genuine link navigation (added
              5.4, "Cocoa: support for the download attribute on links")
              and routes it to a native save panel via ALLOW_DOWNLOADS.
              That's a different code path from the inline PDF plugin's
              own UI, which has no such hook -- see launcher.py's
              ALLOW_DOWNLOADS comment for why that one can't be fixed the
              same way. Works unchanged in a plain browser tab too. */}
          <a className="btn small" href={src} download={doc.filename}>Download</a>
          <button className="btn small" onClick={onClose}>{"\u2715 Close (Esc)"}</button>
        </div>
        {/* The PDF pane below embeds WebKit's own native PDF plugin, whose
            save/download icon is a closed native affordance we can't wire
            up (see the Download button comment above) -- zoom in that same
            toolbar does work, since it's render-only. This hint just steers
            people to the buttons above that actually save the file, instead
            of them bouncing off the native icon and assuming the app is
            broken. */}
        {ext === ".pdf" && (
          <div className="viewer-pdf-hint">Use Download or Open in OS above to save this file.</div>
        )}
        <div className="viewer-body">
          {ext === ".pdf"
            ? <embed className="viewer-frame" src={src} type="application/pdf" />
            : ext === ".docx"
              ? (docxLoading
                  ? <div className="viewer-unsupported">{"\u23F3"} Converting for preview…</div>
                  : docxErr
                    ? (
                      <div className="viewer-unsupported">
                        <div>{"\u{1F4C4}"} Couldn't preview this .docx ({docxErr}).</div>
                        <button className="btn primary" onClick={() => onOpen(doc.relpath)}>Open in OS</button>
                      </div>
                    )
                    : <iframe className="viewer-frame" title={doc.filename}
                        srcDoc={`<style>body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;max-width:760px;margin:24px auto;padding:0 24px 40px;line-height:1.55;color:#1e293b;}img{max-width:100%;}</style>${docxHtml || ""}`} />
                )
              : isFrameable
                ? <iframe className="viewer-frame" src={src} title={doc.filename} />
                : (
                  <div className="viewer-unsupported">
                    <div>{"\u{1F4C4}"} No inline preview for this file type.</div>
                    <button className="btn primary" onClick={() => onOpen(doc.relpath)}>Open in OS</button>
                  </div>
                )}
        </div>
      </div>
    </div>
  );
}

        <p>
          Every tracker is just a folder on disk. Start a fresh one, bring in
          a copy of an existing tracker, or {packaged ? "point straight at a folder you already have." : "point _app/ at one by running it from inside that folder."}
        </p>
        {error && <div className="warning-banner">{error}</div>}
        <TrackerCreationActions layout="onboarding" packaged={packaged} onError={setError} />
      </div>
    </div>
  );
}

function Onboarding({root, onRebuild}){
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const submit = async () => {
    setBusy(true); setError(null);
    try { await onRebuild(); }
    catch (e) { setError(String(e.message || e)); }
    finally { setBusy(false); }
  };
  return (
    <div className="center-screen">
      <div className="onboard-card">
        <h1>{"\u{1F5C2}\uFE0F"} Welcome to your JobTracker Hub</h1>
        <p>
          <code>_app/</code> is nested inside your JobTracker folder, so it already knows what to
          index — <code>{root || "the folder it's sitting in"}</code>. Click below to build the
          index. Nothing on disk is modified — this only reads your files to build a searchable index.
        </p>
        {error && <div className="warning-banner">{error}</div>}
        <button className="btn primary" disabled={busy} onClick={submit} style={{width:"100%", marginTop:8, padding:"10px 0"}}>
          {busy ? "Scanning your folders…" : "\u{1F504} Build index"}
        </button>
      </div>
    </div>
  );
}

/* =========================== APP ROOT =========================== */
// Top-level safety net: without this, an uncaught render error anywhere in
// the tree (a bad CDN load, an unexpected API shape, etc.) unmounts the
// entire app and leaves a blank white page with no way back except a full
// reload. This catches it, shows what broke, and offers a reload — so one
// page's bug can't take down navigation, pipeline, everything.
class ErrorBoundary extends React.Component {
  constructor(props){ super(props); this.state = {error: null}; }
  static getDerivedStateFromError(error){ return {error}; }
  componentDidCatch(error, info){ console.error("Render error:", error, info); }
  render(){
    if (this.state.error) {
      return (
        <div className="center-screen">
          <div className="onboard-card">
            <h1>{"\u26A0\uFE0F"} Something went wrong</h1>
            <p>{String(this.state.error.message || this.state.error)}</p>
            <button className="btn primary" style={{width:"100%", marginTop:8, padding:"10px 0"}}
              onClick={() => { this.setState({error: null}); window.location.reload(); }}>
              Reload
            </button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

function App(){
  const cached = useMemo(loadCache, []);
  const initialUrl = useMemo(readUrlState, []);
  const theme = useTheme();

  const [connError, setConnError] = useState(false);
  const [statusInfo, setStatusInfo] = useState(cached && cached.statusInfo || null);
  const [apps, setApps] = useState(cached && cached.apps || []);
  const [docsByItemId, setDocsByItemId] = useState({});
  // Application Dossier (Checkpoint 4), keyed by item id — mirrors
  // docsByItemId's cache-then-invalidate pattern exactly: undefined means
  // "never fetched" (ensureDossier below fetches once), and any document
  // mutation just evicts the entry and lets ensureDossier re-fetch it next
  // time the item is selected, rather than trying to patch the merged
  // contacts/role-section result in place.
  const [dossierByItemId, setDossierByItemId] = useState({});
  // Bumped on every document mutation (upload/rename/delete/fix-type).
  // Pipeline reads straight from docsByItemId, but Browse fetches its own
  // copy via /api/browse independently — this is what tells Browse its
  // copy is stale without duplicating the same patch logic in two places.
  const [docsVersion, setDocsVersion] = useState(0);
  // Docs mid undo-window: hidden immediately on delete-click, actually
  // trashed only once the window elapses (see requestDelete below).
  const [pendingDeleteIds, setPendingDeleteIds] = useState(() => new Set());
  const [undoToast, setUndoToast] = useState(null); // {id, filename}
  // Separate from the normal 2.2s auto-toast: delete/upload failures can
  // carry a long, specific explanation (e.g. a macOS permissions fix) that
  // needs actual read time and a manual dismiss, not a quick flash.
  const [errorToast, setErrorToast] = useState(null); // {message}
  // Post-import toast (zip success / browser-folder-import warning) --
  // read once from sessionStorage on mount, since it has to survive the
  // window.location.reload() the import flow just did. See
  // IMPORT_NOTICE_KEY above for what writes it and why.
  const [importNotice, setImportNotice] = useState(null); // {type: "success"|"warning", message}
  const deleteTimers = useRef({});
  const [page, setPageState] = useState(initialUrl.view);
  const [selectedKey, setSelectedKeyState] = useState(initialUrl.selected);
  const [searchQuery, setSearchQuery] = useState("");
  // Browse-by-Section defaults to the grouped, per-application view (full
  // document set, with delete/rename/fix-type actions) even while a search
  // query is typed — it used to swap entirely to the flat SearchPage, which
  // has no doc-management actions on it at all and only shows one row per
  // matching file. The flat view is still available via the toggle above.
  const [browseSearchMode, setBrowseSearchMode] = useState("grouped");
  const [showPersonal, setShowPersonal] = useState(false);
  const [showSource, setShowSource] = useState(false);
  const [fixTypeDoc, setFixTypeDoc] = useState(null);
  const [renameDoc, setRenameDoc] = useState(null);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [newAppOpen, setNewAppOpen] = useState(false);
  const [newCategoryOpen, setNewCategoryOpen] = useState(false);
  const [paletteOpen, setPaletteOpen] = useState(false);
  const [workspacePopoverOpen, setWorkspacePopoverOpen] = useState(false);
  const [viewerDoc, setViewerDoc] = useState(null);
  const [pendingIds, setPendingIds] = useState(() => new Set());
  const [toast, fireToast] = useToast();

  const meta = statusInfo || {};

  // URL-driven state: ?view=&selected= always mirrors {page, selectedKey}
  // (selectedKey is the numeric application id) so the current view/
  // selection is a shareable/bookmarkable link.
  const setPage = useCallback((p) => setPageState(p), []);
  const setSelectedKey = useCallback((k) => setSelectedKeyState(k), []);
  useEffect(() => { writeUrlState(page, selectedKey); }, [page, selectedKey]);

  const refreshStatus = useCallback(() => apiGet("/api/status").then(s => { setStatusInfo(s); setConnError(false); return s; }).catch(() => { setConnError(true); throw new Error("offline"); }), []);
  const refreshApps = useCallback(() => apiGet("/api/applications").then(setApps).catch(() => {}), []);

  useEffect(() => {
    refreshStatus().then(s => { if (s.index_built) refreshApps(); }).catch(() => {});
    const iv = setInterval(() => { refreshStatus().catch(()=>{}); }, 15000);
    return () => clearInterval(iv);
  }, []);

  // Consume the one-shot post-import notice, if the reload that brought
  // us here was from an import flow. Cleared immediately so refreshing
  // the page manually afterward doesn't re-show it.
  useEffect(() => {
    let kind = null;
    try { kind = sessionStorage.getItem(IMPORT_NOTICE_KEY); sessionStorage.removeItem(IMPORT_NOTICE_KEY); } catch(e) { /* best-effort */ }
    let notice = null;
    if (kind === "zip-success") {
      notice = {type: "success", message: "Zip successfully imported with all notes, statuses, and dates preserved."};
    } else if (kind === "folder-warning") {
      const suggestChrome = suspectedNoDotfileFolderUpload();
      const message = suggestChrome
        ? "Files were imported, but any existing notes, statuses, or dates didn't come across — your browser didn't include hidden files in the folder upload. Chrome has carried these across successfully in testing, or export a .zip from the original tracker for a complete copy every time."
        : "Files were imported, but any existing notes, statuses, or dates didn't come across — this browser didn't include hidden files in the folder upload this time. Export a .zip from the original tracker for a complete copy.";
      notice = {type: "warning", message};
    } else if (kind === "folder-success") {
      notice = {type: "success", message: "Folder imported — notes, statuses, and dates carried over."};
    } else if (kind === "folder-native-success") {
      notice = {type: "success", message: "Folder imported — notes, statuses, and dates carried over."};
    }

    // Separate one-shot flag: how many already-existing "JobTracker —
    // <name>" folders on disk (see _new_sibling_root in workspace.py)
    // had nothing in this app's own tracker list pointing at them
    // anymore, most likely leftovers from an earlier create/import
    // attempt whose tracker was never properly deleted through the app.
    // Folded into whatever notice is already showing (or shown on its
    // own, for the plain "Start Fresh" path, which has no `kind` at
    // all) rather than a second toast, since this is advisory, not an
    // error -- the new tracker itself is fine either way.
    let staleCount = 0;
    try {
      const raw = sessionStorage.getItem(STALE_SIBLINGS_KEY);
      sessionStorage.removeItem(STALE_SIBLINGS_KEY);
      staleCount = raw ? parseInt(raw, 10) || 0 : 0;
    } catch(e) { /* best-effort */ }
    if (staleCount > 0) {
      const staleMsg = staleCount === 1
        ? "Note: an older folder with this same name already existed on disk and was left alone — this created a new, separate one instead. Worth a look in Finder if you don't recognize it."
        : `Note: ${staleCount} older folders with this same name already existed on disk and were left alone — this created a new, separate one instead. Worth a look in Finder if you don't recognize them.`;
      notice = notice
        ? {type: "warning", message: `${notice.message} ${staleMsg}`}
        : {type: "warning", message: staleMsg};
    }

    if (notice) setImportNotice(notice);
  }, []);

  // Keep the localStorage cache warm so the next launch paints instantly.
  useEffect(() => { if (statusInfo) saveCache(statusInfo, apps); }, [statusInfo, apps]);

  const ensureDocs = useCallback((itemId) => {
    setDocsByItemId(prev => {
      if (prev[itemId]) return prev;
      apiGet(`/api/applications/${itemId}/documents`).then(docs => {
        setDocsByItemId(p => ({...p, [itemId]: docs}));
      });
      return prev;
    });
  }, []);

  const ensureDossier = useCallback((itemId) => {
    setDossierByItemId(prev => {
      if (prev[itemId] !== undefined) return prev;
      apiGet(`/api/applications/${itemId}/dossier`).then(dossier => {
        setDossierByItemId(p => ({...p, [itemId]: dossier}));
        // Checkpoint 6: the dossier endpoint may have just auto-filled
        // date_applied server-side (confirmation-tier evidence into a
        // genuinely empty field -- see api.py's application_dossier).
        // The apps list is what actually feeds date_applied/
        // date_applied_source to the Pipeline row and the Dossier's
        // context row, so pull it fresh whenever that happened;
        // otherwise the auto-filled date wouldn't show up until some
        // unrelated action happened to refresh the list.
        if (dossier && dossier.date_applied_auto_filled) {
          refreshApps();
        }
      }).catch(() => {
        setDossierByItemId(p => ({...p, [itemId]: null}));
      });
      return prev;
    });
  }, [refreshApps]);

  // Evicts (not patches) a cached dossier so the next ensureDossier call
  // re-fetches it — the merged contacts/role-section result can't be
  // patched in place from a document mutation's response shape, and a
  // stale-but-present cache entry would otherwise silently show outdated
  // extraction results after an upload/rename/delete/fix-type.
  const invalidateDossier = useCallback((itemId) => {
    setDossierByItemId(prev => {
      if (!(itemId in prev)) return prev;
      const next = {...prev};
      delete next[itemId];
      return next;
    });
  }, []);

  // Numeric-id override save (fixes the old double-URL-encoded item_key
  // route — see api.py's save_override for the full story).
  const saveOverride = useCallback(async (appId, fields) => {
    await apiPost(`/api/applications/${appId}/override`, fields);
    fireToast("Saved.");
    await refreshApps();
  }, [refreshApps]);

  const bulkOverride = useCallback(async (appIds, fields) => {
    if (!appIds.length) return;
    const r = await apiPost("/api/applications/bulk-override", {item_ids: appIds, ...fields});
    fireToast(`Updated ${r.count} application(s).`);
    await refreshApps();
  }, [refreshApps]);

  // Optimistic status move for Kanban drag-and-drop: update local state
  // immediately (card jumps to the new column right away), fire the
  // override API in the background, and roll back + toast an error if it
  // fails. `pendingIds` drives the .optimistic CSS class (dimmed) while
  // the request is in flight.
  const moveStatus = useCallback(async (app, newStatus) => {
    const prevApps = apps;
    setApps(prev => prev.map(a => a.id === app.id ? {...a, effective_status: newStatus, manual_status: newStatus} : a));
    setPendingIds(prev => new Set(prev).add(app.id));
    try {
      await apiPost(`/api/applications/${app.id}/override`, {manual_status: newStatus});
      fireToast(`Moved ${app.effective_company} to ${newStatus}.`);
      await refreshApps();
    } catch (e) {
      setApps(prevApps);
      fireToast("Couldn't move — reverted.");
    } finally {
      setPendingIds(prev => { const next = new Set(prev); next.delete(app.id); return next; });
    }
  }, [apps, refreshApps]);

  const openFile = useCallback(async (relpath) => {
    try { const r = await apiPost("/api/open", {relpath}); fireToast(`Opened ${r.opened}`); }
    catch (e) { fireToast("Couldn't open file"); }
  }, []);

  // Multipart upload — separate from apiPost since that helper always
  // sends JSON. Writes go straight into the application's real folder on
  // disk (see api.py); the response already contains the refreshed
  // document list for this item, so we drop it straight into the cache
  // instead of round-tripping through another GET.
  // Actually performs the trash-move + cache update. No toast of its own —
  // it fires silently once the undo window in requestDelete below elapses.
  const performDelete = useCallback(async (doc) => {
    await apiPost("/api/documents/delete", {relpath: doc.relpath});
    setDocsByItemId(prev => {
      const next = {...prev};
      if (next[doc.item_id]) next[doc.item_id] = next[doc.item_id].filter(d => d.relpath !== doc.relpath);
      return next;
    });
    setDocsVersion(v => v + 1);
    invalidateDossier(doc.item_id);
  }, [invalidateDossier]);

  const renameDocument = useCallback(async (doc, newFilename) => {
    const data = await apiPost("/api/documents/rename", {relpath: doc.relpath, new_filename: newFilename});
    if (data.documents) setDocsByItemId(prev => ({...prev, [doc.item_id]: data.documents}));
    setDocsVersion(v => v + 1);
    invalidateDossier(doc.item_id);
    fireToast(`Renamed to ${newFilename}.`);
  }, [fireToast, invalidateDossier]);

  // Delete is already non-destructive (real file goes to OS Trash, never
  // unlinked) — so instead of a blocking "are you sure?", the card hides
  // immediately and a toast offers Undo for a few seconds. The actual
  // trash-move (performDelete) is delayed until the window elapses; Undo
  // just cancels that pending call, nothing has touched disk yet.
  const UNDO_WINDOW_MS = 6000;
  const requestDelete = useCallback((doc) => {
    setPendingDeleteIds(prev => new Set(prev).add(doc.id));
    setUndoToast({id: doc.id, filename: doc.filename});
    const timeoutId = setTimeout(async () => {
      delete deleteTimers.current[doc.id];
      try { await performDelete(doc); }
      catch (e) { setErrorToast({message: `Couldn't delete ${doc.filename}: ${e.message}`}); }
      finally {
        setPendingDeleteIds(prev => { const next = new Set(prev); next.delete(doc.id); return next; });
        setUndoToast(cur => (cur && cur.id === doc.id) ? null : cur);
      }
    }, UNDO_WINDOW_MS);
    deleteTimers.current[doc.id] = timeoutId;
  }, [performDelete, fireToast]);

  const undoDelete = useCallback((docId) => {
    const t = deleteTimers.current[docId];
    if (t) { clearTimeout(t); delete deleteTimers.current[docId]; }
    setPendingDeleteIds(prev => { const next = new Set(prev); next.delete(docId); return next; });
    setUndoToast(cur => (cur && cur.id === docId) ? null : cur);
  }, []);

  const uploadDocuments = useCallback(async (itemId, fileList) => {
    const form = new FormData();
    for (const f of fileList) form.append("files", f);
    const data = await uploadFormData(`${API_BASE}/api/applications/${itemId}/documents`, form);
    setDocsByItemId(prev => ({...prev, [itemId]: data.documents}));
    setDocsVersion(v => v + 1);
    invalidateDossier(itemId);
    fireToast(fileList.length > 1 ? `Added ${fileList.length} files.` : `Added ${fileList[0].name}.`);
    return data.documents;
  }, [fireToast, invalidateDossier]);

  const openViewer = useCallback((doc) => setViewerDoc(doc), []);

  const saveDocTypeOverride = useCallback(async (relpath, doc_type_override) => {
    const data = await apiPost("/api/documents/override", {relpath, doc_type_override});
    fireToast(doc_type_override ? "Document type corrected." : "Correction cleared.");
    // Patch the affected item's cache entry in place (server now returns its
    // refreshed doc list) instead of wiping the whole cache — wiping it left
    // docsByItemId[selected.id] undefined with nothing left to re-fetch it,
    // since Pipeline's ensureDocs effect only re-runs when the selected app
    // id changes, not when the cache is cleared. That's what made the
    // application look like it disappeared after a doc-type correction.
    if (data.item_id != null) {
      setDocsByItemId(prev => ({...prev, [data.item_id]: data.documents}));
      invalidateDossier(data.item_id);
    }
    setDocsVersion(v => v + 1);
  }, [fireToast, invalidateDossier]);

  const doRebuild = useCallback(async () => {
    await apiPost("/api/rebuild", {});
    fireToast("Index rebuilt. Notes and overrides were kept.");
    await refreshStatus();
    await refreshApps();
  }, [refreshStatus, refreshApps]);

  // Multipart, like uploadDocuments — creates the real
  // Applications/<Company>/[<Role>/] folder on disk, optionally seeds it
  // with the picked files, and does a full rebuild server-side so the new
  // item shows up through the exact same path any manually-created folder
  // would. Jumps straight to it in Pipeline once refreshApps resolves.
  const createApplication = useCallback(async (company, roleLabel, fileList, status) => {
    const form = new FormData();
    form.append("company", company);
    form.append("role_label", roleLabel || "");
    form.append("status", status || "");
    for (const f of (fileList || [])) form.append("files", f);
    const data = await uploadFormData(`${API_BASE}/api/applications/new`, form);
    fireToast(`Created ${company}${roleLabel ? " — " + roleLabel : ""}${status ? ` (${status})` : ""}.`);
    await refreshStatus();
    await refreshApps();
    if (data.item_id != null) { setPage("pipeline"); setSelectedKey(data.item_id); }
    return data;
  }, [fireToast, refreshStatus, refreshApps, setPage, setSelectedKey]);

  // Same shape as createApplication above but for a bare category folder
  // (no Company/Role, no files, no status) — creates it, rebuilds (via
  // docsVersion, which BrowsePage watches), and navigates to Browse,
  // where the new category now shows up as its own tab.
  const createCategory = useCallback(async (name) => {
    const form = new FormData();
    form.append("name", name);
    const data = await uploadFormData(`${API_BASE}/api/categories/new`, form);
    fireToast(`Created category "${name}".`);
    await refreshStatus();
    setDocsVersion(v => v + 1);
    setPage("browse");
    return data;
  }, [fireToast, refreshStatus, setPage]);

  // Global hotkeys: ⌘K/Ctrl+K opens the command palette; Esc closes
  // whatever's on top (palette > viewer > settings), in that priority order.
  useEffect(() => {
    const handler = (e) => {
      const metaKey = e.metaKey || e.ctrlKey;
      if (metaKey && e.key.toLowerCase() === "k") {
        e.preventDefault();
        setPaletteOpen(o => !o);
        return;
      }
      if (e.key === "Escape") {
        if (paletteOpen) setPaletteOpen(false);
        else if (viewerDoc) setViewerDoc(null);
        else if (settingsOpen) setSettingsOpen(false);
      }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [paletteOpen, viewerDoc, settingsOpen]);

  if (connError) return <ConnectionError />;
  if (!statusInfo) return <div className="center-screen"><div style={{color:"var(--text-soft)"}}>Loading…</div></div>;
  if (!statusInfo.workspace) return <NoTrackerOnboarding packaged={statusInfo.packaged} />;
  if (!statusInfo.index_built) return <Onboarding root={statusInfo.root} onRebuild={doRebuild} />;

  const attentionCount = apps.filter(a => !a.archived && !a.is_snoozed && (a.is_stale || a.next_action_due)).length;

  return (
    <ShowSourceContext.Provider value={{showSource, setShowSource}}>
    <PendingDeleteContext.Provider value={{pendingDeleteIds}}>
    <div className="app-shell">
      <Rail page={page} setPage={setPage} attentionCount={attentionCount} onOpenPalette={() => setPaletteOpen(true)}
        onOpenSettings={() => setSettingsOpen(true)}
        workspacePopoverOpen={workspacePopoverOpen}
        onToggleWorkspacePopover={() => setWorkspacePopoverOpen(o => !o)}
        onCloseWorkspacePopover={() => setWorkspacePopoverOpen(false)}
        trackerName={statusInfo && statusInfo.workspace && statusInfo.workspace.name}
        packaged={!!(statusInfo && statusInfo.packaged)} />
      <div className="main">
        <div className="topbar">
          <ClearableInput className="search-input" wrapStyle={{flex:1, minWidth:220, maxWidth:520}}
            placeholder={`\u{1F50D} Search ${apps.length} applications… (\u2318K for command palette)`}
            value={searchQuery} onChange={e => setSearchQuery(e.target.value)} />
          <label style={{display:"flex", alignItems:"center", gap:6, color:"var(--text-soft)", fontSize:12}}>
            <input type="checkbox" checked={showPersonal} onChange={e => setShowPersonal(e.target.checked)} /> Show personal
          </label>
          <label style={{display:"flex", alignItems:"center", gap:6, color:"var(--text-soft)", fontSize:12}} title="Source files (.tex) stay indexed and searchable — this only controls whether they show in document lists.">
            <input type="checkbox" checked={showSource} onChange={e => setShowSource(e.target.checked)} /> Show source files
          </label>
          <div style={{flex:1}} />
          <ThemeToggle pref={theme.pref} applied={theme.applied} setTheme={theme.setTheme} />
          <button className="btn primary" onClick={() => setNewAppOpen(true)}>{"\u2795"} New application</button>
          <button className="btn" onClick={() => setNewCategoryOpen(true)}>{"\u{1F5C2}\uFE0F"} New category</button>
          <button className="btn" onClick={() => setPaletteOpen(true)}>{"\u2318K"}</button>
          <button className="btn" onClick={() => setSettingsOpen(true)}>{"\u2699\uFE0F"} Settings</button>
        </div>
        <div className="content">
          {page === "pipeline" && (
            <PipelinePage apps={apps} meta={meta} docsByItemId={docsByItemId} ensureDocs={ensureDocs}
              dossierByItemId={dossierByItemId} ensureDossier={ensureDossier}
              onSaveOverride={saveOverride} onMoveStatus={moveStatus} pendingIds={pendingIds}
              onOpen={openFile} onView={openViewer} onFixType={setFixTypeDoc} onUpload={uploadDocuments}
              onRename={setRenameDoc} onDelete={requestDelete} searchQuery={searchQuery}
              selectedKey={selectedKey} setSelectedKey={setSelectedKey} active={page==="pipeline"} fireToast={fireToast} />
          )}
          {page === "attention" && (
            <AttentionPage apps={apps} meta={meta} docsByItemId={docsByItemId} ensureDocs={ensureDocs}
              onSaveOverride={saveOverride} onBulkOverride={bulkOverride} onOpen={openFile} onView={openViewer} active={page==="attention"} />
          )}
          {page === "browse" && (
            <div>
              {searchQuery && (
                <div style={{display:"flex", gap:8, marginBottom:12}}>
                  <button className={"btn subtle" + (browseSearchMode==="grouped" ? " active" : "")}
                    style={{background: browseSearchMode==="grouped" ? "var(--border)" : "transparent"}}
                    onClick={() => setBrowseSearchMode("grouped")}>Grouped by application</button>
                  <button className={"btn subtle" + (browseSearchMode==="flat" ? " active" : "")}
                    style={{background: browseSearchMode==="flat" ? "var(--border)" : "transparent"}}
                    onClick={() => setBrowseSearchMode("flat")}>Flat document list</button>
                </div>
              )}
              {searchQuery && browseSearchMode === "flat" ? (
                <SearchPage searchQuery={searchQuery} showPersonal={showPersonal} meta={meta} onOpen={openFile} onView={openViewer} />
              ) : (
                <BrowsePage searchQuery={searchQuery} showPersonal={showPersonal} meta={meta} onOpen={openFile} onView={openViewer}
                  onFixType={setFixTypeDoc} onUpload={uploadDocuments} onRename={setRenameDoc} onDelete={requestDelete} docsVersion={docsVersion} />
              )}
            </div>
          )}
          {page === "insights" && <InsightsPage apps={apps} meta={meta} themeTick={theme.applied} />}
          {page === "hub" && <SearchHubPage />}
          {page === "manage" && <ManagePage onRefreshApps={refreshApps} meta={meta} onCategoriesChanged={() => setDocsVersion(v => v + 1)} />}
        </div>
      </div>
      {settingsOpen && (
        <SettingsModal status={statusInfo} onClose={() => setSettingsOpen(false)} onRebuild={doRebuild}
          themePref={theme.pref} themeApplied={theme.applied} setTheme={theme.setTheme} />
      )}
      {newAppOpen && (
        <NewApplicationModal onClose={() => setNewAppOpen(false)} onCreate={createApplication} meta={meta} />
      )}
      {newCategoryOpen && (
        <NewCategoryModal onClose={() => setNewCategoryOpen(false)} onCreate={createCategory} />
      )}
      {paletteOpen && (
        <CommandPalette apps={apps} onClose={() => setPaletteOpen(false)} setPage={setPage}
          setSelectedKey={setSelectedKey} doRebuild={doRebuild} fireToast={fireToast}
          onNewApp={() => setNewAppOpen(true)} onNewCategory={() => setNewCategoryOpen(true)} />
      )}
      {viewerDoc && <ViewerDrawer doc={viewerDoc} onClose={() => setViewerDoc(null)} onOpen={openFile} />}
      {fixTypeDoc && (
        <FixTypeModal doc={fixTypeDoc} docTypeLabels={meta.doc_type_labels}
          onClose={() => setFixTypeDoc(null)}
          onSave={async (val) => { await saveDocTypeOverride(fixTypeDoc.relpath, val); setFixTypeDoc(null); }} />
      )}
      {renameDoc && (
        <RenameModal doc={renameDoc}
          onClose={() => setRenameDoc(null)}
          onSave={(newName) => renameDocument(renameDoc, newName)} />
      )}
      <div className="toast-stack">
        {importNotice && (
          <div className={"toast " + (importNotice.type === "success" ? "success-toast" : "error-toast")}>
            <span>{importNotice.message}</span>
            <button className="toast-undo-btn" onClick={() => setImportNotice(null)}>Dismiss</button>
          </div>
        )}
        {errorToast && (
          <div className="toast error-toast">
            <span>{errorToast.message}</span>
            <button className="toast-undo-btn" onClick={() => setErrorToast(null)}>Dismiss</button>
          </div>
        )}
        {undoToast && (
          <div className="toast undo-toast">
            <span>{"Moved "}{undoToast.filename}{" to Trash."}</span>
            <button className="toast-undo-btn" onClick={() => undoDelete(undoToast.id)}>Undo</button>
          </div>
        )}
        {toast && <div className="toast">{toast}</div>}
      </div>
    </div>
    </PendingDeleteContext.Provider>
    </ShowSourceContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>
