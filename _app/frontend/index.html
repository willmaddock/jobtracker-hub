<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JobTracker Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<script>
  // Resolve + apply the theme BEFORE first paint (zero-flash hydration).
  // Reads the persisted preference ("system" | "light" | "dark"), resolves
  // "system" via matchMedia, and sets data-theme synchronously so the CSS
  // below never has to repaint from a wrong default.
  (function () {
    try {
      var pref = localStorage.getItem("jth_theme") || "system";
      var resolved = pref === "system"
        ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
        : pref;
      document.documentElement.setAttribute("data-theme", resolved);
      document.documentElement.setAttribute("data-theme-pref", pref);
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  })();
</script>
<style>
  /* ============ THEME ENGINE ============
     Two explicit palettes below ([data-theme="dark"] / [data-theme="light"])
     plus a "system" preference that resolves to one of the two (see boot
     script above + useTheme() hook). Every color in the app is a CSS custom
     property so switching data-theme on <html> re-themes everything live. */
  html[data-theme="dark"]{
    --bg:#0F172A; --panel:#1E293B; --panel-soft:#1E293Bcc; --panel-glass:#1E293Be6;
    --border:#334155; --border-soft:#1E293B;
    --text:#F1F5F9; --text-strong:#FFFFFF; --text-soft:#94A3B8; --text-mute:#64748B;
    --accent:#3B82F6; --accent-soft:#60A5FA; --accent-contrast:#FFFFFF;
    --green:#10B981; --green-text:#34D399;
    --amber:#F59E0B; --amber-text:#FBBF24;
    --red:#EF4444; --red-text:#F87171;
    --card-shadow:none;
    --scrollbar-thumb:#334155; --scrollbar-track:transparent;
    color-scheme: dark;
  }
  html[data-theme="light"]{
    --bg:#F8FAFC; --panel:#FFFFFF; --panel-soft:#FFFFFFcc; --panel-glass:#FFFFFFe6;
    --border:#E2E8F0; --border-soft:#EDF2F7;
    --text:#1E293B; --text-strong:#0F172A; --text-soft:#475569; --text-mute:#94A3B8;
    --accent:#3B82F6; --accent-soft:#2563EB; --accent-contrast:#FFFFFF;
    --green:#10B981; --green-text:#047857;
    --amber:#F59E0B; --amber-text:#B45309;
    --red:#EF4444; --red-text:#DC2626;
    --card-shadow:0 1px 2px rgba(15,23,42,.06), 0 6px 16px rgba(15,23,42,.06);
    --scrollbar-thumb:#CBD5E1; --scrollbar-track:transparent;
    color-scheme: light;
  }
  :root{ --radius:10px; }
  *{box-sizing:border-box;}
  html,body,#root{height:100%;margin:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,Helvetica,Arial,sans-serif;
    font-size:14px;
    transition:background-color .2s ease, color .2s ease;
  }
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);border-radius:8px;}
  ::-webkit-scrollbar-track{background:var(--scrollbar-track);}
  * { scrollbar-width: thin; scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track); }

  .app-shell{display:flex;height:100vh;overflow:hidden;}

  /* ---------- icon rail ---------- */
  .rail{width:64px;flex:none;background:var(--panel-soft);border-right:1px solid var(--border);
    display:flex;flex-direction:column;align-items:center;padding:16px 0;}
  .rail-logo-anchor{position:relative;margin-bottom:26px;}
  .rail-logo{width:40px;height:40px;border-radius:10px;background:var(--accent);border:none;padding:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px;flex:none;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1),filter .15s ease,box-shadow .15s ease;}
  .rail-logo:hover{transform:translateY(-1px) scale(1.05);filter:brightness(1.08);box-shadow:0 4px 14px #3B82F655;}
  .rail-logo:active{transform:translateY(0) scale(.94);filter:brightness(.96);box-shadow:0 1px 4px #3B82F655;}
  .rail-logo.open{box-shadow:0 0 0 3px #3B82F640;}
  /* Expanded-rail variant: the J badge + current tracker name + caret,
     as one full-width clickable row (same target as the collapsed J). */
  .rail-logo-row{width:100%;display:flex;align-items:center;gap:10px;padding:4px 6px;border:none;
    background:transparent;border-radius:10px;cursor:pointer;text-align:left;
    transition:background .15s ease,transform .1s ease;}
  .rail-logo-row:hover{background:#33415580;}
  .rail-logo-row:active{transform:scale(.98);background:#33415599;}
  .rail-logo-row.open{background:#3B82F61A;box-shadow:0 0 0 1px #3B82F640 inset;}
  .rail-logo-row .rail-logo{cursor:inherit;}
  .rail-logo-row:hover .rail-logo{transform:none;filter:none;box-shadow:none;}
  .rail-logo-label{flex:1;min-width:0;text-align:left;color:var(--text-strong);}
  .rail-logo-label-caret{color:var(--text-mute);font-size:11px;flex:none;transition:transform .15s ease;}
  .rail-logo-row.open .rail-logo-label-caret{transform:rotate(180deg);}
  .rail-nav{display:flex;flex-direction:column;gap:10px;align-items:center;flex:1;}
  .rail-btn{position:relative;width:40px;height:40px;border-radius:12px;border:none;background:transparent;
    display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--text-soft);transition:background .15s ease,color .15s ease,transform .1s ease;}
  .rail-btn:hover{background:#33415580;color:var(--text);transform:translateY(-1px);}
  .rail-btn:active{transform:translateY(0) scale(.9);background:#33415599;}
  .rail-btn.active{background:#3B82F626;color:var(--accent-soft);}
  .rail-btn.active:hover{transform:translateY(-1px) scale(1.03);}
  .rail-badge{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;
    background:var(--red);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .rail-bottom{margin-top:auto;display:flex;flex-direction:column;gap:10px;align-items:center;}
  .rail-version{font-size:10px;color:var(--text-mute);text-align:center;padding:2px 4px 0;white-space:nowrap;}
  .rail.expanded{width:200px;align-items:stretch;padding:16px 12px;}
  .rail.expanded .rail-nav,.rail.expanded .rail-bottom{align-items:stretch;}
  .rail.expanded .rail-btn{width:100%;justify-content:flex-start;gap:10px;padding:0 10px;}
  .rail.expanded .rail-badge{position:static;margin-left:auto;flex:none;}
  .rail-btn-label{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rail-collapse-btn{color:var(--text-mute);}

  /* ---------- workspace switcher popover ---------- */
  .workspace-pop{position:absolute;top:0;left:52px;z-index:70;width:280px;
    background:var(--panel-glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    border:1px solid var(--border);border-radius:12px;padding:8px;box-shadow:0 12px 40px #0007;}
  .workspace-pop-title{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-soft);
    padding:6px 8px 2px;}
  .workspace-pop-hint{font-size:11.5px;line-height:1.4;color:var(--text-soft);padding:0 8px 8px;}
  .workspace-pop-err{font-size:12px;color:var(--red-text);padding:4px 8px 8px;}
  .workspace-pop-loading{font-size:12px;color:var(--text-soft);padding:4px 8px;}
  .workspace-row{display:flex;align-items:center;gap:4px;border-radius:8px;}
  .workspace-row:hover{background:#33415540;}
  .workspace-row.active .workspace-name{color:var(--text-strong);font-weight:600;}
  .workspace-row-main{flex:1;display:flex;align-items:center;gap:8px;background:none;border:none;
    padding:8px;text-align:left;color:var(--text);font-size:13px;border-radius:8px;min-width:0;}
  .workspace-check{width:14px;flex:none;color:var(--accent-soft);font-size:12px;}
  .workspace-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .workspace-row-actions{display:flex;gap:2px;padding-right:4px;}
  .workspace-row-btn{width:24px;height:24px;border:none;background:transparent;border-radius:6px;cursor:pointer;
    color:var(--text-soft);font-size:12px;display:flex;align-items:center;justify-content:center;}
  .workspace-row-btn:hover{background:#33415580;color:var(--text);}
  .workspace-row-btn.spinning{animation:workspace-spin .8s linear infinite;}
  @keyframes workspace-spin{to{transform:rotate(360deg);}}
  .workspace-rename-input{flex:1;background:var(--panel);border:1px solid var(--accent);border-radius:6px;
    padding:6px 8px;font-size:13px;color:var(--text);margin:2px 4px;}
  .workspace-pop-divider{height:1px;background:var(--border-soft);margin:6px 4px;}
  .workspace-import-row{display:flex;flex-direction:column;gap:6px;padding:4px 0 2px;}
  .workspace-import-or{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-soft);}
  .link-btn{background:none;border:none;color:var(--accent-soft);font-size:11px;cursor:pointer;padding:2px 0;text-decoration:underline;text-underline-offset:2px;}
  .link-btn:hover{color:var(--accent);}
  .workspace-import-row .dropzone.compact{margin-bottom:0;padding:10px 8px;font-size:12px;text-align:center;}
  .workspace-import-actions{display:flex;justify-content:flex-end;gap:6px;}
  .workspace-import-actions .btn{padding:5px 10px;font-size:12px;}
  .workspace-new-btn{color:var(--accent-soft);font-weight:600;width:100%;}
  .workspace-action-desc{font-size:11px;line-height:1.4;color:var(--text-soft);padding:2px 8px 6px;}
  .workspace-status-card{margin:2px 8px 8px;padding:8px 10px;border-radius:8px;
    background:#33415530;border:1px solid var(--border-soft);font-size:11.5px;color:var(--text-soft);}
  .workspace-status-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:1px 0;}
  .workspace-status-badge{font-size:10.5px;font-weight:600;letter-spacing:.02em;color:var(--accent-soft);}
  .workspace-status-path{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left;color:var(--text-mute);}
  .workspace-status-check{color:var(--green-text, #4caf82);}
  .workspace-status-warn{color:var(--text-soft);}
  .workspace-preview{margin:4px 0;padding:10px;border-radius:8px;border:1px solid var(--border-soft);
    background:#33415530;font-size:12px;}
  .workspace-preview.warn{border-color:#7a5a1e80;background:#7a5a1e14;}
  .workspace-preview.block{border-color:#7a2e2e80;background:#7a2e2e14;}
  .workspace-preview-path{font-size:10.5px;color:var(--text-mute);word-break:break-all;margin-bottom:6px;}
  .workspace-preview-headline{color:var(--text);margin-bottom:2px;font-weight:600;}
  .workspace-preview-sub{color:var(--text-soft);line-height:1.4;}

  /* ---------- shared tracker-creation actions (TrackerCreationActions) ---------- */
  /* Grouped by user intent (Start Fresh / Bring In a Copy / Use This Folder
     As-Is) rather than by mechanism -- see HANDOFF.md §3j.2. Used by both
     WorkspacePopover (layout="popover", compact) and NoTrackerOnboarding
     (layout="onboarding", roomier) so the three actions are defined once. */
  .workspace-group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--text-mute);padding:8px 8px 2px;}
  .tca-onboarding .workspace-group-label{padding:14px 2px 4px;}
  .tca-onboarding .workspace-group-label:first-child{padding-top:2px;}
  .tca-onboarding .workspace-row-main{padding:10px 8px;font-size:13.5px;}
  .tca-onboarding .workspace-action-desc{padding:2px 8px 4px;}
  .workspace-portability-note{font-size:11px;line-height:1.4;color:var(--text-soft);
    padding:4px 8px 0;border-left:2px solid var(--border-soft);margin:2px 0 0 2px;padding-left:8px;}

  /* ---------- generic layout ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;}
  .topbar{display:flex;gap:12px;align-items:center;padding:16px 24px;border-bottom:1px solid var(--border-soft);flex-wrap:wrap;}
  .content{flex:1;min-height:0;overflow:auto;padding:20px 24px 40px;}

  .search-input{background:var(--panel);border:1px solid var(--border);border-radius:8px;color:var(--text);
    padding:9px 12px;font-size:13px;outline:none;transition:border-color .15s ease,box-shadow .15s ease;}
  .search-input::placeholder{color:var(--text-mute);}
  .search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #3B82F622;}

  /* Wrapper + "x" clear button shared by every search/filter text input in
     the app (top search bar, command palette, Search Hub role field) — one
     component (ClearableInput) renders this markup everywhere instead of
     each input reimplementing its own clear behavior. */
  .clearable-input{position:relative;display:flex;align-items:center;}
  .clearable-input input{width:100%;}
  .clearable-input input.has-value{padding-right:30px;}
  .clear-input-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);
    width:20px;height:20px;border-radius:50%;border:none;background:transparent;
    color:var(--text-mute);font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;
    cursor:pointer;padding:0;transition:background .12s ease,color .12s ease;}
  .clear-input-btn:hover{background:var(--border);color:var(--text);}

  .btn{border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);
    padding:8px 14px;font-size:12.5px;font-weight:500;transition:all .15s ease;}
  .btn:hover{border-color:var(--accent-soft);transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  .btn.primary:hover{background:#2f6fe0;}
  .btn.subtle{background:transparent;border:1px solid var(--border);color:var(--text-soft);}
  .btn.danger-outline{background:transparent;border:1px solid #ef444455;color:var(--red-text);}
  .btn:disabled{opacity:.5;cursor:default;transform:none;}
  .btn.small{padding:5px 10px;font-size:11.5px;}
  .btn.icon{padding:8px 10px;font-size:15px;line-height:1;}

  .page-title{font-size:20px;font-weight:800;color:var(--text-strong);margin:0 0 4px;letter-spacing:-.01em;}
  .page-sub{color:var(--text-soft);font-size:12.5px;margin:0 0 18px;}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.02em;white-space:nowrap;}
  .stale-tag{color:var(--amber-text);font-size:11.5px;font-weight:600;}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--card-shadow);}

  .empty-state{color:var(--text-soft);font-size:13px;padding:36px 24px;text-align:center;background:var(--panel);
    border:1px dashed var(--border);border-radius:var(--radius);}
  .empty-state .empty-icon{font-size:26px;margin-bottom:8px;opacity:.7;}
  .empty-state .empty-title{color:var(--text);font-weight:700;font-size:13.5px;margin-bottom:4px;}

  .stat-strip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
  .stat-pill{flex:1;min-width:110px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--card-shadow);transition:transform .15s ease;}
  .stat-pill:hover{transform:translateY(-1px);}
  .stat-pill .num{font-size:22px;font-weight:700;color:var(--text-strong);}
  .stat-pill .lbl{font-size:11px;color:var(--text-soft);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}

  mark.hl{background:#F59E0B55;color:var(--text-strong);border-radius:3px;padding:0 1px;}

  /* ---------- pipeline: master/detail ---------- */
  .pipeline-split{display:flex;gap:0;height:100%;}
  .master-pane{width:340px;flex:none;border-right:1px solid var(--border-soft);display:flex;flex-direction:column;overflow:hidden;padding-right:14px;}
  .master-list{overflow:auto;flex:1;display:flex;flex-direction:column;gap:8px;padding-right:4px;}
  .master-item{border-radius:8px;padding:12px 12px;cursor:pointer;border:1px solid transparent;background:var(--bg);transition:background .15s ease,border-color .15s ease;}
  .master-item:hover{background:#3B82F612;}
  .master-item.selected{background:var(--panel);border-left:3px solid var(--accent);padding-left:9px;}
  .master-item.focused{outline:1px dashed var(--accent-soft);outline-offset:-1px;}
  .master-item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .master-item-title{font-size:13.5px;font-weight:600;color:var(--text-strong);}
  .master-item-role{font-size:11.5px;color:var(--text-soft);margin-top:3px;}
  .master-item-meta{font-size:10.5px;color:var(--text-mute);margin-top:6px;}

  .detail-pane{flex:1;min-width:0;overflow:auto;padding-left:22px;}
  .detail-header{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px 22px;margin-bottom:18px;box-shadow:var(--card-shadow);}
  .detail-eyebrow{color:var(--accent-soft);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;}
  .detail-title{font-size:19px;font-weight:700;color:var(--text-strong);margin:0 0 6px;}
  .detail-meta{color:var(--text-soft);font-size:12px;}
  .detail-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}

  .section-label{color:var(--text-soft);font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:22px 0 10px;}
  .section-label:first-child{margin-top:0;}

  .doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;}
  /* Two-row layout: icon+name+type on top (full card width, so long
     filenames actually have room), action icons on their own row
     underneath. Previously all of this was one row and 4-5 action
     buttons left the filename about 40px to work with. */
  .doc-card{display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px;box-shadow:var(--card-shadow);transition:transform .15s ease,border-color .15s ease;}
  .doc-card:hover{transform:translateY(-1px);border-color:var(--accent-soft);}
  .doc-card-top{display:flex;align-items:center;gap:10px;min-width:0;}
  .dropzone{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--border);border-radius:10px;padding:16px;margin-bottom:12px;color:var(--text-soft);font-size:13px;cursor:pointer;transition:border-color .15s ease,background .15s ease,color .15s ease;}
  .dropzone:hover{border-color:var(--accent-soft);color:var(--text);}
  .dropzone.drag-over{border-color:var(--accent-soft);background:var(--panel);color:var(--text);}
  .dropzone.busy{cursor:default;opacity:.6;}
  .dropzone-icon{font-size:16px;}
  .dropzone.compact{padding:10px;margin-bottom:10px;font-size:12px;}
  .doc-icon{flex:none;width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;}
  .doc-meta{flex:1;min-width:0;}
  .doc-name{font-size:12.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .doc-type{font-size:10.5px;color:var(--text-soft);margin-top:2px;}
  .doc-actions{display:flex;gap:4px;flex:none;justify-content:flex-end;border-top:1px solid var(--border-soft);padding-top:8px;}
  .doc-open{background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--text-soft);padding:5px 8px;font-size:12px;transition:all .15s ease;}
  .doc-open:hover{border-color:var(--accent-soft);color:var(--accent-soft);}

  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:4px;}
  .notes-card{padding:18px 20px;}
  .field label{display:block;font-size:11px;color:var(--text-soft);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em;}
  .field input[type=text], .field input[type=date], .field select, .field textarea{
    width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);
    padding:8px 10px;font-size:12.5px;outline:none;transition:border-color .15s ease;}
  .field textarea{resize:vertical;min-height:60px;}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent);}
  .field.span2{grid-column:span 2;}
  .checkbox-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-soft);margin-top:6px;}

  /* ---------- Application Dossier (Checkpoint 4) ---------- */
  .dossier-card{padding:18px 20px;}
  .dossier-loading{color:var(--text-mute);font-size:12px;padding:6px 0;}
  .dossier-context-row{display:flex;flex-wrap:wrap;gap:18px;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--border-soft);}
  .dossier-field{min-width:110px;}
  .dossier-field-label{font-size:10.5px;color:var(--text-soft);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;}

<div id="root"></div>

<script type="text/babel" data-presets="react">
const {useState, useEffect, useMemo, useCallback, useRef, useContext} = React;

// Same-origin: the frontend is served by api.py's StaticFiles mount, so
// every request is a plain relative fetch — no host to configure, no CORS.
const API_BASE = "";
const APP_VERSION = "1.1.0";
const CACHE_KEY = "jth_cache_v1";
const THEME_KEY = "jth_theme";
// Written by any import flow right before window.location.reload() (a
// reload wipes React state, so an in-memory toast fired pre-reload would
// never actually be seen) -- read once by App on mount, then cleared, so
// the right post-import toast survives the reload. Values: "zip-success"
// (a .zip import -- notes/statuses/dates travel via .jobtracker/overrides.db,
// which zipfile preserves like any other entry), "folder-warning" (the
// browser folder-picker path, and the FileList it returned did NOT contain
// a .jobtracker entry -- some browsers/versions strip dotfiles from a
// webkitdirectory upload, so .jobtracker/overrides.db couldn't come across
// that way), "folder-success" (browser folder-picker path, but the FileList
// DID contain a .jobtracker entry -- this varies by browser and browser
// version, so it's detected from what was actually picked rather than
// assumed from the browser name), or "folder-native-success" (packaged
// desktop's native folder import -- reads the real filesystem directly, so
// dotfiles DO come across losslessly, same as a zip; see HANDOFF.md §3j.3
// for why this now gets a matching confirmation toast instead of being the
// one silent path).
const IMPORT_NOTICE_KEY = "jth_import_notice";
// Companion to IMPORT_NOTICE_KEY: how many pre-existing, already-orphaned
// "JobTracker — <name>" folders _new_sibling_root() (workspace.py) had to
// step past on disk to land on the one it just created. Written
// alongside IMPORT_NOTICE_KEY by the create/import flows below whenever
// the backend reports stale_siblings_found > 0, and folded into the same
// post-reload toast rather than getting a second toast slot of its own.
const STALE_SIBLINGS_KEY = "jth_stale_siblings";

// Advisory only -- never gates behavior. The folder-warning toast uses this
// to suggest a browser known (from real testing against this app -- see
// HANDOFF.md) to bring dotfiles across via a plain folder upload, but only
// when the person isn't already using it. UA sniffing is normally fragile,
// which is exactly why nothing functional depends on it: the actual
// success/warning choice above comes from checking the picked FileList for
// a real .jobtracker entry, not from this guess.
function suspectedNoDotfileFolderUpload(){
  const ua = navigator.userAgent || "";
  const isChrome = /Chrome|Chromium|Edg\//.test(ua);
  return !isChrome;
}

// Shared by the pre-import Chrome-handoff check and the post-import toast
// decision -- both need the same real answer to "did this FileList actually
// include .jobtracker", so there's one place that scans for it.
// webkitRelativePath is "<pickedFolderName>/rest/of/path" -- a .jobtracker
// entry shows up as one of the path segments after the root, not
// necessarily as a string prefix.
function folderFilesIncludeDotfile(fileList){
  if (!fileList) return false;
  for (const f of fileList) {
    const rel = f.webkitRelativePath || f.name;
    if (rel.split("/").indexOf(".jobtracker") !== -1) return true;
  }
  return false;
}

const NAV_ICONS = {
  pipeline: "\u{1F4CA}",   // 📊
  attention: "\u26A0\uFE0F", // ⚠️
  browse: "\u{1F4C2}",     // 📂
  hub: "\u{1F9ED}",        // 🧭
  insights: "\u{1F4C8}",   // 📈
  manage: "\u{1F6E0}\uFE0F", // 🛠️
  settings: "\u2699\uFE0F", // ⚙️
};
const THEME_ICONS = { system: "\u{1F5A5}\uFE0F", light: "\u2600\uFE0F", dark: "\u{1F319}" };

const DEFAULT_STATUS_COLORS = {
  applied: "#3B82F6", interviewing: "#F59E0B", rejected: "#EF4444", drafted: "#9aa4b2", unknown: "#5b6472",
};
const DEFAULT_STATUS_ICONS = {applied:"\u{1F535}", interviewing:"\u{1F7E1}", rejected:"\u{1F534}", drafted:"\u26AA", unknown:"\u26AB"};
const DEFAULT_STATUS_ORDER = ["drafted","applied","interviewing","rejected","unknown"];

// FastAPI error bodies are JSON. Most of this app's own HTTPException(...)
// calls send {"detail": "a plain message"}, but FastAPI's own automatic
// 422 request-validation errors (a missing/malformed Form/File/body
// field) send {"detail": [{"type", "loc", "msg", ...}, ...]} instead --
// a LIST of error objects, not a string. The old version here only
// handled the string case, so a validation error fell straight through
// to "return rawText" and dumped the raw JSON blob into the UI (seen
// e.g. importing a folder in the browser when the multipart upload
// didn't include every expected field). Handle both shapes.
function extractErrorMessage(rawText, fallback){
  if (!rawText) return fallback;
  try {
    const parsed = JSON.parse(rawText);
    if (parsed && typeof parsed.detail === "string") return parsed.detail;
    if (parsed && Array.isArray(parsed.detail)) {
      const msgs = parsed.detail.map(d => {
        if (d && typeof d.msg === "string") {
          const field = Array.isArray(d.loc) ? d.loc.filter(p => p !== "body").join(".") : null;
          return field ? `${field}: ${d.msg}` : d.msg;
        }
        return typeof d === "string" ? d : JSON.stringify(d);
      }).filter(Boolean);
      if (msgs.length) return msgs.join("; ");
    }
  } catch (e) { /* not JSON — fall through to raw text */ }
  return rawText;
}
// Multipart FormData upload via XMLHttpRequest instead of fetch(). Safari
// has a real, reproducible bug where fetch()'s handling of a POST body
// built from FormData containing a File can arrive at the server
// completely empty -- not truncated, EVERY field missing, including plain
// strings appended before the file -- while the identical payload sent via
// curl/requests/TestClient, or from Chrome, works every time. Confirmed
// against this app's own /api/workspaces/import(-folder) route: reliably
// fails on Safari, reliably succeeds on Chrome, same machine, same file.
// XHR's multipart upload path is older and doesn't share the bug, so every
// file upload in this app goes through here instead of a raw fetch().
function uploadFormData(url, form){
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("POST", url);
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) {
        if (!xhr.responseText) { resolve(null); return; }
        try { resolve(JSON.parse(xhr.responseText)); }
        catch (e) { resolve(null); }
      } else {
        reject(new Error(extractErrorMessage(xhr.responseText, xhr.statusText || `HTTP ${xhr.status}`)));
      }
    };
    xhr.onerror = () => reject(new Error("Network error during upload — check your connection and try again."));
    xhr.send(form);
  });
}
async function apiGet(path){
  const res = await fetch(API_BASE + path);
  if (!res.ok) { const t = await res.text(); throw new Error(extractErrorMessage(t, res.statusText)); }
  return res.json();
}
async function apiPost(path, body){
  const res = await fetch(API_BASE + path, {
    method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(body || {}),
  });
  if (!res.ok) { const t = await res.text(); throw new Error(extractErrorMessage(t, res.statusText)); }
  return res.json();
}
async function apiDelete(path){
  const res = await fetch(API_BASE + path, { method: "DELETE" });
  if (!res.ok) { const t = await res.text(); throw new Error(extractErrorMessage(t, res.statusText)); }
  return res.json();
}

// Opens an external URL (job boards, career pages, AI assistants, etc.)
// in the user's actual default browser. We ask the backend to shell out
// to the OS opener rather than calling window.open() directly, because
// window.open() from inside this app's embedded webview shell doesn't
// reliably spawn a real browser tab — it's not a full browser, so the
// popup often just silently goes nowhere. Falls back to window.open()
// only if the backend call itself fails (e.g. dev/browser preview mode
// where there's no local API to hit).
async function openExternalUrl(url){
  if (!url) return;
  try {
    await apiPost("/api/open-url", { url });
  } catch (e) {
    window.open(url, "_blank", "noopener,noreferrer");
  }
}

/* ---- theme: system / light / dark, persisted, zero-flash on load ---- */
function getSystemTheme(){
  return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
}
function useTheme(){
  const [pref, setPref] = useState(() => {
    try { return localStorage.getItem(THEME_KEY) || "system"; } catch(e) { return "system"; }
  });
  const applied = pref === "system" ? getSystemTheme() : pref;

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", applied);
    document.documentElement.setAttribute("data-theme-pref", pref);
  }, [applied, pref]);

  // Live-follow OS changes while pref==="system".
  useEffect(() => {
    if (pref !== "system" || !window.matchMedia) return;
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const handler = () => document.documentElement.setAttribute("data-theme", getSystemTheme());
    if (mq.addEventListener) mq.addEventListener("change", handler); else mq.addListener(handler);
    return () => { if (mq.removeEventListener) mq.removeEventListener("change", handler); else mq.removeListener(handler); };
  }, [pref]);

  const setTheme = useCallback((t) => {
    setPref(t);
    try { localStorage.setItem(THEME_KEY, t); } catch(e) { /* best-effort */ }
  }, []);

  return {pref, applied, setTheme};
}

function writeUrlState(view, selectedId){
  const p = new URLSearchParams();
  if (view) p.set("view", view);
  if (selectedId != null) p.set("selected", String(selectedId));

}

/* ---- search-term highlighting ---- */
function escapeRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
function Highlight({text, query}){
  const t = text == null ? "" : String(text);
  const qq = (query || "").trim();
  if (!qq) return <React.Fragment>{t}</React.Fragment>;
  // A single capturing group makes String.split() interleave the text as
  // [before, match, between, match, ..., after] — odd indices are always
  // the captured matches, so no need to re-test against a stateful global
  // regex (re-testing a /g regex's .test() advances lastIndex and gives
  // wrong results on repeat calls).
  const re = new RegExp("(" + escapeRe(qq) + ")", "ig");
  const parts = t.split(re);
  if (parts.length === 1) return <React.Fragment>{t}</React.Fragment>;
  return (
    <React.Fragment>
      {parts.map((part, i) => (i % 2 === 1)
        ? <mark className="hl" key={i}>{part}</mark>
        : <React.Fragment key={i}>{part}</React.Fragment>)}
    </React.Fragment>
  );
}

/* ---- shared "x"-to-clear text input, used by every search/filter box in
   the app (top search bar, command palette, Search Hub role field) — one
   place for the clear behavior instead of each input reimplementing it. ---- */
function ClearableInput({value, onChange, onClear, className, placeholder, style, inputRef, onKeyDown, autoFocus, wrapStyle}){
  const ownRef = useRef(null);
  const ref = inputRef || ownRef;
  const hasValue = !!value;
  const clear = () => {
    onChange({target: {value: ""}});
    if (onClear) onClear();
    if (ref.current) ref.current.focus();
  };
  return (
    <div className="clearable-input" style={wrapStyle}>
      <input ref={ref} className={(className || "") + (hasValue ? " has-value" : "")} style={style}
        placeholder={placeholder} value={value} onChange={onChange} onKeyDown={onKeyDown} autoFocus={autoFocus} />
      {hasValue && (
        <button type="button" className="clear-input-btn" title="Clear" aria-label="Clear search" onClick={clear}>
          {"\u2715"}
        </button>
      )}
    </div>
  );
}

/* ---- keyboard list navigation (j/k, arrows, enter, esc) ---- */
function isTypingTarget(el){
  if (!el) return false;
  const tag = (el.tagName || "").toLowerCase();
  return tag === "input" || tag === "textarea" || tag === "select" || el.isContentEditable;
}
function useListNav({enabled, items, selectedKey, onSelect, onEnter}){
  useEffect(() => {
    if (!enabled) return;
    const handler = (e) => {
      if (isTypingTarget(document.activeElement)) return;
      if (!items || items.length === 0) return;
      const idx = items.findIndex(it => it.id === selectedKey);
      if (e.key === "j" || e.key === "ArrowDown") {
        e.preventDefault();
        const next = items[Math.min(items.length - 1, idx < 0 ? 0 : idx + 1)];
        onSelect(next);
      } else if (e.key === "k" || e.key === "ArrowUp") {
        e.preventDefault();
        const prev = items[Math.max(0, idx < 0 ? 0 : idx - 1)];
        onSelect(prev);
      } else if (e.key === "Enter") {
        const cur = idx >= 0 ? items[idx] : items[0];
        if (cur && onEnter) { e.preventDefault(); onEnter(cur); }
      }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [enabled, items, selectedKey, onSelect, onEnter]);
}

/* =========================== WORKSPACE SWITCHER =========================== */
// The J logo doubles as a tracker switcher: click it to see every tracker
// (each one a fully separate Applications/ folder + its own two DBs — see
// workspace.py), switch between them, rename, delete (removes it from this
// list only — nothing on disk is ever touched), or start a brand-new one.
// Turns an /api/workspaces/inspect result into what the "Use an Existing
// Folder" preview panel should show -- shared between the in-app
// WorkspacePopover flow below. Pure function (no component state) so it
// can be unit-reasoned-about on its own: same inspection in, same
// {tone, headline, sub, canContinue} out.
function describeFolderInspection(inspection, mode){
  // mode: "link" (default, "Use an Existing Folder" -- points a tracker
  // directly at this folder, so a folder already linked elsewhere is a
  // hard block) or "import" ("Import a Copy of a Folder" -- copies the
  // folder's contents into a brand-new tracker, so a folder already
  // linked elsewhere is harmless to import from and only needs a soft
  // warning).
  if (!inspection || inspection.error) {
    return {tone:"block", headline:"Couldn't read that folder.", sub:(inspection && inspection.error) || "Something went wrong -- please try again.", canContinue:false};
  }
  if (inspection.internal_conflict) {
    // JobTracker's own internal storage, or something nested inside an
    // existing tracker's root -- never a valid target, for either link
    // or import (backend rejects both; see workspace._internal_tracker_conflict).
    return {tone:"block", headline:"That's not a tracker folder.", sub:inspection.internal_conflict, canContinue:false};
  }
  if (inspection.already_linked) {
    if (mode === "import") {
      return {
        tone:"warn",
        headline:`This folder is already linked as "${inspection.already_linked_name || "another tracker"}".`,
        sub:"Importing makes an independent copy, so this is safe — it won't disturb that tracker. You'll end up with two separate trackers pointing at the same starting content.",
        canContinue:true,
      };
    }
    return {
      tone:"block",
      headline:`This folder is already linked as "${inspection.already_linked_name || "another tracker"}".`,
      sub:"Pick a different folder, or switch to that tracker above instead.",
      canContinue:false,
    };
  }
  if (inspection.is_empty) {
    return {tone:"", headline:"This folder is empty.", sub:"JobTracker Hub will start a brand-new, empty tracker here — nothing to bring in yet.", canContinue:true};
  }
  if (inspection.looks_like_tracker && inspection.has_portable_overrides) {
    return {tone:"", headline:"This already looks like a JobTracker tracker.", sub:"Its statuses, notes, and follow-up dates will come with it.", canContinue:true};
  }
  if (inspection.looks_like_tracker) {
    return {tone:"", headline:"This looks like an existing tracker folder.", sub:"It doesn't have JobTracker's notes file yet — continuing will set one up (empty) right inside this folder, so future notes and statuses stay with it.", canContinue:true};
  }
  return {
    tone:"warn",
    headline:"This doesn't look like a JobTracker folder.",
    sub:"It has files, but none of the usual tracker folders (Applications, Certifications, References, ...). If this isn't the right folder, pick a different one below. Otherwise, continuing will start treating it as a tracker from here on.",
    canContinue:true,
  };
}

// The three ways to get a tracker onto your list -- Create, Import a Copy
// (zip or folder), Use an Existing Folder (link, desktop only) -- grouped
// by what the user is trying to do rather than by mechanism (see
// HANDOFF.md §3j.2), and defined exactly once (§3j.4) so WorkspacePopover
// and NoTrackerOnboarding can't drift out of sync with each other the way
// they had before. `layout` only changes container/spacing choices
// ("popover" = compact rows inside the J-switcher popover, "onboarding" =
// roomier rows inside the first-run card); the actions, copy, and API
// calls underneath are identical either way. Errors are reported to the
// caller via `onError` rather than kept locally, so each layout can show
// them wherever its existing error banner already lives.
// Shown when "Import a Copy" is clicked with a picked folder that's
// missing .jobtracker, in a browser we don't already know is Chrome (see
// suspectedNoDotfileFolderUpload) -- offers to hand off to Chrome instead
// of silently doing the lossy import. Deliberately honest about what's
// actually guaranteed here: no web page can detect which browsers are
// installed. An earlier version of this modal tried a "googlechrome://"
// link as a one-click shortcut -- confirmed in testing (session 9b) that
// on current macOS/Safari this doesn't silently no-op the way undocumented
// custom URL schemes are expected to; it throws a visible, alarming
// "Safari cannot open the page because the address is invalid" system
// dialog instead. That's worse than doing nothing, so the scheme link has
// been removed entirely -- copy-and-paste is now the one and only path,
// which is slower but never fails confusingly.
function ChromeHandoffModal({onContinueAnyway, onCancel}){
  const [copied, setCopied] = useState(false);
  const plainUrl = `${window.location.origin}${window.location.pathname}?view=pipeline`;

  async function copyUrl(){
    try { await navigator.clipboard.writeText(plainUrl); setCopied(true); setTimeout(() => setCopied(false), 1500); }
    catch(e) { /* best-effort */ }
  }

  // The import itself happened in a different browser entirely, so this
  // tab's in-memory tracker list has no way to know about it -- every
  // other import path in this app (doImport, link/native imports, the
  // tracker switcher, see the window.location.reload() calls near it)
  // reloads the page afterward for exactly this reason. Closing this
  // modal without reloading would leave the person staring at the same
  // stale "Nothing here" pipeline they started with. So this button does
  // both: close, then reload, matching what every other successful import
  // in this app already does.
  function finishedInChrome(){
    onCancel();
    window.location.reload();
  }

  return (
    <div className="modal-backdrop" onClick={onCancel}>
      <div className="modal" onClick={e => e.stopPropagation()} style={{position:"relative", maxWidth:460}}>
        <button className="close-x" onClick={onCancel}>{"\u2715"}</button>
        <h2>Bring in a complete copy instead?</h2>
        <p style={{color:"var(--text-mute)", fontSize:12, marginTop:6}}>
          This browser won't include your existing notes, statuses, or
          dates in a folder copy. Chrome has carried these across
          successfully in testing. Here's how to switch over:
        </p>

        <ol style={{margin:"14px 0 0", paddingLeft:20, fontSize:13, lineHeight:1.6, color:"var(--text-strong)"}}>
          <li>
            Copy this address:
            <div style={{display:"flex", gap:6, marginTop:6}}>
              <input className="workspace-rename-input" readOnly value={plainUrl}
                style={{fontSize:11.5}} onClick={e => e.target.select()} />
              <button className="btn" style={{flex:"none"}} onClick={copyUrl}>{copied ? "Copied\u2713" : "Copy"}</button>
            </div>
          </li>
          <li style={{marginTop:10}}>
            Open Chrome and paste it into the address bar.
          </li>
          <li style={{marginTop:10}}>
            In Chrome, use <b>Bring In a Copy</b> the same way you did
            here — it'll include everything this time.
          </li>
          <li style={{marginTop:10}}>
            Once the import finishes in Chrome, come back here and click
            <b> I'm Done — Close This</b> below. This tab will refresh to
            pick up what you just imported.
          </li>
        </ol>

        <div className="modal-foot" style={{justifyContent:"space-between"}}>
          <button className="btn" onClick={onContinueAnyway}>Continue Importing Here Instead</button>
          <button className="btn primary" onClick={finishedInChrome}>I'm Done — Close This</button>
        </div>
      </div>
    </div>
  );
}

function TrackerCreationActions({layout, packaged, onError}){
  const onboarding = layout === "onboarding";

  const [creating, setCreating] = useState(false);
  const [newName, setNewName] = useState("");
  const [createBusy, setCreateBusy] = useState(false);

  const [importing, setImporting] = useState(false);
  const [importName, setImportName] = useState("");
  const [importFile, setImportFile] = useState(null);         // single .zip File
  const [importFolderFiles, setImportFolderFiles] = useState(null); // FileList (browser webkitdirectory)
  const [importDragOver, setImportDragOver] = useState(false);
  const [importBusy, setImportBusy] = useState(false);
  const importFileInputRef = useRef(null);
  const importFolderInputRef = useRef(null);

  // Packaged-only "Choose a folder instead" preview state -- pick -> inspect
  // -> confirm, so picking a folder to import no longer commits blind. See
  // describeFolderInspection() above for how an inspection becomes what's
  // shown. null = no preview showing yet.
  const [importPreview, setImportPreview] = useState(null); // {path, name, inspection}
  const [importPreviewBusy, setImportPreviewBusy] = useState(false);

  // Packaged-only "Use This Folder As-Is" (link) preview state -- same
  // pick -> inspect -> confirm split as above.
  const [linkPreview, setLinkPreview] = useState(null); // {path, name, inspection}
  const [linkPreviewBusy, setLinkPreviewBusy] = useState(false);
  const [linkBusy, setLinkBusy] = useState(false);

  // Gate before the lossy path: shown instead of importing immediately
  // when the picked folder is missing .jobtracker and we're not already
  // in a browser known to carry it. See ChromeHandoffModal above.
  const [chromeHandoffOpen, setChromeHandoffOpen] = useState(false);

  async function doCreate(){
    const n = newName.trim();
    if (!n) return;
    setCreateBusy(true); onError(null);
    try {
      const result = await apiPost("/api/workspaces", {name: n});
      const staleCount = (result && result.workspace && result.workspace.stale_siblings_found) || 0;
      if (staleCount > 0) {
        try { sessionStorage.setItem(STALE_SIBLINGS_KEY, String(staleCount)); } catch(e) { /* best-effort */ }
      }
      clearCache();
      window.location.reload();
    } catch (e) { onError(String(e.message || e)); setCreateBusy(false); }
  }

  // Multipart, like the document/application upload flows elsewhere --
  // posts the tracker name plus either a single .zip (import) or every
  // file from a picked folder (import-folder, each carrying its
  // webkitRelativePath as its filename so the server can rebuild the
  // folder structure). See workspace.import_workspace_from_zip /
  // import_workspace_from_files for how the source's contents get placed
  // on disk -- the source itself is only ever read, never modified.
  async function doImport(){
    const n = importName.trim();
    const hasFolder = importFolderFiles && importFolderFiles.length > 0;
    if (!n || (!importFile && !hasFolder)) return;
    setImportBusy(true); onError(null);
    try {
      const form = new FormData();
      form.append("name", n);
      let path;
      if (hasFolder) {
        for (const f of importFolderFiles) form.append("files", f, f.webkitRelativePath || f.name);
        path = "/api/workspaces/import-folder";
      } else {
        form.append("file", importFile);
        path = "/api/workspaces/import";
      }
      const result = await uploadFormData(`${API_BASE}${path}`, form);
      const staleCount = (result && result.workspace && result.workspace.stale_siblings_found) || 0;
      if (staleCount > 0) {
        try { sessionStorage.setItem(STALE_SIBLINGS_KEY, String(staleCount)); } catch(e) { /* best-effort */ }
      }
      // Only set on success, right before the reload that would otherwise
      // wipe it -- see IMPORT_NOTICE_KEY. For the folder path, don't assume
      // dotfiles were stripped -- check what the browser actually handed us.
      // webkitRelativePath is "<pickedFolderName>/rest/of/path", so a
      // .jobtracker entry shows up as a path segment, not necessarily a
      // prefix -- match it anywhere in the path.
      let folderNotice = "folder-warning";
      if (hasFolder && folderFilesIncludeDotfile(importFolderFiles)) {
        folderNotice = "folder-success";
      }
      try { sessionStorage.setItem(IMPORT_NOTICE_KEY, hasFolder ? folderNotice : "zip-success"); } catch(e) { /* best-effort */ }
      clearCache();
      window.location.reload();
    } catch (e) { onError(String(e.message || e)); setImportBusy(false); }
  }

  // Packaged-desktop-only path for "Choose a folder instead": pick_folder()
  // opens the native dialog, inspect_folder() proxies to
  // /api/workspaces/inspect so the user sees what's in the folder (and a
  // default tracker name) before committing. Bridge methods live in
  // desktop/launcher.py's Api; the actual copy happens in
  // confirmImportFolderNative() via Api.confirm_import_folder. Browsers
  // have no equivalent (no real filesystem path from an <input type="file">),
  // so this whole flow only ever renders when packaged.
  async function startImportFolderNative(){
    if (!window.pywebview || !window.pywebview.api || !window.pywebview.api.pick_folder) {
      onError("Native folder import isn't available in this build.");
      return;
    }
    onError(null);
    setImportPreviewBusy(true);
    try {
      const picked = await window.pywebview.api.pick_folder();
      if (!picked || !picked.path) { setImportPreviewBusy(false); return; } // cancelled
      const inspection = await window.pywebview.api.inspect_folder(picked.path);
      const base = (picked.path.replace(/[\\/]+$/, "").split(/[\\/]/).pop()) || picked.path;
      const defaultName = base.startsWith("JobTracker — ") ? (base.slice("JobTracker — ".length).trim() || base) : base;
      setImportPreview({path: picked.path, name: defaultName, inspection});
    } catch (e) {
      onError(String(e.message || e));
    } finally {
      setImportPreviewBusy(false);
    }
  }

  function cancelImportPreview(){ setImportPreview(null); }

  async function confirmImportFolderNative(){
    if (!importPreview) return;
    const n = importPreview.name.trim();
    if (!n) return;
    setImportBusy(true);
    onError(null);
    try {
      const result = await window.pywebview.api.confirm_import_folder(importPreview.path, n);
      if (result && result.error) { onError(result.error); setImportBusy(false); return; }
      // Native folder import reads the real filesystem, so it carries
      // .jobtracker/overrides.db across just like a zip does -- give it
      // the same kind of confirmation toast a zip import gets, rather
      // than staying the one silent success path (§3j.3 toast-parity fix).
      try { sessionStorage.setItem(IMPORT_NOTICE_KEY, "folder-native-success"); } catch(e) { /* best-effort */ }
      const staleCount = (result && result.workspace && result.workspace.stale_siblings_found) || 0;
      if (staleCount > 0) {
        try { sessionStorage.setItem(STALE_SIBLINGS_KEY, String(staleCount)); } catch(e) { /* best-effort */ }
      }
      clearCache();
      window.location.reload();
    } catch (e) { onError(String(e.message || e)); setImportBusy(false); }
  }

  // Packaged-desktop-only: registers an EXISTING folder as a tracker IN
  // PLACE (nothing copied). Same pick -> inspect -> confirm split as
  // above, for the same reason: show what's actually in the folder --
  // file count, whether it already looks like a tracker, whether it's
  // already linked elsewhere, or whether it's JobTracker's own internal
  // storage (§3j.5) -- before committing.
  async function startLinkFolderNative(){
    if (!window.pywebview || !window.pywebview.api || !window.pywebview.api.pick_folder) {
      onError("Using an existing folder isn't available in this build.");
      return;
    }
    onError(null);
    setLinkPreviewBusy(true);
    try {
      const picked = await window.pywebview.api.pick_folder();
      if (!picked || !picked.path) { setLinkPreviewBusy(false); return; } // cancelled
      const inspection = await window.pywebview.api.inspect_folder(picked.path);
      const base = (picked.path.replace(/[\\/]+$/, "").split(/[\\/]/).pop()) || picked.path;
      const defaultName = base.startsWith("JobTracker — ") ? (base.slice("JobTracker — ".length).trim() || base) : base;
      setLinkPreview({path: picked.path, name: defaultName, inspection});
    } catch (e) {
      onError(String(e.message || e));
    } finally {
      setLinkPreviewBusy(false);
    }
  }

  function cancelLinkPreview(){ setLinkPreview(null); }

  async function confirmLinkFolderNative(){
    if (!linkPreview) return;
    const n = linkPreview.name.trim();
    if (!n) return;
    setLinkBusy(true);
    onError(null);
    try {
      const result = await window.pywebview.api.confirm_link_folder(linkPreview.path, n);
      if (result && result.error) { onError(result.error); setLinkBusy(false); return; }
      clearCache();
      window.location.reload();
    } catch (e) { onError(String(e.message || e)); setLinkBusy(false); }
  }

  const rowClass = "workspace-row-main workspace-new-btn";

  return (
    <div className={onboarding ? "tca-onboarding" : undefined}>
      {/* ---- Start Fresh ---- */}
      <div className="workspace-group-label">Start Fresh</div>
      {creating ? (
        <div className="workspace-import-row">
          <input
            className="workspace-rename-input" autoFocus placeholder="Tracker name"
            value={newName} onChange={e => setNewName(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter") doCreate(); if (e.key === "Escape") setCreating(false); }}
          />
          <div className="workspace-import-actions">
            <button className="btn" onClick={() => setCreating(false)}>Cancel</button>
            <button className="btn primary" disabled={createBusy || !newName.trim()}
              onClick={doCreate}>{createBusy ? "Creating\u2026" : "Create tracker"}</button>
          </div>
        </div>
      ) : (
        <>
          <button className={rowClass} onClick={() => setCreating(true)}>
            {"\u2795"} Start Fresh
          </button>
          <div className="workspace-action-desc">Starts a blank tracker with an empty Applications folder — for a brand-new job search.</div>
        </>
      )}

      {/* ---- Bring In a Copy (zip or folder) ---- */}
      <div className="workspace-group-label">Bring In a Copy</div>
      {importing ? (
        <div className="workspace-import-row">
          <input
            className="workspace-rename-input" autoFocus placeholder="Tracker name"
            value={importName} onChange={e => setImportName(e.target.value)}
            onKeyDown={e => { if (e.key === "Escape") { setImporting(false); setImportFile(null); setImportFolderFiles(null); } }}
          />
          <div
            className={"dropzone compact" + (importDragOver ? " drag-over" : "")}
            onDragOver={e => { e.preventDefault(); setImportDragOver(true); }}
            onDragLeave={() => setImportDragOver(false)}
            onDrop={e => {
              e.preventDefault(); setImportDragOver(false);
              const f = e.dataTransfer.files && e.dataTransfer.files[0];
              if (!f) return;
              if (!f.name.toLowerCase().endsWith(".zip")) { onError("Drag-and-drop only accepts a .zip file here — use \u201cChoose a folder instead\u201d below to import an unzipped folder."); return; }
              setImportFile(f); setImportFolderFiles(null);
              if (!importName.trim()) setImportName(f.name.replace(/\.zip$/i, ""));
            }}
            onClick={() => importFileInputRef.current && importFileInputRef.current.click()}
          >
            <input
              ref={importFileInputRef} type="file" accept=".zip" style={{display:"none"}}
              onChange={e => {
                const f = e.target.files && e.target.files[0] ? e.target.files[0] : null;
                if (f) { setImportFile(f); setImportFolderFiles(null); if (!importName.trim()) setImportName(f.name.replace(/\.zip$/i, "")); }
              }}
            />
            <span className="dropzone-icon">{"\u{1F4E6}"}</span>
            <span>
              {importFile ? importFile.name
                : importFolderFiles ? `${importFolderFiles.length} files selected`
                : (importDragOver ? "Drop the .zip here" : "Drag a tracker .zip here, or click to browse")}
            </span>
          </div>
          <div className="workspace-import-or">
            <span>or</span>
            <button className={"link-btn" + (importPreviewBusy ? " spinning" : "")} type="button" disabled={importBusy || importPreviewBusy}
              onClick={() => {
                // Packaged desktop: pick the folder, then show a preview
                // (same pick -> inspect -> confirm shape as "Use This
                // Folder As-Is" below) before committing -- lossless, so
                // no portability warning needed (§3j.2). Browser: fall
                // back to the hidden webkitdirectory input's pick-then-
                // submit flow below -- lossy, so the note right below
                // this link says so up front, before the picker opens,
                // rather than only after import (§3j.2/§3j.3).
                if (packaged) { startImportFolderNative(); }
                else { importFolderInputRef.current && importFolderInputRef.current.click(); }
              }}>
              {"\u{1F4C1}"} {importPreviewBusy ? "Looking\u2026" : "Choose a folder instead"}
            </button>
            {!packaged && (
              <input
                ref={importFolderInputRef} type="file" webkitdirectory="" directory="" multiple style={{display:"none"}}
                onChange={e => {
                  const list = e.target.files;
                  if (!list || !list.length) return;
                  setImportFolderFiles(list); setImportFile(null);
                  if (!importName.trim()) {
                    const top = (list[0].webkitRelativePath || list[0].name).split("/")[0];
                    setImportName(top);
                  }
                }}
              />
            )}
          </div>
          {packaged ? (
            <div className="workspace-pop-hint">
              Picking a folder above shows a preview before importing — no
              need to use "Import a Copy" below for folders (that button
              is for .zip files only in this app).
            </div>
          ) : (
            <div className="workspace-portability-note">
              On the web, folder copies can't include existing notes or
              statuses (browsers can't see hidden files). For a complete
              copy including your notes, use a .zip export instead.
            </div>
          )}
          {packaged && importPreview && (() => {
            const desc = describeFolderInspection(importPreview.inspection, "import");
            const insp = importPreview.inspection;
            const fileCountLine = insp && insp.exists && !insp.is_empty
              ? `${insp.file_count}${insp.capped ? "+" : ""} file${insp.file_count === 1 ? "" : "s"} found`
              : "";
            return (
              <div className={"workspace-preview" + (desc.tone ? " " + desc.tone : "")}>
                <div className="workspace-preview-path">{importPreview.path}</div>
                <div className="workspace-preview-headline">{desc.headline}</div>
                <div className="workspace-preview-sub">{desc.sub}{fileCountLine ? " \u00b7 " + fileCountLine : ""}</div>
                {desc.canContinue && (
                  <input
                    className="workspace-rename-input" style={{margin:"8px 0 0", width:"100%", boxSizing:"border-box"}}
                    value={importPreview.name} placeholder="Tracker name"
                    onChange={e => setImportPreview(p => ({...p, name: e.target.value}))}
                  />
                )}
                <div className="workspace-import-actions" style={{marginTop:8}}>
                  <button className="btn" onClick={cancelImportPreview}>Choose a different folder</button>
                  {desc.canContinue && (
                    <button className="btn primary" disabled={importBusy || !importPreview.name.trim()}
                      onClick={confirmImportFolderNative}>{importBusy ? "Importing\u2026" : "Import this folder"}</button>
                  )}
                </div>
              </div>
            );
          })()}
          <div className="workspace-import-actions">
            <button className="btn" onClick={() => { setImporting(false); setImportFile(null); setImportFolderFiles(null); }}>Cancel</button>
            <button className="btn primary" disabled={importBusy || !importName.trim() || (!importFile && !(importFolderFiles && importFolderFiles.length))}
              onClick={() => {
                const hasFolder = importFolderFiles && importFolderFiles.length > 0;
                const risky = !packaged && hasFolder && !folderFilesIncludeDotfile(importFolderFiles) && suspectedNoDotfileFolderUpload();
                if (risky) { setChromeHandoffOpen(true); } else { doImport(); }
              }}>{importBusy ? "Importing\u2026" : "Import a Copy"}</button>
          </div>
        </div>
      ) : (
        <>
          <button className={rowClass} onClick={() => setImporting(true)}>
            {"\u{1F4E5}"} Bring In a Copy
          </button>
          <div className="workspace-action-desc">Copies files into a new tracker owned by this app — the original folder or .zip stays untouched.</div>
        </>
      )}

      {/* ---- Use This Folder As-Is (link, desktop only) ---- */}
      {packaged && (
        <>
          <div className="workspace-group-label">Use This Folder As-Is</div>
          {linkPreview ? (() => {
            const desc = describeFolderInspection(linkPreview.inspection, "link");
            const insp = linkPreview.inspection;
            const fileCountLine = insp && insp.exists && !insp.is_empty
              ? `${insp.file_count}${insp.capped ? "+" : ""} file${insp.file_count === 1 ? "" : "s"} found`
              : "";
            return (
              <div className={"workspace-preview" + (desc.tone ? " " + desc.tone : "")}>
                <div className="workspace-preview-path">{linkPreview.path}</div>
                <div className="workspace-preview-headline">{desc.headline}</div>
                <div className="workspace-preview-sub">{desc.sub}{fileCountLine ? " \u00b7 " + fileCountLine : ""}</div>
                {desc.canContinue && (
                  <input
                    className="workspace-rename-input" style={{margin:"8px 0 0", width:"100%", boxSizing:"border-box"}}
                    value={linkPreview.name} placeholder="Tracker name"
                    onChange={e => setLinkPreview(p => ({...p, name: e.target.value}))}
                  />
                )}
                <div className="workspace-import-actions" style={{marginTop:8}}>
                  <button className="btn" onClick={cancelLinkPreview}>Choose a different folder</button>
                  {desc.canContinue && (
                    <button className="btn primary" disabled={linkBusy || !linkPreview.name.trim()}
                      onClick={confirmLinkFolderNative}>{linkBusy ? "Linking\u2026" : "Use this folder"}</button>
                  )}
                </div>
              </div>
            );
          })() : (
            <>
              <button className={rowClass + (linkPreviewBusy ? " spinning" : "")}
                disabled={linkPreviewBusy} onClick={startLinkFolderNative}>
                {"\u{1F517}"} {linkPreviewBusy ? "Looking\u2026" : "Use This Folder As-Is"}
              </button>
              <div className="workspace-action-desc">Points at a folder in place — nothing is copied. Its notes and statuses (if any) come with it.</div>
            </>
          )}
        </>
      )}
      {chromeHandoffOpen && (
        <ChromeHandoffModal
          onCancel={() => setChromeHandoffOpen(false)}
          onContinueAnyway={() => { setChromeHandoffOpen(false); doImport(); }}
        />
      )}
    </div>
  );
}

function WorkspacePopover({onClose, anchorRef, packaged, statusInfo}){
  const [data, setData] = useState(null);   // {active, workspaces:[...]}
  const [err, setErr] = useState(null);
  const [busyId, setBusyId] = useState(null);
  const [renamingId, setRenamingId] = useState(null);
  const [renameVal, setRenameVal] = useState("");
  const popRef = useRef(null);
  // Create/Import/Link are handled by the shared TrackerCreationActions
  // component below (§3j.4) -- this component only owns the tracker LIST
  // (switch/rename/export/delete) plus the top status card.

  const load = useCallback(() => {
    apiGet("/api/workspaces").then(setData).catch(e => setErr(String(e.message || e)));
  }, []);
  useEffect(() => { load(); }, [load]);

  // Close on outside click / Escape — anchorRef lets us ignore the click
  // that opened this popover (the logo button itself) so toggling isn't
  // immediately undone by its own mousedown bubbling to document.
  useEffect(() => {
    function onDocMouseDown(e){
      if (popRef.current && popRef.current.contains(e.target)) return;
      if (anchorRef.current && anchorRef.current.contains(e.target)) return;
      onClose();
    }
    function onKey(e){ if (e.key === "Escape") onClose(); }
    document.addEventListener("mousedown", onDocMouseDown);
    document.addEventListener("keydown", onKey);
    return () => {
      document.removeEventListener("mousedown", onDocMouseDown);
      document.removeEventListener("keydown", onKey);
    };
  }, [onClose, anchorRef]);

  async function doSwitch(id){
    if (!data || id === data.active) { onClose(); return; }
    setBusyId(id);
    try {
      await apiPost("/api/workspaces/switch", {id});
      clearCache();
      window.location.reload();
    } catch (e) { setErr(String(e.message || e)); setBusyId(null); }
  }

  async function doRename(id){
    const name = renameVal.trim();
    if (!name) { setRenamingId(null); return; }
    setBusyId(id);
    try {
      await apiPost(`/api/workspaces/${encodeURIComponent(id)}/rename`, {name});
      setRenamingId(null);
      // Renaming the *active* tracker changes what the rail's J-row label
      // shows (see App's statusInfo.workspace.name) — that only gets
      // refetched on a full reload or the next 15s poll, so force it now
      // rather than leaving the sidebar showing the old name briefly.
      if (data && data.active === id) { window.location.reload(); return; }
      load();
    } catch (e) { setErr(String(e.message || e)); }
    finally { setBusyId(null); }
  }

  async function doExport(id, name){
    // Packaged desktop: the browser-only blob-download trick below
    // (fetch -> Blob -> ObjectURL -> hidden <a download> .click()) is a
    // silent no-op in WKWebView -- nothing throws, so the try/catch
    // never sees an error, the zip just never reaches disk. Bridge
    // method lives in desktop/launcher.py's Api.export_workspace: it
    // fetches the same bytes over HTTP from Python instead of the
    // browser, and uses a native SAVE_DIALOG so the user picks where
    // the file goes.
    if (packaged) {
      if (!window.pywebview || !window.pywebview.api || !window.pywebview.api.export_workspace) {
        setErr("Native export isn't available in this build.");
        return;
      }
      setBusyId(id);
      setErr(null);
      try {
        const safeName = (name || "tracker").replace(/[\/\\:*?"<>|]+/g, "_");
        const result = await window.pywebview.api.export_workspace(id, `${safeName}.zip`);
        if (result && result.error) { setErr(result.error); }
      } catch (e) { setErr(String(e.message || e)); }
      finally { setBusyId(null); }
      return;
    }
    // fetch + blob (rather than a plain <a href> download) so we can show
    // a busy state on the button while the server builds the zip — for a
    // big tracker that can take a moment, and a silent click with no
    // feedback looks broken.
    setBusyId(id);
    try {
      const res = await fetch(`/api/workspaces/${encodeURIComponent(id)}/export`);
      if (!res.ok) {
        let msg = "Export failed.";
        try { const j = await res.json(); if (j.detail) msg = j.detail; } catch {}
        throw new Error(msg);
      }
      const blob = await res.blob();
      const cd = res.headers.get("Content-Disposition") || "";
      const match = cd.match(/filename="?([^"; ]+)"?/);
      const filename = match ? match[1] : `${id}.zip`;
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch (e) {
      setErr(String(e.message || e));
    } finally {
      setBusyId(null);
    }
  }

  async function doDelete(id, name, kind){
    const isLinked = kind === "linked";
    const message = isLinked
      ? `Unlink "${name}"?\n\nThis only removes it from your tracker list and deletes this app's own index/notes cache for it. The folder itself — and everything in it — stays exactly where it is on disk; nothing is moved or deleted.`
      : `Delete "${name}"?\n\nIts index/notes cache is deleted, and its tracker folder is sent to the Trash (recoverable there — this never permanently deletes anything).`;
    if (!window.confirm(message)) return;
    setBusyId(id);
    try {
      await apiDelete(`/api/workspaces/${encodeURIComponent(id)}`);
      load();
    } catch (e) { setErr(String(e.message || e)); }
    finally { setBusyId(null); }
  }

  return (
    <div ref={popRef} className="workspace-pop" role="menu">
      <div className="workspace-pop-title">Trackers</div>
      <div className="workspace-pop-hint">
        Each tracker points at one folder on disk. Anything you add or
        import for a tracker lives inside that tracker's folder.
      </div>
      {data && statusInfo && statusInfo.workspace && (() => {
        const active = data.workspaces.find(w => w.id === data.active) || {};
        const kind = active.kind || statusInfo.workspace.kind || "owned";
        const hasOverrides = statusInfo.workspace.has_portable_overrides;
        const docCount = statusInfo.doc_count || 0;
        return (
          <div className="workspace-status-card" title={statusInfo.root}>
            <div className="workspace-status-row">
              <span className="workspace-status-badge">
                {kind === "linked" ? "LINKED FOLDER" : "JOBTRACKER-OWNED COPY"}
              </span>
              <span>{docCount} doc{docCount === 1 ? "" : "s"}</span>
            </div>
            <div className="workspace-status-row">
              <span className={hasOverrides ? "workspace-status-check" : "workspace-status-warn"}>
                {hasOverrides ? "\u2713 Notes stored with tracker" : "Notes not saved yet"}
              </span>
            </div>
            <div className="workspace-status-path">{statusInfo.root}</div>
          </div>
        );
      })()}
      {err && <div className="workspace-pop-err">{err}</div>}
      {!data && !err && <div className="workspace-pop-loading">Loading…</div>}
      {data && data.workspaces.map(w => (
        <div key={w.id} className={"workspace-row" + (w.id === data.active ? " active" : "")}>
          {renamingId === w.id ? (
            <input
              className="workspace-rename-input" autoFocus value={renameVal}
              onChange={e => setRenameVal(e.target.value)}
              onKeyDown={e => { if (e.key === "Enter") doRename(w.id); if (e.key === "Escape") setRenamingId(null); }}
              onBlur={() => doRename(w.id)}
            />
          ) : (
            <button
              className="workspace-row-main" disabled={busyId === w.id}
              onClick={() => doSwitch(w.id)} title={w.root}
            >
              <span className="workspace-check">{w.id === data.active ? "\u2713" : ""}</span>
              <span className="workspace-name">{w.name}</span>
            </button>
          )}
          {renamingId !== w.id && (
            <div className="workspace-row-actions">
              <button className="workspace-row-btn" title="Rename"
                onClick={() => { setRenamingId(w.id); setRenameVal(w.name); }}>{"\u270E"}</button>
              <button className={"workspace-row-btn" + (busyId === w.id ? " spinning" : "")}
                disabled={busyId === w.id}
                title={busyId === w.id ? "Exporting\u2026" : "Export as zip"}
                onClick={() => doExport(w.id, w.name)}>{"\u2913"}</button>
              {w.id !== "default" && (
                w.kind === "linked" ? (
                  <button className={"workspace-row-btn" + (busyId === w.id ? " spinning" : "")}
                    disabled={busyId === w.id} title="Unlink (just removes it from this list — the folder itself is never touched)"
                    onClick={() => doDelete(w.id, w.name, w.kind)}>{"\u26D3\uFE0F"}</button>
                ) : (
                  <button className={"workspace-row-btn" + (busyId === w.id ? " spinning" : "")}
                    disabled={busyId === w.id} title="Delete (its cache is removed; its tracker folder is sent to the Trash)"
                    onClick={() => doDelete(w.id, w.name, w.kind)}>{"\u2715"}</button>
                )
              )}
            </div>
          )}
        </div>
      ))}
      <div className="workspace-pop-divider" />
      <TrackerCreationActions layout="popover" packaged={packaged} onError={setErr} />
    </div>
  );
}
