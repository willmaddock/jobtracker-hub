function DocGrid({docs, docTypeLabels, onOpen, onView, query, onFixType, onRename, onDelete}){
  const {showSource} = useContext(ShowSourceContext);
  const {pendingDeleteIds} = useContext(PendingDeleteContext);
  const all = docs || [];
  const sourceVisible = all.filter(d => showSource || !d.is_source);
  const visible = sourceVisible.filter(d => !pendingDeleteIds.has(d.id));
  const hiddenCount = all.length - sourceVisible.length;

  if (all.length === 0) {
    return <EmptyState icon={"\u{1F4C1}"} title="No documents indexed" sub="This application doesn't have any files under it yet." />;
  }
  return (
    <div>
      <div className="doc-grid">
        {visible.map(d => {
          const badge = extBadge(d.ext);
          const etype = docEffectiveType(d);
          const label = (docTypeLabels && docTypeLabels[etype]) || DEFAULT_DOC_TYPE_LABELS[etype] || etype;
          return (
            <div className="doc-card" key={d.id}>
              <div className="doc-card-top">
                <div className="doc-icon" style={{background:badge.bg, color:badge.fg}}>{badge.label}</div>
                <div className="doc-meta">
                  <div className="doc-name" title={d.filename}><Highlight text={d.filename} query={query} /></div>
                  <div className="doc-type">
                    {label}
                    {d.doc_type === "other" && !d.doc_type_override && (
                      <span title="Filename gave no classification signal — open to check" style={{color:"#F59E0B", marginLeft:6}}>{"\u2753 unclassified"}</span>
                    )}
                    {d.duplicate_count > 0 && (
                      <span title="Byte-identical to a document used elsewhere — nothing deleted or merged" style={{color:"#F59E0B", marginLeft:6}}>
                        {"\u29C9"} also used in {d.duplicate_count} other place{d.duplicate_count > 1 ? "s" : ""}
                      </span>
                    )}
                  </div>
                </div>
              </div>
              <div className="doc-actions">
                {isInlineViewable(d) && (
                  <button className="doc-open" title="View inline" onClick={() => onView(d)}>{"\u{1F441}"}</button>
                )}
                <button className="doc-open" title="Open in OS" onClick={() => onOpen(d.relpath)}>{"\u2197"}</button>
                {onFixType && d.doc_type === "other" && (
                  <button className="doc-open" title="Correct the document type (doesn't rename the file)" onClick={() => onFixType(d)}>{"\u270E"}</button>
                )}
                {onRename && (
                  <button className="doc-open" title="Rename file" onClick={() => onRename(d)}>{"\u{1F4DD}"}</button>
                )}
                {onDelete && (
                  <button className="doc-open" title="Move to Trash" onClick={() => onDelete(d)}>{"\u{1F5D1}\uFE0F"}</button>
                )}
              </div>
            </div>
          );
        })}
      </div>
      {hiddenCount > 0 && (
        <div style={{color:"var(--text-soft)", fontSize:12, padding:"6px 2px"}}>
          {hiddenCount} source file{hiddenCount > 1 ? "s" : ""} hidden — toggle "Show source files" in the top bar.
        </div>
      )}
    </div>
  );
}

/* =========================== UPLOAD DROPZONE =========================== */
// Same native-HTML5 drag pattern as KanbanBoard above, plus a plain file
// input as a click-to-browse fallback (needed on mobile, and for anyone
// who'd rather pick files than drag them).
function UploadDropzone({itemId, onUpload, compact}){
  const [over, setOver] = useState(false);
  const [busy, setBusy] = useState(false);
  const inputRef = useRef(null);

  const send = async (fileList) => {
    if (!fileList || !fileList.length) return;
    setBusy(true);
    try { await onUpload(itemId, Array.from(fileList)); }
    catch (e) { /* App-level uploadDocuments has no error toast of its own on failure — surface it here */ alert(`Upload failed: ${e.message}`); }
    finally { setBusy(false); }
  };

  return (
    <div
      className={"dropzone" + (compact ? " compact" : "") + (over ? " drag-over" : "") + (busy ? " busy" : "")}
      onDragOver={e => { e.preventDefault(); setOver(true); }}
      onDragLeave={() => setOver(false)}
      onDrop={e => { e.preventDefault(); setOver(false); send(e.dataTransfer.files); }}
      onClick={() => !busy && inputRef.current && inputRef.current.click()}
    >
      <input ref={inputRef} type="file" multiple style={{display:"none"}}
        onChange={e => { send(e.target.files); e.target.value = ""; }} />
      <span className="dropzone-icon">{"\u{1F4CE}"}</span>
      <span>{busy ? "Uploading\u2026" : (over ? "Drop to add" : "Drag files here, or click to browse")}</span>
    </div>
  );
}

/* =========================== APPLICATION DOSSIER (Checkpoint 4) =========================== */
// One row per contact value (email/phone/url) in a dossier's `contacts`
// object — a copy button plus an action button that opens the right
// handler (mailto:/tel:/https:) via openExternalUrl, same OS-opener path
// Search Hub already uses for external links.
function ContactGroup({label, kind, values, fireToast}){
  if (!values || !values.length) return null;

  const copy = async (v) => {
    try { await navigator.clipboard.writeText(v); fireToast && fireToast("Copied."); }
    catch (e) { fireToast && fireToast("Couldn't copy — select and copy manually."); }
  };
  const act = (v) => {
    if (kind === "email") return openExternalUrl(`mailto:${v}`);
    if (kind === "phone") return openExternalUrl(`tel:${v.replace(/[^\d+]/g, "")}`);
    const url = /^https?:\/\//i.test(v) ? v : `https://${v}`;
    return openExternalUrl(url);
  };
  const actionLabel = kind === "email" ? "Email" : kind === "phone" ? "Call" : "Open";

  return (
    <div className="dossier-contact-group">
      <div className="dossier-role-label">{label}</div>
      {values.map(v => (
        <div className="contact-row" key={v}>
          <span className="contact-value" title={v}>{v}</span>
          <button className="contact-btn" onClick={() => copy(v)} title="Copy">{"\u{1F4CB}"}</button>
          <button className="contact-btn" onClick={() => act(v)} title={actionLabel}>{actionLabel}</button>
        </div>
      ))}
    </div>
  );
}

// Renders one item's Application Dossier: the four role sections extracted
// from whichever attached document is classified as the job posting, plus
// contacts merged across every attached document. `dossier` is
// undefined while the fetch is in flight (see App()'s ensureDossier), null
// if it hasn't been requested yet, or the dossier.assemble_dossier() dict
// once loaded.
// --- Timeline (Item 7) -------------------------------------------------
// Two kinds of entries, always rendered together in one list, oldest
// first: doc-derived events (application_confirmation/interview_notice,
// from dossier.timeline_events -- see dossier.py) followed by a single
// "Current status" line built from the item's effective_status and
// api.py's current_status_date/current_status_date_known. The status
// line always renders, even with zero doc-derived events, so a folder
// with no dated evidence still shows something (matching today's
// behavior) instead of an empty timeline widget -- see
// ITEM7_TIMELINE_FDD_DRAFT.md's "Suggested minimal UI".
const TIMELINE_EVENT_LABELS = {
  application_confirmation: "Applied",
  interview_notice: "Interview scheduled",
};

function capitalize(s){
  return s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
}

function TimelineSection({events, currentStatus, currentStatusDate, currentStatusDateKnown, docs, onView}){
  const color = DEFAULT_STATUS_COLORS[currentStatus] || DEFAULT_STATUS_COLORS.unknown;
  return (
    <div className="dossier-timeline">
      <div className="dossier-timeline-label">Timeline</div>
      {(events || []).map((e, i) => {
        const doc = (docs || []).find(d => d.relpath === e.relpath);
        const label = TIMELINE_EVENT_LABELS[e.doc_type] || e.doc_type;
        return (
          <div className="dossier-timeline-event" key={`${e.relpath}-${i}`}>
            <span className="dossier-timeline-dot"></span>
            <div className="dossier-timeline-body">
              <span className="dossier-timeline-label-text">{label}</span>
              {" \u2014 "}
              <span className="dossier-timeline-meta">detected from {e.doc_type === "interview_notice" ? "interview notice" : "application confirmation"}, {e.date}</span>
              {doc && <span className="dossier-timeline-doc"> ({doc.filename})</span>}
            </div>
            {doc && onView && <button className="btn small" onClick={() => onView(doc)}>View</button>}
          </div>
        );
      })}
      <div className="dossier-timeline-event dossier-timeline-current">
        <span className="dossier-timeline-dot" style={{background: color}}></span>
        <div className="dossier-timeline-body">
          <span className="dossier-timeline-label-text">Current status: {capitalize(currentStatus)}</span>
          {" \u2014 "}
          <span className="dossier-timeline-meta">
            {currentStatusDateKnown ? `since ${currentStatusDate}` : "date unknown (set before Timeline tracking began)"}
          </span>
        </div>
      </div>
    </div>
  );
}

function DossierSection({app, dossier, docs, onView, onUseDetectedDate, fireToast}){
  // Hooks must run on every render regardless of the early returns below
  // (React's Rules of Hooks) -- declared here, before any conditional
  // return, even though dateSuggestionDismissed is only meaningful once
  // `dossier` is loaded.
  const [dateSuggestionDismissed, setDateSuggestionDismissed] = useState(false);
  useEffect(() => { setDateSuggestionDismissed(false); }, [app.id]);

  if (dossier === undefined) {
    return <div className="card dossier-card"><div className="dossier-loading">Loading dossier\u2026</div></div>;
  }
  if (!dossier) return null;

  const jobPostingDoc = dossier.job_posting_relpath
    ? (docs || []).find(d => d.relpath === dossier.job_posting_relpath)
    : null;
  const hasMultipleCandidates = (dossier.job_posting_candidates || []).length > 1;
  const contacts = dossier.contacts || {emails:[], phones:[], urls:[]};
  const hasAnyContact = contacts.emails.length || contacts.phones.length || contacts.urls.length;

  // Checkpoint 5/6: date-applied evidence. The empty-field, confirmation-
  // tier case auto-fills silently on the server (api.py's
  // application_dossier) -- date_applied is already populated by the time
  // this component sees it, so nothing here needs to auto-fill anything.
  // What's left to render, split by state:
  //   - date_applied set, and it came from an accepted/auto-filled
  //     detection with nothing currently in conflict -> quiet caption,
  //     no buttons.
  //   - date_applied unset, only job-posting evidence found -> weak
  //     suggestion, single "Use this date" button, worded as a
  //     review prompt (posting text names when the role was *listed*,
  //     not when you applied).
  //   - date_applied set AND the newly detected date disagrees with it
  //     -> real conflict, both buttons, exactly as before -- a value
  //     already on record is never overwritten silently, regardless of
  //     which evidence tier is now in play.
  const currentDateApplied = app.date_applied ? app.date_applied.slice(0, 10) : null;
  const detectedDate = dossier.detected_date_applied || null;
  const evidenceTier = dossier.detected_date_evidence_tier || null;
  const detectedDateDoc = dossier.detected_date_source_relpath
    ? (docs || []).find(d => d.relpath === dossier.detected_date_source_relpath)
    : null;
  const detectedDateLabel = detectedDateDoc ? detectedDateDoc.filename : dossier.detected_date_source_relpath;

  const hasConflict = currentDateApplied && detectedDate && detectedDate !== currentDateApplied;
  const showConflict = hasConflict && !dateSuggestionDismissed;
  const showWeakSuggestion = !currentDateApplied && detectedDate && evidenceTier === "posting" && !dateSuggestionDismissed;
  const showProvenanceCaption = !showConflict && !showWeakSuggestion
    && currentDateApplied && app.date_applied_source === "confirmation";

  const useDetectedDate = async () => {
    await onUseDetectedDate(detectedDate, evidenceTier);
    setDateSuggestionDismissed(true);
    fireToast && fireToast(`Date applied set to ${detectedDate}.`);
  };

  return (
    <div className="card dossier-card">
      <div className="dossier-context-row">
        <div className="dossier-field">
          <div className="dossier-field-label">Company</div>
          <div className="dossier-field-value">{app.effective_company}</div>
        </div>
        <div className="dossier-field">
          <div className="dossier-field-label">Job title</div>
          <div className="dossier-field-value">{app.role_label && app.role_label !== "(root)" ? app.role_label : "\u2014"}</div>
        </div>
        <div className="dossier-field">
          <div className="dossier-field-label">Status</div>
          <div className="dossier-field-value">{app.effective_status}</div>
        </div>
        <div className="dossier-field">
          <div className="dossier-field-label">Date applied</div>
          <div className="dossier-field-value">{app.date_applied ? app.date_applied.slice(0,10) : "Not set"}</div>
          {showConflict && (
            <div className="dossier-date-suggestion">
              <span>Detected <strong>{detectedDate}</strong>{detectedDateLabel ? ` from ${detectedDateLabel}` : ""}.</span>
              <button className="btn small" onClick={useDetectedDate}>Use detected date</button>
              <button className="btn small" onClick={() => setDateSuggestionDismissed(true)}>Keep existing</button>
            </div>
          )}
          {showWeakSuggestion && (
            <div className="dossier-date-suggestion dossier-date-suggestion-weak">
              <span>Possibly <strong>{detectedDate}</strong>{detectedDateLabel ? ` from ${detectedDateLabel}` : ""} — this comes from the job posting text, not a confirmation, so review before using.</span>
              <button className="btn small" onClick={useDetectedDate}>Use this date</button>
            </div>
          )}
          {showProvenanceCaption && (
            <div className="dossier-date-provenance">Detected from application confirmation{detectedDateDoc ? ` (${detectedDateDoc.filename})` : ""}.</div>
          )}
        </div>
        <div className="dossier-field">
          <div className="dossier-field-label">Days since activity</div>
          <div className="dossier-field-value">{app.days_since_activity != null ? `${app.days_since_activity}d` : "\u2014"}</div>
        </div>
      </div>

      <TimelineSection
        events={dossier.timeline_events || []}
        currentStatus={dossier.current_status}
        currentStatusDate={dossier.current_status_date}
        currentStatusDateKnown={dossier.current_status_date_known}
        docs={docs}
        onView={onView}
      />

      {dossier.job_posting_relpath ? (
        <div className="dossier-note">
          <span>Role details below are extracted from <strong>{jobPostingDoc ? jobPostingDoc.filename : dossier.job_posting_relpath}</strong>{hasMultipleCandidates ? " (multiple job-posting documents found — this one was picked alphabetically)" : ""}.</span>
          {jobPostingDoc && onView && <button className="btn small" onClick={() => onView(jobPostingDoc)}>View</button>}
        </div>
      ) : (
        <div className="dossier-note">No document in this application's folder is marked as a job posting, so role details can't be extracted. Use "Fix type" on the right document to mark it, if you have one attached.</div>
      )}

      <div className="dossier-role-grid">
        {ROLE_SECTION_DEFS.map(({key, label}) => {
          const text = dossier[key];
          const detected = text && text !== NOT_DETECTED;
          return (
            <div className="dossier-role-block" key={key}>
              <div className="dossier-role-label">{label}</div>
              <div className={"dossier-role-text" + (detected ? "" : " not-detected")}>{detected ? text : NOT_DETECTED}</div>
            </div>
          );
        })}
      </div>

      <div className="dossier-contacts-label">Contacts</div>
      {hasAnyContact ? (
        <div className="dossier-contacts">
          <ContactGroup label="Emails" kind="email" values={contacts.emails} fireToast={fireToast} />
          <ContactGroup label="Phones" kind="phone" values={contacts.phones} fireToast={fireToast} />
          <ContactGroup label="Links" kind="url" values={contacts.urls} fireToast={fireToast} />
        </div>
      ) : <div className="dossier-empty">No emails, phone numbers, or links found across this application's documents.</div>}

      {dossier.extraction_errors && dossier.extraction_errors.length > 0 && (
        <div className="dossier-errors">
          Couldn't extract text from {dossier.extraction_errors.length === 1 ? "1 document" : `${dossier.extraction_errors.length} documents`}: {dossier.extraction_errors.map(e => e.relpath).join(", ")}. Those documents were skipped for contacts and role details above.
        </div>
      )}
    </div>
  );
}

/* =========================== PIPELINE: DETAIL PANE =========================== */
function DetailPane({app, meta, docs, dossier, onSaveOverride, onOpen, onView, onFixType, onUpload, onRename, onDelete, query, fireToast}){
  const [notes, setNotes] = useState("");
  const [dateApplied, setDateApplied] = useState("");
  const [nextAction, setNextAction] = useState("");
  const [nextActionDate, setNextActionDate] = useState("");
  const [manualStatus, setManualStatus] = useState("");
  const [archived, setArchived] = useState(false);
  const [dirty, setDirty] = useState(false);

  useEffect(() => {
    if (!app) return;
    setNotes(app.notes || "");
    setDateApplied(app.date_applied ? app.date_applied.slice(0,10) : "");
    setNextAction(app.next_action || "");
    setNextActionDate(app.next_action_date ? app.next_action_date.slice(0,10) : "");
    setManualStatus(app.manual_status || "");
    setArchived(!!app.archived);
    setDirty(false);
  }, [app && app.id]);

  if (!app) {
    return <div className="detail-pane"><EmptyState icon={"\u{1F4CB}"} title="Nothing selected"
      sub={<React.Fragment>Select an application from the list. Tip: <span className="kbd">j</span>/<span className="kbd">k</span> to move, <span className="kbd">Enter</span> to preview a document.</React.Fragment>} /></div>;
  }

  const statusOrder = meta.status_order || DEFAULT_STATUS_ORDER;

  const markField = (setter) => (v) => { setter(v); setDirty(true); };

  const save = async () => {
    await onSaveOverride(app.id, {
      manual_status: manualStatus || null,
      reset_status: !manualStatus,
      notes,
      date_applied: dateApplied || null,
      next_action: nextAction || null,
      next_action_date: nextActionDate || null,
      archived,
    });
    setDirty(false);
  };

  const quickFollowUp = async () => {
    const d = new Date(); d.setDate(d.getDate() + 7);
    const iso = d.toISOString().slice(0,10);
    setNextAction("Follow up"); setNextActionDate(iso); setDirty(true);
    await onSaveOverride(app.id, {next_action:"Follow up", next_action_date: iso});
  };

  const quickResetActivity = async () => {
    const iso = new Date().toISOString().slice(0,10);
    await onSaveOverride(app.id, {activity_override: iso});
  };

  // Checkpoint 5: "Use detected date" from the Dossier's date-applied
  // evidence suggestion. Updates the same local dateApplied state the
  // form input below reads, so the two stay in sync -- same pattern as
  // quickFollowUp/quickResetActivity above, just for date_applied.
  const useDetectedDate = async (iso, source) => {
    setDateApplied(iso); setDirty(false);
    // `source` tags provenance ("confirmation"/"posting") so the Dossier
    // can show a quiet "Detected from ..." caption instead of re-asking --
    // see overrides_store.py's date_applied_source column.
    await onSaveOverride(app.id, {date_applied: iso, date_applied_source: source || null});
  };

  return (
    <div className="detail-pane">
      <div className="detail-header">
        <div className="detail-eyebrow"><Highlight text={app.effective_company} query={query} /></div>
        <h2 className="detail-title">{app.role_label && app.role_label !== "(root)" ? <Highlight text={app.role_label} query={query} /> : app.effective_company}</h2>
        <div className="detail-meta">
          {app.item_key.split("|").pop()} {app.date_applied ? `\u2022 Applied ${app.date_applied.slice(0,10)}` : ""} {app.activity_override ? `\u2022 Activity reset ${app.activity_override.slice(0,10)}` : ""}
        </div>
        <div className="detail-actions">
          <select className="btn" value={manualStatus} onChange={e => { setManualStatus(e.target.value); setDirty(true); }}>
            <option value="">(auto — {app.status})</option>
            {statusOrder.map(s => <option key={s} value={s}>{s[0].toUpperCase()+s.slice(1)}</option>)}
          </select>
          <button className="btn primary" onClick={quickFollowUp}>{"Follow Up \u{1F4C5} (+7d)"}</button>
          <button className="btn" title="Keeps date applied as-is — just resets the days-quiet countdown to 0."
            onClick={quickResetActivity}>{"Reset Activity Clock \u{1F503}"}</button>
          {dirty && <button className="btn" onClick={save}>Save changes</button>}
        </div>
      </div>

      <div className="section-label">Application Dossier</div>
      <DossierSection app={app} dossier={dossier} docs={docs} onView={onView} onUseDetectedDate={useDetectedDate} fireToast={fireToast} />

      <div className="section-label">Attached Documents ({docs.length})</div>
      {onUpload && <UploadDropzone itemId={app.id} onUpload={onUpload} />}
      <DocGrid docs={docs} docTypeLabels={meta.doc_type_labels} onOpen={onOpen} onView={onView} query={query} onFixType={onFixType} onRename={onRename} onDelete={onDelete} />

      <div className="section-label">Notes &amp; Status</div>
      <div className="card notes-card">
        <div className="form-grid">
          <div className="field span2">
            <label>Notes</label>
            <textarea value={notes} onChange={e => markField(setNotes)(e.target.value)} placeholder="e.g. waiting on referral from Jess" />
          </div>
          <div className="field">
            <label>Date applied</label>
            <input type="date" value={dateApplied} onChange={e => markField(setDateApplied)(e.target.value)} />
          </div>
          <div className="field">
            <label>Next action date</label>
            <input type="date" value={nextActionDate} onChange={e => markField(setNextActionDate)(e.target.value)} />
          </div>
          <div className="field span2">
            <label>Next action</label>
            <input type="text" value={nextAction} onChange={e => markField(setNextAction)(e.target.value)} placeholder="e.g. Follow up by email" />
          </div>
        </div>
        <div className="checkbox-row">
          <input type="checkbox" checked={archived} onChange={e => { setArchived(e.target.checked); setDirty(true); }} id="arch-cb" />
          <label htmlFor="arch-cb">Archive (hide from Needs Attention)</label>
        </div>
        {dirty && <div style={{marginTop:14}}><button className="btn primary" onClick={save}>Save</button></div>}
      </div>
    </div>
  );
}

/* =========================== PIPELINE: LIST (MASTER) =========================== */
function MasterList({apps, selectedKey, onSelect, meta, query}){
  return (
    <div className="master-list">
      {apps.length === 0 && <EmptyState icon={"\u{1F50D}"} title="No matches" sub="No applications match the current filters." />}
      {apps.map(app => (
        <div key={app.id} className={"master-item" + (app.id===selectedKey ? " selected":"")} onClick={() => onSelect(app)}>
          <div className="master-item-top">
            <div>
              <div className="master-item-title"><Highlight text={app.effective_company} query={query} /></div>
              <div className="master-item-role">{app.role_label !== "(root)" ? <Highlight text={app.role_label} query={query} /> : "—"}</div>
            </div>
            <StatusBadge status={app.effective_status} manual={!!app.manual_status} colors={meta.status_colors} icons={meta.status_icons} />
          </div>
          <div className="master-item-meta">
            {app.days_since_activity != null ? `${app.days_since_activity}d since ${app.date_is_manual ? "date applied" : "last file activity"}` : "no date on file"}
            {app.is_stale ? <span className="stale-tag"> {"\u2022"} needs attention</span> : null}
          </div>
        </div>
      ))}
    </div>
  );
}

/* =========================== PIPELINE: KANBAN (native drag & drop, optimistic) =========================== */
function KanbanBoard({apps, meta, onMove, pendingIds}){
  const statusOrder = meta.status_order || DEFAULT_STATUS_ORDER;
  const [dragId, setDragId] = useState(null);
  const [overCol, setOverCol] = useState(null);

  const handleDrop = (status) => (e) => {
    e.preventDefault();
    setOverCol(null);
    const raw = e.dataTransfer.getData("text/plain") || dragId;
    const id = Number(raw);
    const app = apps.find(a => a.id === id);
    if (app && app.effective_status !== status) onMove(app, status);
    setDragId(null);
  };

  return (
    <div className="kanban">
      {statusOrder.map(status => {
        const inStatus = apps.filter(a => a.effective_status === status);
        const color = (meta.status_colors && meta.status_colors[status]) || DEFAULT_STATUS_COLORS[status];
        return (
          <div className={"kanban-col" + (overCol === status ? " drag-over" : "")} key={status}
            onDragOver={e => { e.preventDefault(); setOverCol(status); }}
            onDragLeave={() => setOverCol(c => c === status ? null : c)}
            onDrop={handleDrop(status)}>
            <div className="kanban-col-head" style={{borderColor:color+"66", color}}>
              {status === "interviewing" && <span className="status-pulse" style={{color}} />}
              {status[0].toUpperCase()+status.slice(1)} &middot; {inStatus.length}
            </div>
            <div className="kanban-cards">
              {inStatus.map(app => (
                <div
                  className={"kanban-card" + (app.is_stale ? " stale":"") + (dragId===app.id ? " dragging":"") + (pendingIds && pendingIds.has(app.id) ? " optimistic":"")}
                  key={app.id}
                  draggable
                  onDragStart={e => { e.dataTransfer.setData("text/plain", String(app.id)); e.dataTransfer.effectAllowed = "move"; setDragId(app.id); }}
                  onDragEnd={() => { setDragId(null); setOverCol(null); }}
                >
                  <div className="kanban-card-title">{app.effective_company}</div>
                  <div className="kanban-card-role">{app.role_label !== "(root)" ? app.role_label : "—"}{app.is_stale ? " \u26A0" : ""}</div>
                  <div className="kanban-card-foot">
                    <span className="kanban-card-meta">{app.days_since_activity != null ? `${app.days_since_activity}d` : "?"}</span>
                  </div>
                  <select className="kanban-move" value={status} onChange={e => onMove(app, e.target.value)}>
                    {statusOrder.map(s => <option key={s} value={s}>Move to {s}</option>)}
                  </select>
                </div>
              ))}
              {inStatus.length===0 && <div className="kanban-empty-col">Drop a card here.</div>}
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* =========================== PIPELINE PAGE =========================== */
function PipelinePage({apps, meta, docsByItemId, ensureDocs, dossierByItemId, ensureDossier, onSaveOverride, onMoveStatus, pendingIds, onOpen, onView, onFixType, onUpload, onRename, onDelete, searchQuery, selectedKey, setSelectedKey, active, fireToast}){
  const statusOrder = meta.status_order || DEFAULT_STATUS_ORDER;
  const [view, setView] = useState("list");
  const [statusFilter, setStatusFilter] = useState(new Set(statusOrder));
  const [showArchived, setShowArchived] = useState(false);
  const [sortBy, setSortBy] = useState("company");

  const q = (searchQuery || "").trim().toLowerCase();
  const sorters = {
    // Most days-quiet first — the default "what needs my attention" order.
    days_quiet: (a,b) => (b.days_since_activity ?? -1) - (a.days_since_activity ?? -1),
    // Same alphabetical rule Browse uses, so switching views reads the same.
    company: (a,b) => (a.effective_company||"").localeCompare(b.effective_company||"") || (a.role_label||"").localeCompare(b.role_label||""),
    // Soonest-due next action first; items with no next action sort last.
    next_action: (a,b) => {
      if (!a.next_action_date && !b.next_action_date) return 0;
      if (!a.next_action_date) return 1;
      if (!b.next_action_date) return -1;
      return a.next_action_date.localeCompare(b.next_action_date);
    },
    // Newest date_applied first; never-applied items sort last.
    recent_applied: (a,b) => {
      if (!a.date_applied && !b.date_applied) return 0;
      if (!a.date_applied) return 1;
      if (!b.date_applied) return -1;
      return b.date_applied.localeCompare(a.date_applied);
    },
    // Grouped by pipeline stage, in the same order as the status chips/stat strip.
    status: (a,b) => statusOrder.indexOf(a.effective_status) - statusOrder.indexOf(b.effective_status)
      || (b.days_since_activity ?? -1) - (a.days_since_activity ?? -1),
  };

  const filtered = useMemo(() => apps.filter(a => {
    if (!statusFilter.has(a.effective_status)) return false;
    if (!showArchived && a.archived) return false;
    if (q) {
      const hay = (a.effective_company + " " + a.role_label).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort(sorters[sortBy] || sorters.days_quiet), [apps, statusFilter, showArchived, q, sortBy]);

  const selected = filtered.find(a => a.id === selectedKey) || filtered[0] || null;

  // Also re-runs when the selected app's cached dossier flips to undefined
  // (invalidateDossier evicts it on upload/rename/delete/fix-type) -- not
  // just when selected.id itself changes. Without this, invalidating the
  // dossier for the app that's ALREADY selected left it stuck on "Loading
  // dossier..." forever, since nothing else would call ensureDossier again
  // for the same id. ensureDocs/ensureDossier are both no-ops once cached,
  // so the extra dependency doesn't cause repeat fetches once resolved.
  useEffect(() => {
    if (selected) { ensureDocs(selected.id); ensureDossier(selected.id); }
  }, [selected && selected.id, selected && dossierByItemId[selected.id]]);

  const selectApp = useCallback((a) => setSelectedKey(a.id), [setSelectedKey]);
  const openFirstDoc = useCallback((a) => {
    const docs = docsByItemId[a.id] || [];
    const pdf = docs.find(isPdf);
    if (pdf) onView(pdf);
  }, [docsByItemId, onView]);
  useListNav({enabled: active && view === "list", items: filtered, selectedKey: selected && selected.id, onSelect: selectApp, onEnter: openFirstDoc});

  const activeApps = apps.filter(a => !a.archived);
  const byStatus = {};
  statusOrder.forEach(s => byStatus[s] = 0);
  activeApps.forEach(a => byStatus[a.effective_status] = (byStatus[a.effective_status]||0)+1);

  const toggleStatus = (s) => {
    const next = new Set(statusFilter);
    if (next.has(s)) next.delete(s); else next.add(s);
    setStatusFilter(next);
  };

  return (
    <div style={{display:"flex", flexDirection:"column", height:"100%"}}>
      <h1 className="page-title">Pipeline</h1>
      <p className="page-sub">{filtered.length} of {apps.length} applications shown</p>

      <div className="stat-strip">
        {statusOrder.map(s => (
          <div className="stat-pill" key={s}>
            <div className="num">{byStatus[s]||0}</div>
            <div className="lbl">{s}</div>
          </div>
        ))}
      </div>

      <div style={{display:"flex", gap:10, alignItems:"center", marginBottom:16, flexWrap:"wrap"}}>
        <div style={{display:"flex", background:"var(--panel)", border:"1px solid var(--border)", borderRadius:8, overflow:"hidden"}}>
          <button className="btn subtle" style={{border:"none", borderRadius:0, background: view==="list" ? "var(--border)":"transparent"}} onClick={() => setView("list")}>List</button>
          <button className="btn subtle" style={{border:"none", borderRadius:0, background: view==="kanban" ? "var(--border)":"transparent"}} onClick={() => setView("kanban")}>Kanban (drag cards to move)</button>
        </div>
        {statusOrder.map(s => (
          <span key={s} className={"chip" + (statusFilter.has(s) ? " on":"")} onClick={() => toggleStatus(s)}>{s}</span>
        ))}
        <label style={{display:"flex", alignItems:"center", gap:6, color:"var(--text-soft)", fontSize:12}}>
          Sort by
          <select className="btn subtle" style={{padding:"4px 8px"}} value={sortBy} onChange={e => setSortBy(e.target.value)}>
            <option value="days_quiet">Days quiet</option>
            <option value="company">Company A–Z</option>
            <option value="next_action">Next action date</option>
            <option value="recent_applied">Recently applied</option>
            <option value="status">Status</option>
          </select>
        </label>
        <label style={{display:"flex", alignItems:"center", gap:6, color:"var(--text-soft)", fontSize:12}}>
          <input type="checkbox" checked={showArchived} onChange={e => setShowArchived(e.target.checked)} /> Show archived
        </label>
      </div>

      <div style={{flex:1, minHeight:0}}>
        {view === "list" ? (
          filtered.length === 0 ? (
            <EmptyState icon={"\u{1F4ED}"} title="Nothing here" sub="Try a different status filter, or clear the search box." />
          ) : (
            <div className="pipeline-split">
              <div className="master-pane">
                <MasterList apps={filtered} selectedKey={selected && selected.id} onSelect={selectApp} meta={meta} query={searchQuery} />
              </div>
              <DetailPane app={selected} meta={meta} docs={selected ? (docsByItemId[selected.id] || []) : []}
                dossier={selected ? dossierByItemId[selected.id] : null}
                onSaveOverride={onSaveOverride} onOpen={onOpen} onView={onView} onFixType={onFixType} onUpload={onUpload} onRename={onRename} onDelete={onDelete} query={searchQuery} fireToast={fireToast} />
            </div>
          )
        ) : (
          <KanbanBoard apps={filtered} meta={meta} onMove={onMoveStatus} pendingIds={pendingIds} />
        )}
      </div>
    </div>
  );
}

/* =========================== ATTENTION PAGE (with batch operations) =========================== */
function AttentionPage({apps, meta, docsByItemId, ensureDocs, onSaveOverride, onBulkOverride, onOpen, onView, active}){
  const attn = useMemo(() => apps.filter(a => !a.archived && !a.is_snoozed && (a.is_stale || a.next_action_due))
    .sort((a,b) => (b.next_action_due?1:0)-(a.next_action_due?1:0) || (b.days_since_activity||0)-(a.days_since_activity||0)), [apps]);

  const [selected, setSelected] = useState(() => new Set());
  const [focusedKey, setFocusedKey] = useState(null);
  const [busy, setBusy] = useState(false);

  const toggleOne = (id) => setSelected(prev => {
    const next = new Set(prev);
    if (next.has(id)) next.delete(id); else next.add(id);
    return next;
  });
  const toggleAll = () => setSelected(prev => prev.size === attn.length ? new Set() : new Set(attn.map(a => a.id)));

  const selectFocus = useCallback((a) => setFocusedKey(a.id), []);
  const openFirstDoc = useCallback((a) => {
    ensureDocs(a.id);
    const docs = docsByItemId[a.id] || [];
    const pdf = docs.find(isPdf);
    if (pdf) onView(pdf);
  }, [docsByItemId, ensureDocs, onView]);
  useListNav({enabled: active, items: attn, selectedKey: focusedKey, onSelect: selectFocus, onEnter: openFirstDoc});

  const runBulk = async (fields) => {
    setBusy(true);
    try { await onBulkOverride(Array.from(selected), fields); setSelected(new Set()); }
    finally { setBusy(false); }
  };

  if (attn.length === 0) {
    return (
      <div>
        <h1 className="page-title">Needs Attention</h1>
        <p className="page-sub">Applications sitting quietly for a while, plus anything with a next action due.</p>
        <div className="success-banner">{"Nothing needs attention right now. \u{1F389}"}</div>
      </div>
    );
  }

  return (
    <div>
      <h1 className="page-title">Needs Attention</h1>
      <p className="page-sub">21+ days since applied/interviewing, or 14+ days untouched while drafted/unknown, plus due next actions. Nothing is ever deleted — dismiss with Archive if it doesn't need action. (<span className="kbd">j</span>/<span className="kbd">k</span> to move focus, <span className="kbd">Enter</span> to preview a document.)</p>
      <p className="page-sub">{attn.length} item(s)</p>

      {selected.size > 0 && (
        <div className="bulk-bar">
          <span className="count">{selected.size} selected</span>
          <button className="btn primary small" disabled={busy} onClick={() => runBulk({manual_status:"applied"})}>Bulk Move to Applied</button>
          <button className="btn small" disabled={busy} onClick={() => runBulk({manual_status:"rejected"})}>Bulk Mark Rejected</button>
          <button className="btn danger-outline small" disabled={busy} onClick={() => runBulk({archived:true})}>Bulk Archive</button>
          <button className="btn subtle small" onClick={() => setSelected(new Set())}>Clear</button>
        </div>
      )}

      <label style={{display:"flex", alignItems:"center", gap:8, color:"var(--text-soft)", fontSize:12, margin:"0 0 10px"}}>
        <input type="checkbox" className="select-checkbox" checked={selected.size === attn.length} onChange={toggleAll} /> Select all
      </label>

      {attn.map(app => {
        const reasons = [];
        if (app.next_action_due) reasons.push(`next action due: ${app.next_action}`);
        if (app.is_stale) reasons.push(`${app.days_since_activity} days quiet${app.activity_is_reset ? " (since reset)" : ""}`);
        return (
          <div className={"list-card" + (focusedKey===app.id ? " focused":"")} key={app.id} onClick={() => setFocusedKey(app.id)}>
            <input type="checkbox" className="select-checkbox" checked={selected.has(app.id)}
              onChange={() => toggleOne(app.id)} onClick={e => e.stopPropagation()} />
            <div className="list-card-body">
              <div className="list-card-top">
                <div className="list-card-title">{app.effective_company}{roleSuffix(app)}</div>
                <div style={{textAlign:"right"}}>
                  <StatusBadge status={app.effective_status} manual={!!app.manual_status} colors={meta.status_colors} icons={meta.status_icons} />
                  <div className="stale-tag" style={{marginTop:4}}>{reasons.join(" \u00b7 ")}</div>
                </div>
              </div>
              <details className="doc-expander" onToggle={() => ensureDocs(app.id)}>
                <summary>Documents</summary>
                <div style={{marginTop:10}}>
                  <DocGrid docs={docsByItemId[app.id] || []} docTypeLabels={meta.doc_type_labels} onOpen={onOpen} onView={onView} />
                </div>
              </details>
              <div className="list-card-actions">
                <button className="btn" onClick={() => onSaveOverride(app.id, {next_action:null, next_action_date:null})}>Mark followed up</button>
                <button className="btn" title="Keeps date applied as-is — just resets the days-quiet countdown to 0 (e.g. after an interview or a call)."
                  onClick={() => onSaveOverride(app.id, {activity_override: new Date().toISOString().slice(0,10)})}>Reset activity clock</button>
                <button className="btn" onClick={() => {
                  const d = new Date(); d.setDate(d.getDate()+7);
                  onSaveOverride(app.id, {snoozed_until:d.toISOString().slice(0,10)});
                }}>Snooze 7 days</button>
                <button className="btn danger-outline" onClick={() => onSaveOverride(app.id, {archived:true})}>Archive</button>
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* =========================== BROWSE PAGE =========================== */
function BrowsePage({searchQuery, showPersonal, meta, onOpen, onView, onFixType, onUpload, onRename, onDelete, docsVersion}){
  const [data, setData] = useState(null);
  const [activeTab, setActiveTab] = useState(null);
  const [err, setErr] = useState(null);
  const [showArchived, setShowArchived] = useState(false);

  useEffect(() => {
    apiGet(`/api/browse?show_personal=${showPersonal}&show_archived=${showArchived}&q=${encodeURIComponent(searchQuery||"")}`)
      .then(d => { setData(d); if (!activeTab) setActiveTab(Object.keys(d)[0]); })
      .catch(e => setErr(String(e.message||e)));
  }, [searchQuery, showPersonal, showArchived, docsVersion]);

  if (err) return <EmptyState icon={"\u26A0\uFE0F"} title="Couldn't load Browse" sub={err} />;
  if (!data) return <EmptyState icon={"\u23F3"} title="Loading…" />;

  const sections = Object.keys(data);
  const items = data[activeTab] || [];

  return (
    <div>
      <h1 className="page-title">Browse by Section</h1>
      {searchQuery && <p className="page-sub">Filtered to items matching "{searchQuery}"</p>}
      <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:8, marginBottom:4}}>
        <div className="tabs">
          {sections.map(s => (
            <button key={s} className={"tab-btn" + (activeTab===s?" active":"")} onClick={() => setActiveTab(s)}>
              {(meta.section_labels && meta.section_labels[s]) || DEFAULT_SECTION_LABELS[s] || prettifySection(s)}
            </button>
          ))}
        </div>
        <label style={{display:"flex", alignItems:"center", gap:6, color:"var(--text-soft)", fontSize:12}}>
          <input type="checkbox" checked={showArchived} onChange={e => setShowArchived(e.target.checked)} /> Show archived
        </label>
      </div>
      {items.length === 0 && <EmptyState icon={"\u{1F4ED}"} title="No matches" sub="No matches in this section." />}
      {items.map(it => (
        <details className="doc-expander" key={it.id} style={{marginBottom:8, background:"var(--panel)", border:"1px solid var(--border)", borderRadius:8, padding:"8px 12px"}}>
          <summary style={{color:"var(--text)", fontWeight:600, fontSize:13}}>
            <Highlight text={it.label} query={searchQuery} />
            {it.archived && <span className="badge" style={{marginLeft:8, background:"var(--border)", color:"var(--text-soft)", border:"none"}}>archived</span>}
          </summary>
          <div style={{marginTop:12}}>
            {onUpload && <UploadDropzone itemId={it.id} onUpload={onUpload} compact />}
            <DocGrid docs={it.documents} docTypeLabels={meta.doc_type_labels} onOpen={onOpen} onView={onView} query={searchQuery} onFixType={onFixType} onRename={onRename} onDelete={onDelete} />
          </div>
        </details>
      ))}
    </div>
  );
}

/* =========================== SEARCH RESULTS (when typing in top search on non-pipeline pages) ============ */
function SearchPage({searchQuery, showPersonal, meta, onOpen, onView}){
  const {showSource} = useContext(ShowSourceContext);
  const [rows, setRows] = useState(null);
  const [err, setErr] = useState(null);

  useEffect(() => {
    if (!searchQuery) { setRows([]); return; }
    apiGet(`/api/search?q=${encodeURIComponent(searchQuery)}&show_personal=${showPersonal}`).then(setRows).catch(e => setErr(String(e.message||e)));
  }, [searchQuery, showPersonal]);

  const visibleRows = (rows || []).filter(r => showSource || !r.is_source);
  const hiddenCount = (rows ? rows.length : 0) - visibleRows.length;

  return (
    <div>
      <h1 className="page-title">Search &amp; Retrieval</h1>
      <p className="page-sub">Search across every indexed document — resumes, cover letters, prep notes, everything.</p>
      {!searchQuery && <EmptyState icon={"\u{1F50D}"} title="Start typing" sub="Type in the search box above to get started." />}
      {err && <EmptyState icon={"\u26A0\uFE0F"} title="Search error" sub={err} />}
      {rows && searchQuery && <p className="page-sub">{visibleRows.length} result(s){hiddenCount ? ` (${hiddenCount} source file(s) hidden — toggle "Show source files")` : ""}</p>}
      {rows && searchQuery && visibleRows.length === 0 && !err && (
        <EmptyState icon={"\u{1F4ED}"} title="No results" sub={`Nothing matched "${searchQuery}". Try a shorter or different term.`} />
      )}
      {visibleRows.map(r => (
        <div className="list-card" key={r.id}>
          <div className="list-card-body">
            <div className="list-card-top">
              <div>
                <div className="list-card-title"><Highlight text={r.company} query={searchQuery} /> {r.role_label !== "(root)" ? <React.Fragment>— <Highlight text={r.role_label} query={searchQuery} /></React.Fragment> : ""}</div>
                <div style={{fontSize:12, color:"var(--text-soft)", marginTop:4}}>
                  <span className="doc-type" style={{background:"var(--bg)", padding:"1px 6px", borderRadius:4, border:"1px solid var(--border)"}}>{docEffectiveType(r)}</span> &nbsp;<Highlight text={r.filename} query={searchQuery} />
                  {r.duplicate_count > 0 && <span style={{color:"#F59E0B", marginLeft:6}}>{"\u29C9"} also used in {r.duplicate_count} other place{r.duplicate_count > 1 ? "s" : ""}</span>}
                </div>
                <div style={{fontSize:11, color:"var(--text-mute)", marginTop:4}}>{(meta.section_labels && meta.section_labels[r.section]) || DEFAULT_SECTION_LABELS[r.section] || prettifySection(r.section)}</div>
              </div>
              <div style={{display:"flex", gap:6}}>
                {isInlineViewable(r) && <button className="btn" onClick={() => onView(r)}>View</button>}
                <button className="btn" onClick={() => onOpen(r.relpath)}>Open</button>
              </div>
            </div>
          </div>
        </div>
      ))}
    </div>
  );
}

function buildAiPrompt(role, location){
  const r = (role || "").trim() || "[Role]";
  const loc = (location || "").trim() || "[Your City, State]";
  return `I am searching for ${r} jobs in ${loc}. Analyze my target skills and generate a list of relevant job titles, active search strategies, and tailored bullet points for my resume.`;
}

// A saved override for a built-in card is either the legacy shape (a bare
// URL string, from before renaming existed) or {title, url} — both are
// normalized here so old localStorage data keeps working untouched.
function normalizeOverride(raw){
  if (!raw) return null;
  if (typeof raw === "string") return raw ? {url: raw} : null;
  const title = (raw.title || "").trim();
  const url = (raw.url || "").trim();
  if (!title && !url) return null;
  return {title: title || undefined, url: url || undefined};
}

function HubLinkCard({link, accent, override, onSaveOverride, location}){
  const [editing, setEditing] = useState(false);
  const ov = normalizeOverride(override);
  const [titleDraft, setTitleDraft] = useState(ov?.title || "");
  const [urlDraft, setUrlDraft] = useState(ov?.url || "");
  const effectiveTitle = ov?.title || link.name;
  const effectiveUrl = ov?.url || link.url;

  const searchUrl = () => {
    const term = link.searchQuery || `${effectiveTitle} jobs`;
    const q = encodeURIComponent(`${term}${location ? " " + location : ""}`);
    return `https://www.google.com/search?q=${q}`;
  };

  const startEdit = () => {
    setTitleDraft(ov?.title || "");
    setUrlDraft(ov?.url || "");
    setEditing(true);
  };

  const save = () => {
    onSaveOverride(link.name, {title: titleDraft.trim(), url: urlDraft.trim()});
    setEditing(false);
  };

  return (
    <div className="hub-card">
      <div className="hub-card-top">
        <span className="hub-tag" style={{background:accent+"22", color:accent, border:`1px solid ${accent}55`}}>{link.tag}</span>
        <div style={{display:"flex", gap:2}}>
          {ov && (
            <button className="hub-card-edit" title="Reset to default" onClick={() => onSaveOverride(link.name, null)}>
              {"\u21BA"}
            </button>
          )}
          <button className="hub-card-edit" title={editing ? "Cancel" : "Edit this card"}
            onClick={() => editing ? setEditing(false) : startEdit()}>
            {editing ? "\u2715" : "\u270E"}
          </button>
        </div>
      </div>

      {editing ? (
        <div className="hub-card-edit-col">
          <input className="hub-card-edit-input" type="text" placeholder={link.name} value={titleDraft}
            onChange={e => setTitleDraft(e.target.value)}
            onKeyDown={e => { if (e.key === "Escape") setEditing(false); }} autoFocus />
          <input className="hub-card-edit-input" type="text" placeholder="https://..." value={urlDraft}
            onChange={e => setUrlDraft(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter") save(); if (e.key === "Escape") setEditing(false); }} />
          <div className="hub-card-edit-actions">
            <button className="btn small" onClick={save}>Save</button>
          </div>
        </div>
      ) : (
        <React.Fragment>
          <div className="hub-card-name">{effectiveTitle}</div>
          <div className="hub-card-desc">{link.desc}</div>
          {effectiveUrl ? (
            <button className="btn small hub-open" onClick={() => openExternalUrl(effectiveUrl)}>
              Open {"\u2197"}
            </button>
          ) : (
            <button className="btn small hub-open" title="No link saved yet — this searches for it instead"
              onClick={() => openExternalUrl(searchUrl())}>
              Search {"\u2197"}
            </button>
          )}
        </React.Fragment>
      )}
    </div>
  );
}

// A fully user-created card — no shipped default, so there's nothing to
// "reset" to; it's delete instead. Kept visually identical to HubLinkCard.
function CustomHubCard({card, accent, onSave, onDelete}){
  const [editing, setEditing] = useState(!card.url && !card.title);
  const [titleDraft, setTitleDraft] = useState(card.title || "");
  const [urlDraft, setUrlDraft] = useState(card.url || "");
  const [noteDraft, setNoteDraft] = useState(card.note || "");

  const save = () => {
    if (!titleDraft.trim()) return;
    onSave({...card, title: titleDraft.trim(), url: urlDraft.trim(), note: noteDraft.trim()});
    setEditing(false);
  };

  return (
    <div className="hub-card">
      <div className="hub-card-top">
        <span className="hub-tag" style={{background:accent+"22", color:accent, border:`1px solid ${accent}55`}}>Custom</span>

            {"\u{1F5D1}"}
          </button>
          {!editing && (
            <button className="hub-card-edit" title="Edit this card" onClick={() => {
              setTitleDraft(card.title || ""); setUrlDraft(card.url || ""); setNoteDraft(card.note || ""); setEditing(true);
            }}>{"\u270E"}</button>
          )}

        <div className="hub-card-edit-col">
          <input className="hub-card-edit-input" type="text" placeholder="Card title" value={titleDraft}
            onChange={e => setTitleDraft(e.target.value)} autoFocus />
          <input className="hub-card-edit-input" type="text" placeholder="https://..." value={urlDraft}
            onChange={e => setUrlDraft(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter") save(); }} />
          <input className="hub-card-edit-input" type="text" placeholder="Note (optional)" value={noteDraft}
            onChange={e => setNoteDraft(e.target.value)} />

function SearchHubPage(){
  // Role/location/custom links/custom cards used to live only in
  // localStorage (device-local, browser-profile-only). They're now
  // persisted server-side in overrides.db (see /api/hub/settings and
  // overrides_store.get_hub_settings/set_hub_settings) so they travel
  // with the tracker like notes and statuses do. Starts loading=true so
  // the prompt bar and cards don't flash empty defaults before the
  // fetch resolves.
  const [loading, setLoading] = useState(true);
  const [loadErr, setLoadErr] = useState(null);
  const [role, setRole] = useState("");
  const [location, setLocation] = useState("");
  const [customLinks, setCustomLinks] = useState({});
  // Net-new cards the user has added, keyed by category id — separate from
  // customLinks (which only overrides built-in cards) since these have no
  // shipped default to fall back to.
  const [customCards, setCustomCards] = useState({});
  const [copied, setCopied] = useState(false);
  const [cardUndo, setCardUndo] = useState(null); // {catId, card} — the just-deleted custom card, undoable for a few seconds
  const cardUndoTimer = useRef(null);
  // Categories with more than this many cards collapse to a "+N more" tile
  // instead of growing the grid indefinitely. Not persisted — just a
  // per-visit display state, since it's purely about scanability, not data.
  const HUB_VISIBLE_LIMIT = 8;
  const [expandedCats, setExpandedCats] = useState({});

  useEffect(() => {
    let cancelled = false;
    apiGet("/api/hub/settings").then(s => {
      if (cancelled) return;
      setRole(s.role || "");
      setLocation(s.location || "");
      setCustomLinks(s.custom_links || {});
      setCustomCards(s.custom_cards || {});
      setLoading(false);
    }).catch(e => {
      if (cancelled) return;
      setLoadErr(String(e.message || e));
      setLoading(false);
    });
    return () => { cancelled = true; };
  }, []);

  // Role/location are free text, so saving on every keystroke would
  // hammer the API — debounce, same shape as the other 500ms-ish
  // debounces already in this file (search for setTimeout above).
  const roleSaveTimer = useRef(null);
  const locationSaveTimer = useRef(null);

  const saveRole = (v) => {
    setRole(v);
    if (roleSaveTimer.current) clearTimeout(roleSaveTimer.current);
    roleSaveTimer.current = setTimeout(() => {
      apiPost("/api/hub/settings", {role: v}).catch(() => { /* best-effort */ });
    }, 500);
  };

  const saveLocation = (v) => {
    setLocation(v);
    if (locationSaveTimer.current) clearTimeout(locationSaveTimer.current);
    locationSaveTimer.current = setTimeout(() => {
      apiPost("/api/hub/settings", {location: v}).catch(() => { /* best-effort */ });
    }, 500);
  };

  const saveOverride = (name, override) => {
    setCustomLinks(prev => {
      const next = {...prev};
      const norm = normalizeOverride(override);
      if (norm) next[name] = norm; else delete next[name];
      apiPost("/api/hub/settings", {custom_links: next}).catch(() => { /* best-effort */ });
      return next;
    });
  };

  const resetAllLinks = () => {
    if (!window.confirm("Reset all Search Hub links back to the shipped defaults? This only affects edits to built-in cards — your own added cards and tracker data are untouched.")) return;
    setCustomLinks({});
    apiPost("/api/hub/settings", {custom_links: {}}).catch(() => { /* best-effort */ });
  };

  const addCustomCard = (catId, card) => {
    setCustomCards(prev => {
      const next = {...prev, [catId]: [...(prev[catId] || []), {...card, id: `c_${Date.now()}_${Math.random().toString(36).slice(2,7)}`}]};
      apiPost("/api/hub/settings", {custom_cards: next}).catch(() => { /* best-effort */ });
      return next;
    });
  };

  const saveCustomCard = (catId, updated) => {
    setCustomCards(prev => {
      const next = {...prev, [catId]: (prev[catId] || []).map(c => c.id === updated.id ? updated : c)};
      apiPost("/api/hub/settings", {custom_cards: next}).catch(() => { /* best-effort */ });
      return next;
    });
  };

  const deleteCustomCard = (catId, id) => {
    setCustomCards(prev => {
      const next = {...prev, [catId]: (prev[catId] || []).filter(c => c.id !== id)};
      apiPost("/api/hub/settings", {custom_cards: next}).catch(() => { /* best-effort */ });
      return next;
    });
  };

  // Delete removes the card right away (it's just a title/URL — cheap to
  // redo by hand), but offers a few seconds of Undo instead of a blocking
  // confirm() dialog, same as document delete elsewhere in this app.
  const requestDeleteCustomCard = (catId, card) => {
    deleteCustomCard(catId, card.id);
    setCardUndo({catId, card});
    if (cardUndoTimer.current) clearTimeout(cardUndoTimer.current);
    cardUndoTimer.current = setTimeout(() => setCardUndo(null), 6000);
  };

  const undoDeleteCustomCard = () => {
    if (!cardUndo) return;
    const {catId, card} = cardUndo;
    setCustomCards(prev => {
      const next = {...prev, [catId]: [...(prev[catId] || []), card]};
      apiPost("/api/hub/settings", {custom_cards: next}).catch(() => { /* best-effort */ });
      return next;
    });
    if (cardUndoTimer.current) clearTimeout(cardUndoTimer.current);
    setCardUndo(null);
  };

  const copyPrompt = async () => {
    const text = buildAiPrompt(role, location);
    try {
      await navigator.clipboard.writeText(text);
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    } catch (e) {
      // Clipboard API can be unavailable (older browser, non-HTTPS-like
      // context) — fall back to a manual copy via prompt() rather than
      // silently doing nothing.
      window.prompt("Copy this prompt:", text);
    }
  };

  return (
    <div>
      <h1 className="page-title">Search Hub</h1>
      {loadErr && <div className="warning-banner">Couldn't load your Search Hub settings: {loadErr}</div>}
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:12}}>
        <p className="page-sub" style={{flex:1}}>External job boards, portals, and AI assistants worth checking regularly — organized so you're not re-Googling the same list every week. Cards with no built-in link search for you until you add one (click the {"\u270E"} to save your own — saved with this tracker).</p>
        {Object.keys(customLinks).length > 0 && (
          <button className="btn small" onClick={resetAllLinks} style={{flex:"none"}}>{"\u21BA"} Reset all to defaults</button>
        )}
      </div>

      <div className="hub-prompt-bar">
        <div style={{flex:1, minWidth:180}}>
          <label style={{display:"block", fontSize:11, color:"var(--text-soft)", textTransform:"uppercase", letterSpacing:".04em", marginBottom:5}}>
            Target role (used in the AI prompt and searches below)
          </label>
          <ClearableInput className="search-input" wrapStyle={{width:"100%"}}
            placeholder="e.g. Software Engineer" value={role} onChange={e => saveRole(e.target.value)} />
        </div>
        <div style={{flex:1, minWidth:180}}>
          <label style={{display:"block", fontSize:11, color:"var(--text-soft)", textTransform:"uppercase", letterSpacing:".04em", marginBottom:5}}>
            Location (used the same way)
          </label>
          <ClearableInput className="search-input" wrapStyle={{width:"100%"}}
            placeholder="e.g. Denver, CO" value={location} onChange={e => saveLocation(e.target.value)} />
        </div>
        <button className="btn primary" onClick={copyPrompt} style={{alignSelf:"flex-end"}}>
          {copied ? "Copied \u2713" : "\u{1F4CB} Copy AI Job Prompt"}
        </button>
      </div>
      <p className="page-sub" style={{marginTop:8, fontStyle:"italic"}}>"{buildAiPrompt(role, location)}"</p>

      {HUB_CATEGORIES.map(cat => {
        // Built-in links and your own custom cards share one grid, so the
        // collapse threshold counts both together.
        const allCards = [
          ...cat.links.map(link => ({type: "link", key: link.name, link})),
          ...(customCards[cat.id] || []).map(card => ({type: "custom", key: card.id, card})),
        ];
        const overLimit = allCards.length > HUB_VISIBLE_LIMIT;
        const expanded = !!expandedCats[cat.id];
        const visibleCards = (overLimit && !expanded) ? allCards.slice(0, HUB_VISIBLE_LIMIT) : allCards;
        return (
          <div key={cat.id}>
            <div className="section-label" style={{color:cat.accent}}>{cat.label}</div>
            <div className="hub-grid">
              {visibleCards.map(item => item.type === "link" ? (
                <HubLinkCard key={item.key} link={item.link} accent={cat.accent}
                  override={customLinks[item.link.name]} onSaveOverride={saveOverride} location={location} />
              ) : (
                <CustomHubCard key={item.key} card={item.card} accent={cat.accent}
                  onSave={updated => saveCustomCard(cat.id, updated)}
                  onDelete={() => requestDeleteCustomCard(cat.id, item.card)} />
              ))}
              {overLimit && (
                <button className="hub-add-tile" onClick={() => setExpandedCats(prev => ({...prev, [cat.id]: !expanded}))}>
                  {expanded ? "Show fewer" : `+ ${allCards.length - HUB_VISIBLE_LIMIT} more`}
                </button>
              )}
              <AddCardTile onAdd={card => addCustomCard(cat.id, card)} />
            </div>
          </div>
        );
      })}

      {cardUndo && (
        <div className="toast-stack">
          <div className="toast undo-toast">
            <span>Removed "{cardUndo.card.title}".</span>
            <button className="toast-undo-btn" onClick={undoDeleteCustomCard}>Undo</button>
          </div>
        </div>
      )}
    </div>
  );
}


// Chart.js loads from a CDN — if that script failed (offline, CDN hiccup,
// ad blocker, a bad version pin) `window.Chart` just won't exist. Charts are
// enhancement, not core function, so we degrade to a message instead of
// throwing and taking down the whole page (there's no error boundary around
// individual pages, so an uncaught render error here would blank everything,
// not just the chart).
function chartLibAvailable(){
  return typeof window.Chart !== "undefined";
}

function useChart(canvasRef, config){
  const chartRef = useRef(null);
  // Depends on the *entire* serialized config (not just .data) so a theme
  // flip — which changes only tick/legend/grid colors — still triggers a
  // rebuild instead of leaving the chart drawn in the old theme's colors.
  useEffect(() => {
    if (!canvasRef.current || !chartLibAvailable()) return;
    try {
      if (chartRef.current) chartRef.current.destroy();
      chartRef.current = new Chart(canvasRef.current, config);
    } catch (e) {
      console.error("Chart render failed:", e);
    }
    return () => { if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; } };
  }, [JSON.stringify(config.data), JSON.stringify(config.options), config.type]);
}

function ChartUnavailable(){
  return (
    <div style={{display:"flex", alignItems:"center", justifyContent:"center", height:"100%",
      color:"var(--text-soft)", fontSize:12.5, textAlign:"center", padding:16}}>
      Chart.js didn't load (offline, or the CDN is unreachable) — the rest of the app still works fine.
    </div>
  );
}

function chartTextColor(){
  return getComputedStyle(document.documentElement).getPropertyValue("--text-soft").trim() || "#94A3B8";
}
function chartGridColor(){
  return getComputedStyle(document.documentElement).getPropertyValue("--border-soft").trim() || "#1E293B";
}

function StatusDistributionChart({apps, meta, themeTick}){
  const canvasRef = useRef(null);
  const statusOrder = meta.status_order || DEFAULT_STATUS_ORDER;
  const colors = meta.status_colors || DEFAULT_STATUS_COLORS;
  const active = apps.filter(a => !a.archived);
  const counts = statusOrder.map(s => active.filter(a => a.effective_status === s).length);
  const config = {
    type: "doughnut",
    data: {
      labels: statusOrder.map(s => s[0].toUpperCase()+s.slice(1)),
      datasets: [{ data: counts, backgroundColor: statusOrder.map(s => colors[s] || "#5b6472"), borderWidth: 0 }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: "right", labels: { color: chartTextColor(), font: {size: 11.5} } } },
    },
  };
  useChart(canvasRef, config);
  if (!chartLibAvailable()) return <ChartUnavailable />;
  return <canvas ref={canvasRef}></canvas>;
}

function VelocityChart({apps, themeTick}){
  const canvasRef = useRef(null);
  // Bucket by ISO week of date_applied (falls back to last_activity — see
  // README's note on why file-mtime-derived dates can be noisy).
  const buckets = {};
  apps.filter(a => !a.archived).forEach(a => {
    const raw = a.date_applied || a.last_activity;
    if (!raw) return;
    const d = new Date(raw);
    if (isNaN(d)) return;
    const weekStart = new Date(d);
    weekStart.setDate(d.getDate() - d.getDay());
    const key = weekStart.toISOString().slice(0,10);
    buckets[key] = (buckets[key] || 0) + 1;
  });
  const weeks = Object.keys(buckets).sort().slice(-16);
  const gridColor = chartGridColor();
  const textColor = chartTextColor();
  const config = {
    type: "line",
    data: {
      labels: weeks,
      datasets: [{
        label: "Applications",
        data: weeks.map(w => buckets[w]),
        borderColor: "#3B82F6", backgroundColor: "#3B82F633", fill: true, tension: 0.3, pointRadius: 3,
      }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: textColor, font: {size: 10.5} }, grid: { color: gridColor } },
        y: { beginAtZero: true, ticks: { color: textColor, stepSize: 1 }, grid: { color: gridColor } },
      },
    },
  };
  useChart(canvasRef, config);
  if (!chartLibAvailable()) return <ChartUnavailable />;
  if (weeks.length === 0) {
    return <EmptyState icon={"\u{1F4C8}"} title="No velocity data yet" sub="Set Date applied on a few cards to see velocity over time." />;
  }
  return <canvas ref={canvasRef}></canvas>;
}

// Published 2025-2026 hiring-market figures (LinkedIn/Indeed aggregate data,
// CareerPlug's 10M-application report, Glassdoor benchmarks), kept as static
// reference points — not fetched live, this app never calls out to the
// internet. Intentionally broad ranges since real benchmarks vary a lot by
// industry/platform; this is for rough calibration, not a precise target.
const BENCHMARKS = {
  response_rate: [2, 10],
  interview_rate: [2, 3],
};

function BenchmarkNote({label, value, range}){
  const [lo, hi] = range;
  const above = value > hi;
  const within = value >= lo && value <= hi;
  const verb = above ? "well above" : within ? "in line with" : "below";
  const color = above ? "var(--green-text, #4ADE80)" : within ? "var(--text-soft)" : "var(--amber-text, #F59E0B)";
  return (
    <span style={{fontSize:11.5, color, display:"block", marginTop:4}}>
      {verb} the typical {lo}–{hi}% published for {label}
    </span>
  );
}

function StatusFunnel({byStatus, total}){
  const order = [["drafted","Drafted"],["applied","Applied"],["interviewing","Interviewing"],["rejected","Rejected"],["unknown","Unknown"]];
  const colors = DEFAULT_STATUS_COLORS;
  return (
    <div className="chart-card">
      <h3>Pipeline breakdown</h3>
      <div style={{display:"flex", flexDirection:"column", gap:10}}>
        {order.map(([key,label]) => {
          const count = byStatus[key] || 0;
          const pct = total ? (count/total*100) : 0;
          return (
            <div key={key}>
              <div style={{display:"flex", justifyContent:"space-between", fontSize:12.5, marginBottom:4}}>
                <span style={{color:"var(--text-soft)"}}>{label}</span>
                <span style={{color:"var(--text)"}}>{count} · {pct.toFixed(0)}%</span>
              </div>
              <div style={{height:6, borderRadius:99, background:"var(--border)", overflow:"hidden"}}>
                <div style={{height:"100%", width:`${pct}%`, background:colors[key]||"#5b6472", borderRadius:99}} />
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function thisWeekAndDataQuality(apps){
  const active = apps.filter(a => !a.archived);
  const weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate()-7);
  const recent = active.filter(a => {
    const raw = a.date_applied || a.last_activity;
    if (!raw) return false;
    const d = new Date(raw);
    return !isNaN(d) && d >= weekAgo;
  });
  const byStatus = {};
  recent.forEach(a => { byStatus[a.effective_status] = (byStatus[a.effective_status]||0)+1; });

  // Data quality: a cluster of un-dated items sharing one file-mtime date
  // usually means a folder copy/reorganize, not real activity that day.
  const mtimeOnly = active.filter(a => a.last_activity && !a.date_applied).map(a => a.last_activity.slice(0,10));
  let warning = null;
  if (mtimeOnly.length >= 10) {
    const counts = {};
    mtimeOnly.forEach(d => { counts[d] = (counts[d]||0)+1; });
    const [topDate, topCount] = Object.entries(counts).sort((a,b) => b[1]-a[1])[0];
    if (topCount / mtimeOnly.length > 0.4) {
      warning = `${topCount} of ${mtimeOnly.length} applications share the same file-modification date (${topDate}) — likely from copying or reorganizing files, not real activity. "Days since" and time-to-response numbers for those will be off until you set a real Date applied on them (Pipeline → open a card → Notes & status).`;
    }
  }
  return {recent, byStatus, warning};
}

  const [m, setM] = useState(null);

  const {recent, byStatus: weekByStatus, warning} = thisWeekAndDataQuality(apps);

  return (
    <div>

      <div style={{display:"flex", gap:14, flexWrap:"wrap", marginBottom:20}}>
        <div className="metric-card"><div className="num">{m.total}</div><div className="lbl">Active applications</div></div>
        <div className="metric-card">
          <div className="num">{m.response_rate.toFixed(0)}%</div><div className="lbl">Response rate</div>
          <BenchmarkNote label="response rate" value={m.response_rate} range={BENCHMARKS.response_rate} />
        </div>
        <div className="metric-card">
          <div className="num">{m.interview_rate.toFixed(0)}%</div><div className="lbl">Interview rate</div>
          <BenchmarkNote label="application-to-interview rate" value={m.interview_rate} range={BENCHMARKS.interview_rate} />
        </div>
      </div>
      {m.avg_response_days != null ? (
        <p className="page-sub">Average time to first response: <b style={{color:"var(--text)"}}>{m.avg_response_days} days</b> (based on {m.lag_sample_size} application(s) with a manually-set Date Applied).</p>
      ) : (
        <p className="page-sub">Set Date applied on a few cards in Pipeline to unlock time-to-response tracking.</p>
      )}

      {warning && <div className="warning-banner" style={{marginBottom:20}}>{warning}</div>}

      <div className="section-label">This week</div>
      {recent.length ? (
        <p className="page-sub" style={{marginBottom:20}}>
          {Object.entries(weekByStatus).map(([status,count],i) => (
            <span key={status}><b style={{color:"var(--text)"}}>{count}</b> {status}{i < Object.entries(weekByStatus).length-1 ? " · " : ""}</span>
          ))}
        </p>
      ) : (
        <p className="page-sub" style={{marginBottom:20}}>No recorded activity in the last 7 days — a quiet week is a good cue to queue up a few more applications.</p>
      )}

      <div className="charts-row">
        <div className="chart-card">
          <h3>Application velocity (by week applied)</h3>

  );
}
