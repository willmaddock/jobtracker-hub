<svg width="680" height="680" viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
  <title>JobTracker Hub</title>
  <desc>
    A squircle icon on a dark navy background containing three rounded
    kanban-style columns, each topped with a small dot, in the app's real
    status colors: gray (drafted), blue (applied), and green
    (interviewing) -- macOS applies its own corner mask at build time, so
    the squircle clip here is only for previewing at other sizes.
  </desc>

  <defs>
    <clipPath id="squircle">
      <rect x="60" y="60" width="560" height="560" rx="140"/>
    </clipPath>
  </defs>

  <!-- Background: the app's real dark-mode surface color. -->
  <rect x="60" y="60" width="560" height="560" rx="140" fill="#0F172A"/>

  <g clip-path="url(#squircle)">
    <!-- drafted -->
    <rect x="188" y="330" width="80" height="230" rx="20" fill="#9aa4b2"/>
    <!-- applied -->
    <rect x="300" y="230" width="80" height="330" rx="20" fill="#4a9eff"/>
    <!-- interviewing -->
    <rect x="412" y="180" width="80" height="380" rx="20" fill="#3ddc84"/>

    <circle cx="228" cy="290" r="20" fill="#9aa4b2"/>
    <circle cx="340" cy="190" r="20" fill="#4a9eff"/>
    <circle cx="452" cy="140" r="20" fill="#3ddc84"/>
  </g>
</svg>
