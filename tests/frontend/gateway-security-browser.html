operator.document.querySelector('[name="name"]').value='Native browser edited';operator.document.getElementById('workspace_form').requestSubmit();await wait(()=>operator.location.pathname==='/admin/accounts/workspace/'&&operator.document.body.textContent.includes('Native browser edited'),'admin change saved');assert('Authorized native admin change saves and redirects',boundForms(operator));
operator.location.href='/admin/password_change/';await wait(()=>operator.document.querySelector('[name="old_password"]'),'native password form');operator.document.querySelector('[name="old_password"]').value='synthetic-test-password';for(const name of ['new_password1','new_password2'])operator.document.querySelector('[name="'+name+'"]').value='Native-Browser-Password-58!';operator.document.querySelector('[name="old_password"]').form.requestSubmit();
await wait(()=>operator.location.pathname==='/admin/password_change/done/'&&operator.document.body.textContent.includes('Your password was changed'),'native password completion');operatorIdentity=await(await fetch('/api/auth/me',{headers:{[HEADER]:binding}})).json();assert('Native password rotation retains the bound operator session and success-page logout',operatorIdentity.username==='auditOperator'&&boundForms(operator));

await config();await login('M');const mfaTab=tab();await loaded(mfaTab,'M');
const verifiedBinding=mfaTab.jthGatewaySession.context.binding;
async function enrollVerified(t,label){
 t.dispatchEvent(new t.Event('jth-open-security'));
 await wait(()=>[...t.document.querySelectorAll('button')].some(x=>x.textContent==='Set up authenticator app'),label+' settings loaded');
 [...t.document.querySelectorAll('button')].find(x=>x.textContent==='Set up authenticator app').click();
 await wait(()=>t.document.querySelector('section[aria-label="Authenticator app"] code'),label+' setup key');
 const secret=t.document.querySelector('section[aria-label="Authenticator app"] code').textContent.replace(/\s/g,'');
 const generated=await(await fetch('/__test/code',{method:'POST',body:JSON.stringify({secret})})).json();
 fill(t,'section[aria-label="Authenticator app"] input[autocomplete="one-time-code"]',generated.code);
 t.document.querySelector('section[aria-label="Authenticator app"] form').requestSubmit();
 await wait(()=>t.document.querySelector('section[aria-label="Recovery codes"] li'),label+' completion and recovery delivery');
 const codes=[...t.document.querySelectorAll('section[aria-label="Recovery codes"] li')].map(x=>x.textContent);
 const status=await(await t.jthGatewaySession.fetch('/api/auth/mfa/status')).json();
 const who=await(await t.jthGatewaySession.fetch('/api/auth/me')).json();
 assert(label+' confirms device, verified session, principal and recovery delivery',codes.length===10&&status.enrolled&&status.verified&&who.username==='auditM'&&t.jthGatewaySession.context.phase==='verified'&&!t.jthGatewaySession.ended);
 t.document.querySelector('section[aria-label="Recovery codes"] input[type="checkbox"]').click();
 await wait(()=>[...t.document.querySelectorAll('section[aria-label="Recovery codes"] button')].some(x=>x.textContent==='Continue'&&!x.disabled),label+' recovery acknowledgement');
 [...t.document.querySelectorAll('section[aria-label="Recovery codes"] button')].find(x=>x.textContent==='Continue').click();
 t.document.dispatchEvent(new t.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
 await wait(()=>!t.document.querySelector('section[aria-label="Security"]'),label+' settings closed');
 return codes;
}
await enrollVerified(mfaTab,'Optional verified-user enrollment');
assert('Verified enrollment preserves the existing session generation and context',mfaTab.jthGatewaySession.context.binding===verifiedBinding);
await config({mfa_required:true,reset_mfa:'auditM'});

assert('Re-enrollment after reset preserves current verified lineage',mfaTab.jthGatewaySession.context.binding===verifiedBinding);
await mfaTab.jthGatewaySession.logout();remove(mfaTab);await bootstrap();await login('M');
const recovered=await action('/api/auth/mfa/verify',{code:replacementCodes[0]});const recoveredData=await recovered.json();
const recoveredWho=await(await fetch('/api/auth/me',{headers:{[HEADER]:binding}})).json();
assert('New recovery code still completes a bound pending sign-in after re-enrollment',recovered.status===200&&recoveredData.mfa_method==='recovery'&&recoveredWho.username==='auditM');
await config();

await logout();await config({mfa_required:true});await bootstrap();a=tab();
await wait(()=>a.document.querySelector('input[autocomplete="username"]'),'password form');
function fill(t,selector,value){const input=t.document.querySelector(selector);Object.getOwnPropertyDescriptor(t.HTMLInputElement.prototype,'value').set.call(input,value);input.dispatchEvent(new t.Event('input',{bubbles:true}));}
async function submit(t){await wait(()=>!t.document.querySelector('form button[type="submit"],form button.btn.primary')?.disabled,'form enabled');t.document.querySelector('form').requestSubmit();}
fill(a,'input[autocomplete="username"]','auditA');fill(a,'input[type="password"]','synthetic-test-password');await submit(a);
await wait(()=>root(a).includes('Set up two-step verification'),'enrollment screen');assert('Gateway login reaches genuine MFA enrollment with phase binding',a.jthGatewaySession.context.phase==='enrollment');
const secret=a.document.querySelector('code').textContent.replace(/\s/g,'');const code=await (await fetch('/__test/code',{method:'POST',body:JSON.stringify({secret})})).json();fill(a,'input.auth-code',code.code);await submit(a);
await wait(()=>root(a).includes('Save your recovery codes'),'recovery codes');const recovery=[...a.document.querySelectorAll('li')].map(x=>x.textContent);assert('Enrollment key rotation preserves recovery-code delivery',recovery.length===10&&a.jthGatewaySession.context.phase==='verified');
a.document.querySelector('input[type="checkbox"]').click();await wait(()=>[...a.document.querySelectorAll('button')].some(x=>x.textContent==='Continue'&&!x.disabled),'recovery acknowledgement');[...a.document.querySelectorAll('button')].find(x=>x.textContent==='Continue').click();await loaded(a,'A');
await a.jthGatewaySession.logout();await wait(()=>a.document.querySelector('input[autocomplete="username"]'),'relogin form');fill(a,'input[autocomplete="username"]','auditA');fill(a,'input[type="password"]','synthetic-test-password');await submit(a);
await wait(()=>root(a).includes('Two-step verification'),'MFA prompt');fill(a,'input.auth-code','invalid');await submit(a);await wait(()=>root(a).includes('not accepted'),'bad MFA response');assert('Bad MFA code remains retryable without invalidating context',!a.jthGatewaySession.ended&&a.jthGatewaySession.context.phase==='pending');
fill(a,'input.auth-code',recovery[0]);await submit(a);await loaded(a,'A');assert('Recovery-code reauthentication completes in real browser',a.jthGatewaySession.context.phase==='verified');remove(a);await config();
}catch(error){results.push({name:'Harness failure',passed:false,error:String(error),tabs:[...tabs].map(t=>({phase:t.jthGatewaySession?.context.phase,ended:t.jthGatewaySession?.ended,text:root(t).slice(0,300)}))});}finally{
for(const t of tabs)t.close();await config();document.querySelector('#results').textContent=JSON.stringify(results,null,2);await fetch('/__test/report',{method:'POST',body:JSON.stringify(results)});document.title='AUDIT_DONE';
}})();
