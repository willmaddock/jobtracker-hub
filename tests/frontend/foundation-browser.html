<!doctype html><html lang="en"><meta charset="utf-8"><title>Foundation browser checks</title>
<h1>Foundation browser checks</h1>
<p>Run only on the disposable serve_foundation.py server. This signs in as fixture Alice.</p>
<button id="run">Run browser checks</button><pre id="results" role="status">Not run</pre>
<script src="/workspace-context.js"></script><script src="/api-client.js"></script>
<script>
document.querySelector('#run').onclick = async function () {
  this.disabled = true;
  const output = document.querySelector('#results'); output.textContent = '';
  let passed = 0;
  function assert(value, message) { if (!value) throw Error(message); }
  async function test(name, fn) { await fn(); passed++; output.textContent += 'PASS ' + name + '\n'; }
  window.__fixtureAggregateTraffic=[];
  const context = JTHWorkspace.createContext();
  const client = JTHApi.createClient({context});
  try {
    await test('anonymous login CSRF rejection', async () => {
      await client.bootstrap();
      try { await client.request('/api/auth/logout', {method:'POST'}); } catch(e) { assert(e.code === 'authentication_required', e.code); }
      const response = await fetch('/api/auth/login', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'alice',password:'browser-fixture-only'})});
      assert(response.status === 403, 'login allowed without CSRF');
      assert((await response.json()).code === 'csrf_failed', 'CSRF code');
    });
    await test('login and rotated CSRF', async () => {
      await client.bootstrap();
      const user = await client.request('/api/auth/login', {method:'POST',body:{username:'alice',password:'browser-fixture-only'}});
      context.setActor(user.id); context.select(1); await client.bootstrap();
      assert((await client.request('/api/auth/me')).username === 'alice', 'session missing');
    });
    await test('real XHR multipart carries File, text, session, CSRF', async () => {
      const form = new FormData(); form.append('label','multipart fixture'); form.append('file',new File(['fixture bytes'],'fixture.txt',{type:'text/plain'}));
      const result = await client.upload('/api/test-only/upload',form);
      assert(result.actor === 'alice' && result.label === 'multipart fixture' && result.filename === 'fixture.txt' && result.content === 'fixture bytes', JSON.stringify(result));
    });
    await test('XHR CSRF error parity', async () => {
      const other = JTHApi.createClient({context}); await other.bootstrap();
      await client.request('/api/auth/login', {method:'POST',body:{username:'alice',password:'browser-fixture-only'}});
      try { await other.upload('/api/test-only/upload',new FormData()); throw Error('missing rejection'); }
      catch(e) { assert(e.code === 'csrf_failed' && e.status === 403, e.message); }
      await client.bootstrap();
    });
    await test('workspace ownership and immutable read contexts', async () => {
      await client.readWorkspace(); context.select(2); await client.readWorkspace(); context.select(3);
      try { await client.readWorkspace(); throw Error('foreign workspace exposed'); } catch(e) { assert(e.code === 'not_found', e.message); }
      context.select(1);
    });
    await test('real delayed response discarded after navigation', async () => {
      const pending = client.request('/api/test-only/slow'); context.select(2);
      try { await pending; throw Error('stale read accepted'); } catch(e) { assert(e.code === 'stale_response', e.message); }
    });
    await test('logout 204 and expired session 401', async () => {
      assert(await client.request('/api/auth/logout',{method:'POST'}) === null, '204 handling');
      try { await client.request('/api/auth/me'); throw Error('session remained'); } catch(e) { assert(e.code === 'authentication_required' && e.status === 401, e.message); }
    });
    await test('evidence fixture login and actual Django product panel', async () => {
      await client.bootstrap();
      const user=await client.request('/api/auth/login',{method:'POST',body:{username:'alice',password:'browser-fixture-only'}});
      context.setActor(user.id);context.select(1);await client.bootstrap();
    });
    const fixtures=await client.request('/api/test-only/evidence-fixtures');
    const frame=document.createElement('iframe');frame.title='Disposable Django product workflow';frame.style.cssText='width:100%;height:700px';
    document.body.appendChild(frame);
    let win,doc;
    const wait=async(predicate,label)=>{const end=Date.now()+20000;while(Date.now()<end){if(predicate())return;await new Promise(r=>setTimeout(r,20));}throw Error('Timed out: '+label);};
    async function mount(workspace=1){frame.src='/#/workspaces/'+workspace;await wait(()=>frame.contentDocument?.querySelector('button')?.textContent !== undefined && frame.contentDocument.querySelector('#root')?.textContent.includes('Connected to '),'foundation ready');win=frame.contentWindow;doc=frame.contentDocument;}
    const text=()=>doc.querySelector('#root')?.textContent||'';
    const button=label=>Array.from(doc.querySelectorAll('button')).find(b=>b.textContent.trim()===label);
    const sourceButton=id=>Array.from(doc.querySelectorAll('button')).find(b=>b.textContent.startsWith('Source '+id+' —'));
    const click=async label=>{const node=button(label);assert(node&&!node.disabled,'Unavailable button '+label);node.click();await new Promise(r=>setTimeout(r,0));};
    async function choose(label){sourceButton(fixtures.sources[label]).click();await new Promise(r=>setTimeout(r,0));await wait(()=>!text().includes('Loading extraction history…'),'history '+label);}
    await mount();
    const firstDocumentTraffic=win.__fixtureTraffic;
    const traffic=window.__fixtureAggregateTraffic;
    const rejectedProbes=new Set();
    function allowedTraffic(call) {
      let url;
      try { url=new URL(call.url,location.origin); } catch (_) { return false; }
      if(url.origin!==location.origin||url.hash||url.username||url.password)return false;
      const path=url.pathname, query=Array.from(url.searchParams.entries());
      // The sole mutation exception is the existing, explicitly exercised logout.
      // The disposable hook marks it only around that foundation control action.
      if(call.method==='POST')return allowedDispositionPost(call)||call.foundationAction==='logout'&&path==='/api/auth/logout'&&!query.length;
      if(call.method==='PUT')return allowedAssignmentPut(call);
      if(call.method!=='GET')return false;
      if(['/api/auth/csrf','/api/auth/me','/api/workspaces/'].includes(path))return !query.length;
      const positive=value=>/^[1-9]\d*$/.test(value)&&Number.isSafeInteger(Number(value));
      let match=/^\/api\/workspaces\/([1-9]\d*)\/insights\/$/.exec(path);
      if(match)return positive(match[1])&&!query.length;
      match=/^\/api\/workspaces\/([1-9]\d*)\/applications\/(?:([1-9]\d*)\/)?$/.exec(path);
      if(match)return positive(match[1])&&(!match[2]||positive(match[2]))&&!query.length;
      match=/^\/api\/workspaces\/([1-9]\d*)\/categories\/(?:([1-9]\d*)\/(applications\/)?)?$/.exec(path);
      if(match)return positive(match[1])&&(!match[2]||positive(match[2]))&&(match[2]&&!match[3] ? !query.length : query.length===1&&query[0][0]==='show_archived'&&query[0][1]==='true');
      match=/^\/api\/workspaces\/([1-9]\d*)\/application-reviews\/(?:([1-9]\d*)\/)?$/.exec(path);
      if(match)return positive(match[1])&&(!match[2]||positive(match[2]))&&(match[2] ? !query.length : !query.length||query.length===1&&query[0][0]==='after'&&positive(query[0][1]));
      match=/^\/api\/workspaces\/([1-9]\d*)\/retained-messages\/$/.exec(path);
      if(match)return positive(match[1])&&(!query.length||query.length===1&&query[0][0]==='after'&&positive(query[0][1]));
      match=/^\/api\/workspaces\/([1-9]\d*)\/retained-messages\/([1-9]\d*)\/posting-extractions\/$/.exec(path);
      return !!match&&positive(match[1])&&positive(match[2])&&(!query.length||query.length===1&&query[0][0]==='cursor'&&!!query[0][1]);
    }
    function assertTraffic(calls) { assert(calls.every(allowedTraffic),'unexpected product request route or method'); }
    let intercept=null;
    const nativeFetch=win.__fixtureNativeFetch;
    win.__fixtureIntercept=(url,options)=>intercept?.(url,options);
    const response=(status,data)=>Promise.resolve(new win.Response(JSON.stringify(data),{status,headers:{'Content-Type':'application/json'}}));
    const appFixtures=await client.request('/api/test-only/application-fixtures');
    const appList='/api/workspaces/1/applications/';
    const appUrl=id=>appList+id+'/';
    const appButton=id=>doc.querySelector('[data-application-id="'+id+'"]');
    const appPanel=()=>doc.querySelector('[data-testid="application-panel"]');
    const realApps=await (await nativeFetch(appList)).json();
    const realDetail=await (await nativeFetch(appUrl(appFixtures.first))).json();
    await test('Applications show repeated attempts, server fields, back and close without resource route',async()=>{
      const before=traffic.length;await click('Applications');await wait(()=>appButton(appFixtures.first),'Applications list');
      assert(appButton(appFixtures.second),'repeated attempt collapsed');assert(text().includes('Credentials'),'non-pipeline hidden');
      assert(text().includes('Applied date: Unknown')&&text().includes('interviewing')&&text().includes('Archived'),'server fields');
      assert(text().includes('All current records load together'),'unpaginated limit hidden');
      appButton(appFixtures.first).click();await wait(()=>doc.querySelector('[data-testid="application-detail"]'),'Application detail');
      assert(text().includes('2026-09-01')&&text().includes('Category reference')&&text().includes(String(appFixtures.category)),'detail values');
      assert(text().includes('Unknown / unreconciled'),'unknown provenance fabricated');
      assert(win.location.hash==='#/workspaces/1','resource route introduced');
      await click('Back to Applications');assert(appButton(appFixtures.first),'list not retained');
      appButton(appFixtures.second).click();await wait(()=>doc.querySelector('[data-testid="application-detail"]'),'second detail');
      assert(text().includes('Applied dateUnknown'),'unknown applied date');
      await click('Close Applications');assert(!appPanel(),'close failed');
      const calls=traffic.slice(before);assert(calls.every(c=>c.method==='GET'&&/^\/api\/workspaces\/1\/applications\/(?:[1-9]\d*\/)?$/.test(c.url)),'Application traffic escaped');
    });
    await test('Application list error and retry, detail error and retry, unavailable and trashed disclosure',async()=>{
      let failed=true;
      intercept=url=>url===appList&&failed?response(500,{detail:'SQL private-secret'}):null;
      await click('Applications');await wait(()=>button('Try again'),'list error');assert(!text().includes('private-secret'),'raw error');
      failed=false;await click('Try again');await wait(()=>appButton(appFixtures.first),'list retry');
      failed=true;intercept=url=>url===appUrl(appFixtures.first)&&failed?response(500,{}):null;
      appButton(appFixtures.first).click();await wait(()=>button('Try again'),'detail error');failed=false;await click('Try again');
      await wait(()=>doc.querySelector('[data-testid="application-detail"]'),'detail retry');await click('Back to Applications');
      intercept=url=>url===appUrl(appFixtures.first)?response(404,{detail:'private-secret'}):null;
      appButton(appFixtures.first).click();await wait(()=>text().includes('Application or Workspace unavailable.'),'404');
      assert(!doc.querySelector('[data-testid="application-detail"]'),'stale detail');await click('Back to Applications');
      intercept=url=>url===appUrl(appFixtures.first)?response(200,{...realDetail,is_trashed:true,effective_trashed:true,trashed_at:'2026-10-05T12:00:00Z'}):null;
      appButton(appFixtures.first).click();await wait(()=>text().includes('Trashed — read-only inspection'),'trashed detail');
      assert(!button('Restore'),'restore control');await click('Close Applications');intercept=null;
    });
    await test('Application selection, back and close discard delayed detail responses',async()=>{
      await click('Applications');await wait(()=>appButton(appFixtures.first),'race list');
      for(const action of ['selection','back','close']){
        let release;
        intercept=url=>url===appUrl(appFixtures.first)?new Promise(resolve=>{release=()=>resolve(new win.Response(JSON.stringify({...realDetail,company:'STALE DETAIL'}),{status:200}));}):null;
        appButton(appFixtures.first).click();await wait(()=>!!release,'detail held');
        if(action==='selection'){
          await click('Back to Applications');appButton(appFixtures.second).click();
          await wait(()=>doc.querySelector('[data-testid="application-detail"]'),'new selection');
        } else if(action==='back')await click('Back to Applications');else await click('Close Applications');
        release();await new Promise(r=>setTimeout(r,60));assert(!text().includes('STALE DETAIL'),'late detail rendered');
        intercept=null;
        if(action==='selection')await click('Back to Applications');
      }
      assert(!appPanel(),'panel not closed');
    });
    await test('Application list ignores delayed response after Workspace navigation; empty Workspace works',async()=>{
      let release;intercept=url=>url===appList?new Promise(resolve=>{release=()=>resolve(new win.Response(JSON.stringify(realApps),{status:200}));}):null;
      await click('Applications');await wait(()=>!!release,'list held');
      const selector=doc.querySelector('select[aria-label="Workspace"]');selector.value='2';selector.dispatchEvent(new win.Event('change',{bubbles:true}));
      await wait(()=>text().includes('Connected to B.'),'Application Workspace race');release();await new Promise(r=>setTimeout(r,60));
      assert(!appPanel()&&!text().includes('Repeated Co'),'old list');intercept=null;
      await click('Applications');await wait(()=>text().includes('No Applications in this Workspace.'),'empty Applications');await click('Close Applications');
      const currentSelector=doc.querySelector('select[aria-label="Workspace"]');currentSelector.value='1';currentSelector.dispatchEvent(new win.Event('change',{bubbles:true}));await wait(()=>text().includes('Connected to A.'),'return A');
    });
    await test('Applications reject unsafe and mismatched identities before detail navigation',async()=>{
      for(const row of [{...realApps[0],id:9007199254740992},{...realApps[0],workspace:2}]){
        intercept=url=>url===appList?response(200,[row]):null;
        const before=traffic.length;await click('Applications');await wait(()=>appPanel()?.querySelector('[role="alert"]'),'invalid list');
        assert(!appPanel().querySelector('[data-application-id]'),'invalid selectable row');
        assert(!traffic.slice(before).some(c=>/applications\/\d/.test(c.url)),'unsafe detail request');await click('Close Applications');
      }
      intercept=null;await click('Applications');await wait(()=>appButton(appFixtures.first),'mismatch list');
      intercept=url=>url===appUrl(appFixtures.first)?response(200,{...realDetail,id:appFixtures.second}):null;
      appButton(appFixtures.first).click();await wait(()=>text().includes('Application data could not be displayed safely.'),'mismatched detail');
      assert(!doc.querySelector('[data-testid="application-detail"]'),'mismatched render');await click('Close Applications');intercept=null;
    });
    await test('Application session expiry clears panel through foundation authentication',async()=>{
      intercept=url=>url===appList?response(401,{code:'authentication_required',detail:'private'}):null;
      await click('Applications');await wait(()=>text().includes('Your session ended. Sign in to continue.'),'Application expiry');assert(!appPanel(),'sensitive panel remains');
      intercept=null;win.dispatchEvent(new win.Event('focus'));await wait(()=>text().includes('Signed in as alice'),'fixture session recheck');
      const selector=doc.querySelector('select[aria-label="Workspace"]');selector.value='1';selector.dispatchEvent(new win.Event('change',{bubbles:true}));await wait(()=>text().includes('Connected to A.'),'restore fixture Workspace');
    });
    const reviewFixtures=await client.request('/api/test-only/review-fixtures');
    const reviewList='/api/workspaces/1/application-reviews/';
    const reviewUrl=id=>reviewList+id+'/';
    const reviewButton=id=>doc.querySelector('[data-review-id="'+id+'"]');
    const reviewPanel=()=>doc.querySelector('[data-testid="review-panel"]');
    const reviewDetail=()=>doc.querySelector('[data-testid="review-detail"]');
    const initialReviews=await (await nativeFetch(reviewList)).json();
    const multipleReview=await (await nativeFetch(reviewUrl(reviewFixtures.reviews.multiple))).json();
    const continuation=reviewList+'?after='+initialReviews.next_after;
    const finalReviews=await (await nativeFetch(continuation)).json();
    async function openReviews(){await click('Application reviews');await wait(()=>reviewButton(reviewFixtures.reviews.multiple),'review list');}
    async function chooseReview(label){reviewButton(reviewFixtures.reviews[label]).click();await wait(()=>reviewDetail()&&!text().includes('Loading review detail…'),'review '+label);}
    async function returnA(){const select=doc.querySelector('select[aria-label="Workspace"]');select.value='1';select.dispatchEvent(new win.Event('change',{bubbles:true}));await wait(()=>text().includes('Connected to A.'),'review return A');}
    await test('review keyset continuation retries same token, accumulates complete pages and retains list',async()=>{
      await openReviews();assert(doc.querySelectorAll('[data-review-id]').length===50,'review page size');
      assert(text().includes('Current review disposition: Active')&&text().includes('Current review disposition: Dismissed'),'inclusive disposition');
      let hits=0;intercept=url=>url===continuation&&++hits===1?response(500,{detail:'private-page-error'}):null;
      await click('Load more reviews');await wait(()=>button('Retry reviews'),'page error');
      assert(doc.querySelectorAll('[data-review-id]').length===50&&!text().includes('private-page-error'),'valid rows lost/raw error');
      await click('Retry reviews');await wait(()=>doc.querySelectorAll('[data-review-id]').length===initialReviews.results.length+finalReviews.results.length,'page retry');
      assert(hits===2&&!button('Load more reviews'),'continuation token/exhaustion');
      await chooseReview('multiple');await click('Back to reviews');assert(doc.querySelectorAll('[data-review-id]').length===initialReviews.results.length+finalReviews.results.length,'pages lost');
      await click('Close reviews');intercept=null;
    });
    await test('review detail separates candidate snapshot, current text and source relationships',async()=>{
      await openReviews();await chooseReview('multiple');
      assert(text().includes('Initial candidate snapshot')&&text().includes('Current Application information')&&text().includes('Existing source relationships'),'semantic headings');
      assert(doc.querySelectorAll('[data-testid="review-candidate"]').length===4&&doc.querySelectorAll('[data-testid="review-relationship"]').length===2,'references omitted');
      assert(text().includes('Application removed/unavailable; portable provenance retained.'),'removed provenance');
      assert(text().includes('<img src=x onerror=window.reviewInjected=true>')&&text().includes('<script>window.reviewInjected=true<\/script> Current name'),'provider text changed');
      assert(!win.reviewInjected&&!reviewPanel().querySelector('img')&&!reviewPanel().querySelector('script'),'HTML rendered');
      assert(!text().includes('Initial name')&&!text().includes('lifecycle_revision')&&!text().includes('attachable'),'historical labels/revisions invented');
      assert(text().includes('Reported candidate count')&&text().includes('4 returned candidate references'),'counts conflated');
      await click('Close reviews');
    });
    await test('candidate and relationship destinations share core detail with no Application list fetch',async()=>{
      await openReviews();await chooseReview('multiple');const before=traffic.length;
      for(const id of [appFixtures.first,appFixtures.second,reviewFixtures.renamed]){
        const candidate=multipleReview.candidates.find(c=>c.application_id===id);
        doc.querySelector('[data-review-candidate="'+candidate.id+'"]').click();await wait(()=>doc.querySelector('[data-testid="application-detail"]'),'candidate destination');
        if(id===appFixtures.first)assert(text().includes('Archived')&&text().includes('interviewing'),'existing core fields lost');
        assert(!reviewDetail(),'two views active');await click('Back to review');assert(reviewDetail(),'review lost');
      }
      doc.querySelector('[data-review-relationship]').click();await wait(()=>doc.querySelector('[data-testid="application-detail"]'),'relationship destination');await click('Back to review');
      assert(traffic.slice(before).every(c=>c.method==='GET'&&/^\/api\/workspaces\/1\/applications\/[1-9]\d*\/$/.test(c.url)),'destination loaded list/excluded endpoint');
      assert(win.location.hash==='#/workspaces/1','review resource route');await click('Back to reviews');await click('Close reviews');
    });
    await test('trashed references, conflict, zero candidates, restored Active and excluded creation history',async()=>{
      await openReviews();await chooseReview('trashed');assert(text().includes('Current availability: trashed'),'trashed candidate');
      doc.querySelector('[data-review-candidate]').click();await wait(()=>text().includes('Trashed — read-only inspection'),'trashed destination');assert(!button('Restore'),'restore control');
      await click('Back to review');await click('Back to reviews');await chooseReview('conflict');
      assert(text().includes('Source conflict recorded.')&&text().includes('Current review disposition: Active')&&text().includes('0 returned candidate references'),'conflict conflated');
      await click('Back to reviews');await chooseReview('restored');assert(text().includes('Current review disposition: Active')&&!text().includes('Restored'),'restored label');
      await click('Back to reviews');await chooseReview('created');assert(text().includes('1 returned relationships')&&!text().includes('CREATION PRIVATE PAYLOAD')&&!text().includes('input_snapshot'),'creation payload displayed');
      await click('Close reviews');
    });
    await test('review list/detail and Application errors retry explicitly; disappeared target clears detail',async()=>{
      let failed=true;intercept=url=>url===reviewList&&failed?response(500,{detail:'private review error'}):null;
      await click('Application reviews');await wait(()=>button('Retry reviews'),'list failure');assert(!text().includes('private review error'),'raw error');failed=false;await click('Retry reviews');await wait(()=>reviewButton(reviewFixtures.reviews.multiple),'list retry');
      failed=true;intercept=url=>url===reviewUrl(reviewFixtures.reviews.multiple)&&failed?response(500,{}):null;
      reviewButton(reviewFixtures.reviews.multiple).click();await wait(()=>button('Retry reviews'),'detail failure');failed=false;await click('Retry reviews');await wait(()=>reviewDetail(),'detail retry');
      const candidate=multipleReview.candidates.find(c=>c.application_id===appFixtures.first);
      failed=true;intercept=url=>url===appUrl(appFixtures.first)&&failed?response(500,{}):null;
      doc.querySelector('[data-review-candidate="'+candidate.id+'"]').click();await wait(()=>button('Try again'),'destination failure');failed=false;await click('Try again');await wait(()=>doc.querySelector('[data-testid="application-detail"]'),'destination retry');
      await click('Back to review');intercept=url=>url===appUrl(appFixtures.first)?response(404,{detail:'private'}):null;
      doc.querySelector('[data-review-candidate="'+candidate.id+'"]').click();await wait(()=>text().includes('Application or Workspace unavailable.'),'disappeared');assert(!doc.querySelector('[data-testid="application-detail"]'),'old detail retained');
      await click('Back to review');assert(reviewDetail(),'historical review lost');await click('Close reviews');intercept=null;
    });
    await test('review malformed continuation preserves prior valid rows and offers explicit restart',async()=>{
      await openReviews();intercept=url=>url===continuation?response(200,{results:[initialReviews.results[0]],next_after:null}):null;
      await click('Load more reviews');await wait(()=>button('Restart reviews from first page'),'overlap failure');assert(doc.querySelectorAll('[data-review-id]').length===50,'valid pages blanked');
      intercept=null;await click('Restart reviews from first page');await wait(()=>reviewButton(reviewFixtures.reviews.multiple),'restart');assert(doc.querySelectorAll('[data-review-id]').length===50,'restart duplicate append');await click('Close reviews');
    });
    await test('review projections reject unsafe/scope IDs, invalid detail and candidate UUID mismatch',async()=>{
      for(const row of [{...initialReviews.results[0],id:9007199254740992},{...initialReviews.results[0],workspace_id:2}]){
        intercept=url=>url===reviewList?response(200,{results:[row],next_after:null}):null;const before=traffic.length;
        await click('Application reviews');await wait(()=>reviewPanel()?.querySelector('[role="alert"]'),'bad list');assert(!doc.querySelector('[data-review-id]'),'unsafe selectable');assert(!traffic.slice(before).some(c=>/application-reviews\/\d/.test(c.url)),'unsafe detail requested');await click('Close reviews');
      }
      intercept=null;await openReviews();
      for(const mutate of [r=>r.id++,r=>r.workspace_id=2,r=>r.candidates[0].application_id=9007199254740992,r=>r.relationships[0].application_id=9007199254740992]){
        const bad=structuredClone(multipleReview);mutate(bad);intercept=url=>url===reviewUrl(reviewFixtures.reviews.multiple)?response(200,bad):null;
        reviewButton(reviewFixtures.reviews.multiple).click();await wait(()=>reviewPanel()?.querySelector('[role="alert"]'),'bad detail');assert(!reviewDetail(),'bad detail displayed');await click('Back to reviews');
      }
      intercept=null;await chooseReview('multiple');intercept=url=>url===appUrl(appFixtures.first)?response(200,{...realDetail,portable_id:'00000000-0000-4000-8000-000000000999'}):null;
      const candidate=multipleReview.candidates.find(c=>c.application_id===appFixtures.first);doc.querySelector('[data-review-candidate="'+candidate.id+'"]').click();
      await wait(()=>text().includes('Application data could not be displayed safely.'),'UUID mismatch');assert(!doc.querySelector('[data-testid="application-detail"]'),'mismatched UUID rendered');await click('Close reviews');intercept=null;
    });
    await test('held review detail success/error/obsolete auth cannot replace newer selection or finalization',async()=>{
      await openReviews();

      const second=document.createElement('iframe');second.title='Second disposable tab context';second.style.cssText='width:100%;height:400px';second.src='/#/workspaces/1';document.body.appendChild(second);
      await wait(()=>second.contentDocument?.querySelector('#root')?.textContent.includes('Connected to A.'),'second context');
      const secondDoc=second.contentDocument;Array.from(secondDoc.querySelectorAll('button')).find(b=>b.textContent==='Extraction evidence').click();

      Array.from(secondDoc.querySelectorAll('button')).find(b=>b.textContent.startsWith('Source '+fixtures.sources.zero+' —')).click();
      await wait(()=>secondDoc.querySelector('#root').textContent.includes('0 outputs'),'second history');
      assert(second.contentWindow.__fixtureTraffic.length>0&&second.contentWindow.__fixtureTraffic.every(call=>traffic.includes(call)),'second document traffic missing');assert(text().includes('Connected to B.')&&!text().includes('History for source'),'context leaked');second.remove();
    });
    await test('unsafe source-list identity rejected without imprecise route',async()=>{
      await click('Extraction evidence');await wait(()=>text().includes('No retained sources'),'open B');await click('Close extraction evidence');
      const requests=[];

      await click('Extraction evidence');await wait(()=>text().includes('This identifier cannot be represented safely'),'unsafe source');assert(!requests.some(p=>p.includes('posting-extractions')),'imprecise route');await click('Close extraction evidence');win.__fixtureIntercept=null;

    await test('collected forbidden requests are rejected after document replacement',async()=>{
      const probes=[{url:'/api/workspaces/1/applications/',method:'POST'},
                    {url:'/api/email/sync',method:'GET'},{url:'/api/email/sync',method:'POST'},
                    {url:'/api/workspaces/1/retained-messages/1/',method:'GET'},
                    {url:'/api/workspaces/1/retained-messages/',method:'PATCH'},
                    {url:'/api/job-postings',method:'GET'},
                    {url:'/api/workspaces/1/application-reviews/1/attach/',method:'POST'},
                    {url:'/api/workspaces/1/application-reviews/1/?creation_results_after=1',method:'GET'},
                    {url:'/api/workspaces/1/applications/1/messages/',method:'GET'},
                    {url:'/api/workspaces/1/categories/',method:'GET'}];
      const prior=win.__fixtureIntercept;
      try {
        for(const probe of probes){
          // Exercise the real captured-fetch logger, but never transmit the forbidden call.
          win.__fixtureIntercept=url=>url===probe.url?response(200,{testOnly:true}):null;
          const before=traffic.length;
          await win.fetch(probe.url,{method:probe.method});
          assert(traffic.length===before+1,'injected call bypassed aggregate logger');
          const recorded=traffic[before];
          assert(recorded.url===probe.url&&recorded.method===probe.method,'wrong collected probe');
          let rejected=false;try { assertTraffic([recorded]); } catch (_) { rejected=true; }
          assert(rejected,'forbidden collected request accepted');rejectedProbes.add(recorded);
        }
      } finally { win.__fixtureIntercept=prior; }
    });
    await test('entire product traffic allowlist covers all document lifetimes',async()=>{
      assert(traffic.length>0,'no product traffic collected');
      assert(rejectedProbes.size===10,'negative probes incomplete');
      for(const call of traffic){
        if(rejectedProbes.has(call))assert(!allowedTraffic(call),'forbidden probe became allowed');
        else assertTraffic([call]);
      }
    });
    frame.remove();
    output.textContent += `${passed} passed; 0 failed\n` + navigator.userAgent;
  } catch(e) { output.textContent += 'FAIL ' + e.stack + '\n' + `${passed} passed; 1 failed`; }
  finally { this.disabled = false; }
