name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  django-tests:
    name: Django tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test_sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # App names are listed on purpose; see the Tests section of the README.
      - run: python manage.py test accounts applications core documents email_sync postings web
      - run: python manage.py test gateway
        env:
          JTH_GATEWAY: "true"

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    # Informational until `ruff check .` is clean locally; then delete this line.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.8"
      - run: ruff check .

  legacy-tests:
    name: Legacy app tests (pytest)
    runs-on: ubuntu-latest
    # Informational: the status document records 6 known failures. Delete this line once triaged.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            _app/requirements.txt
            requirements-dev.txt
      - run: pip install -r _app/requirements.txt -r requirements-dev.txt
      - run: pytest -q
